<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote Camera</title>
  <style>
    body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}
    h2{margin:20px 0 10px}
    #status{margin:12px;font-size:18px}
    video{width:95%;max-width:900px;background:#000;margin-top:15px}
  </style>
</head>
<body>
<h2>📷 Remote Camera</h2>
<div id="status">Connecting...</div>
<video id="video" autoplay playsinline controls></video>

<script>
const status = document.getElementById("status");
const video = document.getElementById("video");
const wsScheme = location.protocol === "https:" ? "wss:" : "ws:";
const ws = new WebSocket(wsScheme + "//" + location.host);

let role, pc, localStream;
let pendingCandidates = [];

function makePeer() {
  pc = new RTCPeerConnection({
    iceServers: [{urls:"stun:stun.l.google.com:19302"}]
  });

  pc.onicecandidate = e => {
    if (e.candidate && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({type:"candidate", candidate:e.candidate}));
  };

  pc.ontrack = e => {
    if (e.streams[0]) {
      video.srcObject = e.streams[0];
      video.play().catch(()=>{});
      status.textContent = "🟢 CAMERA A IS LIVE";
    }
  };

  pc.onconnectionstatechange = () => {
    if (role === "viewer" && ["failed","disconnected","closed"].includes(pc.connectionState))
      status.textContent = "🔴 Camera A is offline";
  };
}

ws.onopen = () => status.textContent = "Connected...";

ws.onmessage = async e => {
  const msg = JSON.parse(e.data);

  if (msg.type === "role") {
    role = msg.role;
    makePeer();

    if (role === "camera") {
      status.textContent = "Allow camera permission...";
      try {
        localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:false});
        video.srcObject = localStream;
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        status.textContent = "🟢 Camera A is ON — waiting for viewer...";
      } catch {
        status.textContent = "❌ Camera permission denied";
      }
    } else {
      status.textContent = "👁️ Camera B — waiting for Camera A...";
    }
  }

  if (msg.type === "viewer-ready" && role === "camera") {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    ws.send(JSON.stringify({type:"offer", offer:pc.localDescription}));
  }

  if (msg.type === "offer" && role === "viewer") {
    await pc.setRemoteDescription(msg.offer);
    for (const c of pendingCandidates) await pc.addIceCandidate(c).catch(()=>{});
    pendingCandidates = [];
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    ws.send(JSON.stringify({type:"answer", answer:pc.localDescription}));
  }

  if (msg.type === "answer" && role === "camera")
    await pc.setRemoteDescription(msg.answer);

  if (msg.type === "candidate") {
    if (pc.remoteDescription) await pc.addIceCandidate(msg.candidate).catch(()=>{});
    else pendingCandidates.push(msg.candidate);
  }

  if (msg.type === "camera-offline") {
    status.textContent = "🔴 Camera A is offline";
    video.srcObject = null;
  }
};

ws.onclose = () => status.textContent = "🔴 Server connection closed";
</script>
</body>
</html>
