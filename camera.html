<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera A</title>
<style>body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}h1{font-size:26px}#status{font-size:18px;margin:15px}video{width:95%;max-width:900px;background:#000}</style></head>
<body><h1>📷 Camera A</h1><div id="status">Connecting...</div><video id="video" autoplay muted playsinline></video>
<script>
const status=document.getElementById("status"), video=document.getElementById("video");
const ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/camera");
let pc,stream;
function peer(){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({type:"candidate",candidate:e.candidate}))};}
ws.onmessage=async e=>{const m=JSON.parse(e.data);
if(m.type==="role"){peer();try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});video.srcObject=stream;stream.getTracks().forEach(t=>pc.addTrack(t,stream));status.textContent="🟢 Camera A is LIVE — waiting for viewer";}catch(err){status.textContent="❌ Camera permission denied";}}
if(m.type==="viewer-ready"){const offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:"offer",offer:pc.localDescription}));}
if(m.type==="answer")await pc.setRemoteDescription(m.answer);
if(m.type==="candidate")await pc.addIceCandidate(m.candidate).catch(()=>{});
if(m.type==="error")status.textContent="❌ "+m.message;
};
</script></body></html>
