<!doctype html>

<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Camera A</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 18px 0 8px;
}

#status {
    text-align: center;
    color: #aaa;
    margin: 10px;
}

.camera-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
    padding: 12px;
    max-width: 1000px;
    margin: auto;
}

.card {
    background: #161616;
    border-radius: 14px;
    padding: 10px;
}

.card h2 {
    text-align: center;
    margin: 8px;
    font-size: 20px;
}

video {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    object-fit: contain;
    display: block;
    border-radius: 10px;
}

#details {
    text-align: center;
    color: #aaa;
    padding: 15px;
}

.ok {
    color: #00e676 !important;
}

.error {
    color: #ff5252 !important;
}

</style>

</head>

<body>

<h1>Camera A</h1>

<div id="status">
    Connecting...
</div>

<div class="camera-grid">

    <div class="card">

        <h2>
            📷 FRONT CAMERA
        </h2>

        <video
            id="frontVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>


    <div class="card">

        <h2>
            📷 BACK CAMERA
        </h2>

        <video
            id="backVideo"
            autoplay
            muted
            playsinline>
        </video>

    </div>

</div>

<div id="details">
    Waiting for camera permission...
</div>


<script>

const frontVideo =
    document.getElementById(
        "frontVideo"
    );

const backVideo =
    document.getElementById(
        "backVideo"
    );

const status =
    document.getElementById(
        "status"
    );

const details =
    document.getElementById(
        "details"
    );


const wsProtocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


let ws;

let frontStream = null;
let backStream = null;

const peers = new Map();

const cameraId =
    "camera-" +
    Math.random()
        .toString(36)
        .substring(2, 10);


// ====================================================
// WEBSOCKET
// ====================================================

function connect() {

    ws = new WebSocket(
        wsProtocol +
        "//" +
        location.host
    );


    ws.onopen = async () => {

        console.log(
            "WebSocket connected"
        );

        status.textContent =
            "Connected";

        ws.send(
            JSON.stringify({
                type:
                    "camera-register",
                cameraId:
                    cameraId
            })
        );


        // Automatically start both
        await startBothCameras();

    };


    ws.onmessage = async (event) => {

        let msg;

        try {
            msg =
                JSON.parse(
                    event.data
                );
        } catch {
            return;
        }


        console.log(
            "SERVER:",
            msg.type
        );


        if (
            msg.type ===
            "start-view"
        ) {

            await createPeer(
                msg.viewerId
            );

        }


        if (
            msg.type ===
            "answer"
        ) {

            await handleAnswer(
                msg
            );

        }


        if (
            msg.type ===
            "ice"
        ) {

            await handleIce(
                msg
            );

        }

    };


    ws.onclose = () => {

        status.textContent =
            "Disconnected";

        setTimeout(
            connect,
            3000
        );

    };

}


// ====================================================
// START BOTH CAMERAS
// ====================================================

async function startBothCameras() {

    status.textContent =
        "Requesting FRONT camera...";


    try {

        // FRONT
        frontStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            exact: "user"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                });


        frontVideo.srcObject =
            frontStream;


        await frontVideo.play();


        console.log(
            "FRONT CAMERA OK"
        );


        status.textContent =
            "Front camera allowed. Requesting BACK...";


    } catch (error) {

        console.error(
            "FRONT CAMERA ERROR:",
            error
        );

        details.textContent =
            "Front camera: " +
            error.name +
            " - " +
            error.message;

        status.className =
            "error";

        return;
    }


    // ================================================
    // BACK CAMERA
    // ================================================

    try {

        backStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            exact: "environment"
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                });


        backVideo.srcObject =
            backStream;


        await backVideo.play();


        console.log(
            "BACK CAMERA OK"
        );


        status.textContent =
            "🟢 FRONT + BACK CAMERAS LIVE";

        status.className =
            "ok";


        details.textContent =
            "Both cameras are active.";


    } catch (error) {

        console.error(
            "BACK CAMERA ERROR:",
            error
        );


        status.textContent =
            "FRONT camera is active";


        details.textContent =
            "Android/Chrome did not allow the BACK camera simultaneously. " +
            error.name;


        status.className =
            "error";

    }

}


// ====================================================
// CREATE WEBRTC CONNECTION
// ====================================================

async function createPeer(
    viewerId
) {

    console.log(
        "Creating peer for:",
        viewerId
    );


    if (peers.has(viewerId)) {

        try {
            peers.get(viewerId).pc.close();
        } catch {}

        peers.delete(viewerId);
    }


    const pc =
        new RTCPeerConnection({

            iceServers: [
                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }
            ]

        });


    const peer = {
        pc,
        remoteDescriptionSet: false,
        iceQueue: []
    };


    peers.set(
        viewerId,
        peer
    );


    // ================================================
    // ADD FRONT TRACK
    // ================================================

    if (frontStream) {

        const track =
            frontStream
                .getVideoTracks()[0];

        if (track) {

            pc.addTrack(
                track,
                frontStream
            );

            console.log(
                "Added FRONT track"
            );

        }

    }


    // ================================================
    // ADD BACK TRACK
    // ================================================

    if (backStream) {

        const track =
            backStream
                .getVideoTracks()[0];

        if (track) {

            pc.addTrack(
                track,
                backStream
            );

            console.log(
                "Added BACK track"
            );

        }

    }


    // ================================================
    // ICE
    // ================================================

    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                send({

                    type: "ice",

                    viewerId:
                        viewerId,

                    candidate:
                        event.candidate

                });

            }

        };


    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                pc.iceConnectionState
            );

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                "Connection:",
                pc.connectionState
            );

        };


    // ================================================
    // OFFER
    // ================================================

    try {

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        send({

            type: "offer",

            viewerId:
                viewerId,

            offer:
                pc.localDescription

        });


        console.log(
            "OFFER SENT"
        );

    } catch (error) {

        console.error(
            "Offer error:",
            error
        );

    }

}


// ====================================================
// ANSWER
// ====================================================

async function handleAnswer(msg) {

    const peer =
        peers.get(
            msg.viewerId
        );

    if (!peer) {
        return;
    }


    try {

        await peer.pc
            .setRemoteDescription(
                new RTCSessionDescription(
                    msg.answer
                )
            );


        peer.remoteDescriptionSet =
            true;


        for (
            const candidate
            of peer.iceQueue
        ) {

            await peer.pc
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }


        peer.iceQueue = [];


    } catch (error) {

        console.error(
            "Answer error:",
            error
        );

    }

}


// ====================================================
// ICE FROM VIEWER
// ====================================================

async function handleIce(msg) {

    const peer =
        peers.get(
            msg.viewerId
        );

    if (!peer) {
        return;
    }


    if (
        !peer.remoteDescriptionSet
    ) {

        peer.iceQueue.push(
            msg.candidate
        );

        return;

    }


    try {

        await peer.pc
            .addIceCandidate(
                new RTCIceCandidate(
                    msg.candidate
                )
            );

    } catch (error) {

        console.error(
            "ICE error:",
            error
        );

    }

}


// ====================================================
// SEND
// ====================================================

function send(data) {

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

    }

}


// ====================================================
// START
// ====================================================

connect();

</script>

</body>

</html>
