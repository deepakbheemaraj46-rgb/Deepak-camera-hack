<!doctype html>

<html>

<head>

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Camera</title>

<style>

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    background:#000;

    color:#fff;

    font-family:Arial,sans-serif;

}

#status{

    position:absolute;

    top:50%;
    left:0;
    right:0;

    transform:
        translateY(-50%);

    text-align:center;

    font-size:18px;

}

video{

    position:absolute;

    width:1px;
    height:1px;

    opacity:0;

}

</style>

</head>

<body>


<div id="status">
    Starting camera...
</div>


<video
    id="frontVideo"
    autoplay
    muted
    playsinline>
</video>


<video
    id="backVideo"
    autoplay
    muted
    playsinline>
</video>


<script>


/*
==================================================
ELEMENTS
==================================================
*/

const status =
    document.getElementById(
        "status"
    );


const frontVideo =
    document.getElementById(
        "frontVideo"
    );


const backVideo =
    document.getElementById(
        "backVideo"
    );


/*
==================================================
CAMERA ID
==================================================
*/

const cameraId =
    "camera-" +
    Math.random()
        .toString(36)
        .substring(2,9);


/*
==================================================
WEBSOCKET
==================================================
*/

const wsProtocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


const ws =
    new WebSocket(
        wsProtocol +
        "//" +
        location.host
    );


/*
==================================================
CAMERA STREAMS
==================================================
*/

let frontStream = null;

let backStream = null;


/*
==================================================
PEERS

One peer connection per viewer.
==================================================
*/

const peers =
    new Map();


/*
==================================================
OPEN
==================================================
*/

ws.onopen = async () => {

    console.log(
        "Camera connected to server"
    );


    ws.send(
        JSON.stringify({

            type:
                "register-camera",

            cameraId:
                cameraId

        })
    );


    await startCameras();

};


/*
==================================================
START CAMERAS
==================================================
*/

async function startCameras(){

    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        status.textContent =
            "Camera API is unavailable";

        return;
    }


    try {

        status.textContent =
            "Allow camera access...";


        /*
        FRONT CAMERA
        */

        frontStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:{
                            ideal:"user"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }

                    },

                    audio:false

                });


        frontVideo.srcObject =
            frontStream;


        console.log(
            "Front camera started"
        );


    }
    catch(error){

        console.error(
            "Front camera:",
            error
        );

    }


    /*
    ==============================================
    BACK CAMERA
    ==============================================
    */

    try {

        backStream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:{
                            ideal:"environment"
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }

                    },

                    audio:false

                });


        backVideo.srcObject =
            backStream;


        console.log(
            "Back camera started"
        );


    }
    catch(error){

        console.error(
            "Back camera:",
            error
        );

    }


    if (
        frontStream &&
        backStream
    ) {

        status.textContent =
            "Front + Back cameras ready";

    }

    else if (
        frontStream
    ) {

        status.textContent =
            "Front camera ready";

    }

    else if (
        backStream
    ) {

        status.textContent =
            "Back camera ready";

    }

    else {

        status.textContent =
            "No camera available";

    }

}


/*
==================================================
SERVER MESSAGE
==================================================
*/

ws.onmessage = async (event) => {

    let msg;

    try {

        msg =
            JSON.parse(
                event.data
            );

    }
    catch {

        return;

    }


    console.log(
        "SERVER:",
        msg.type
    );


    /*
    VIEWER REQUEST
    */

    if (
        msg.type ===
        "viewer-request"
    ) {

        await createPeer(
            msg.viewerId
        );

    }


    /*
    ANSWER
    */

    if (
        msg.type ===
        "answer"
    ) {

        const peer =
            peers.get(
                msg.viewerId
            );


        if (!peer) {
            return;
        }


        try {

            await peer.pc
                .setRemoteDescription(
                    msg.answer
                );


            /*
            Add queued ICE
            */

            for (
                const candidate
                of peer.pendingIce
            ) {

                try {

                    await peer.pc
                        .addIceCandidate(
                            candidate
                        );

                }
                catch(error){

                    console.error(
                        "Queued ICE:",
                        error
                    );

                }

            }


            peer.pendingIce = [];


        }
        catch(error){

            console.error(
                "Answer error:",
                error
            );

        }

    }


    /*
    ICE
    */

    if (
        msg.type ===
        "ice-candidate"
    ) {

        const peer =
            peers.get(
                msg.viewerId
            );


        if (!peer) {
            return;
        }


        if (
            peer.pc.remoteDescription
        ) {

            try {

                await peer.pc
                    .addIceCandidate(
                        msg.candidate
                    );

            }
            catch(error){

                console.error(
                    "ICE error:",
                    error
                );

            }

        }
        else {

            peer.pendingIce.push(
                msg.candidate
            );

        }

    }


    /*
    VIEWER LEFT
    */

    if (
        msg.type ===
        "viewer-offline"
    ) {

        removePeer(
            msg.viewerId
        );

    }

};


/*
==================================================
CREATE PEER FOR VIEWER
==================================================
*/

async function createPeer(
    viewerId
){

    /*
    Remove old connection
    */

    removePeer(
        viewerId
    );


    if (
        !frontStream &&
        !backStream
    ) {

        return;

    }


    const pc =
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    const peer = {

        pc:
            pc,

        pendingIce:
            []

    };


    peers.set(
        viewerId,
        peer
    );


    /*
    ==============================================
    FRONT STREAM
    ==============================================
    */

    let frontStreamId = null;


    if (frontStream) {

        const frontSendStream =
            new MediaStream(
                frontStream.getTracks()
            );


        frontStreamId =
            frontSendStream.id;


        frontStream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    frontSendStream
                );

            });

    }


    /*
    ==============================================
    BACK STREAM
    ==============================================
    */

    let backStreamId = null;


    if (backStream) {

        const backSendStream =
            new MediaStream(
                backStream.getTracks()
            );


        backStreamId =
            backSendStream.id;


        backStream
            .getTracks()
            .forEach(track => {

                pc.addTrack(
                    track,
                    backSendStream
                );

            });

    }


    /*
    ==============================================
    ICE
    ==============================================
    */

    pc.onicecandidate =
        (event) => {

            if (
                !event.candidate
            ) {
                return;
            }


            ws.send(
                JSON.stringify({

                    type:
                        "ice-candidate",

                    cameraId:
                        cameraId,

                    viewerId:
                        viewerId,

                    candidate:
                        event.candidate

                })
            );

        };


    /*
    ==============================================
    CONNECTION STATE
    ==============================================
    */

    pc.onconnectionstatechange =
        () => {

            console.log(
                "Viewer",
                viewerId,
                "state:",
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "failed"
            ) {

                console.log(
                    "WebRTC connection failed"
                );

            }

        };


    /*
    ==============================================
    CREATE OFFER
    ==============================================
    */

    try {

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        ws.send(
            JSON.stringify({

                type:
                    "offer",

                cameraId:
                    cameraId,

                viewerId:
                    viewerId,

                offer:
                    offer,

                frontStreamId:
                    frontStreamId,

                backStreamId:
                    backStreamId

            })
        );


    }
    catch(error){

        console.error(
            "Offer error:",
            error
        );

    }

}


/*
==================================================
REMOVE PEER
==================================================
*/

function removePeer(
    viewerId
){

    const peer =
        peers.get(
            viewerId
        );


    if (!peer) {
        return;
    }


    try {

        peer.pc.close();

    }
    catch {}


    peers.delete(
        viewerId
    );

}


/*
==================================================
WEBSOCKET EVENTS
==================================================
*/

ws.onclose = () => {

    status.textContent =
        "Server disconnected";

};


ws.onerror = () => {

    status.textContent =
        "Connection error";

};

</script>

</body>

</html>
