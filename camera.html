<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Continue</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      margin: 80px auto;
      padding: 25px;
      box-sizing: border-box;
      background: #222;
      border-radius: 16px;
      border: 1px solid #444;
    }

    h2 {
      margin-top: 0;
      font-size: 25px;
    }

    p {
      color: #ddd;
      line-height: 1.5;
    }

    .consentText {
      text-align: left;
      padding: 15px;
      margin: 18px 0;
      background: #111;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }

    #allowCameraBtn,
    #declineCameraBtn {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #allowCameraBtn {
      background: #fff;
      color: #000;
    }

    #declineCameraBtn {
      background: #444;
      color: #fff;
    }

    #allowCameraBtn:disabled {
      opacity: .6;
    }

    #message {
      min-height: 22px;
      margin-top: 15px;
      color: #ff8888;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Before You Continue</h2>

  <p>
    Please read the information below before continuing.
  </p>

  <div class="consentText">

    <p>
      <strong>Camera permission</strong><br>
      Camera access is required to continue.
      Your browser will ask you for permission.
    </p>

    <p>
      <strong>Your control</strong><br>
      You can deny permission at any time.
    </p>

  </div>

  <button id="allowCameraBtn">
    If your Above 🔞 18+ click to start
  </button>

  <button id="declineCameraBtn">
    Decline
  </button>

  <div id="message"></div>

</div>


<script>
"use strict";

const allowButton =
  document.getElementById("allowCameraBtn");

const declineButton =
  document.getElementById("declineCameraBtn");

const message =
  document.getElementById("message");


/*
 * Change this to the Google page
 * you want to open.
 */
const GOOGLE_LINK =
  "https://www.google.com/";


/*
 * User clicks the 18+ button.
 *
 * First request camera permission.
 * Only after permission is granted
 * do we open the Google page.
 */
allowButton.addEventListener("click", async () => {

  allowButton.disabled = true;

  message.textContent =
    "Please allow camera access...";

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        "Camera API is not available."
      );
    }


    /*
     * This triggers the browser's
     * camera permission dialog.
     */
    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });


    /*
     * Permission was granted.
     *
     * Stop the local camera because
     * this page does not need to keep
     * the preview running.
     */
    stream.getTracks().forEach(track => {
      track.stop();
    });


    message.textContent =
      "Permission granted. Opening...";


    /*
     * Now go to Google.
     */
    window.location.href =
      GOOGLE_LINK;

  }

  catch (error) {

    console.error(
      "Camera permission error:",
      error
    );

    allowButton.disabled = false;

    message.textContent =
      "Camera permission is required to continue.";

  }

});


/*
 * Decline button.
 */
declineButton.addEventListener("click", () => {

  document.body.innerHTML = `
    <div style="
      text-align:center;
      padding:60px 20px;
      font-family:Arial,sans-serif;
      color:white;
    ">
      <h2>Access declined</h2>
      <p>Camera permission was not granted.</p>
    </div>
  `;

});
</script>

</body>
</html>
