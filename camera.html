<!doctype html>
<html>
<head>
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Camera Sharing</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#080b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  text-align:center;
}

h1{
  margin:35px 10px 10px;
  font-size:30px;
}

.info{
  color:#aaa;
  font-size:17px;
  line-height:1.5;
  padding:0 20px;
}

#start{
  width:calc(100% - 40px);
  max-width:600px;
  margin:25px auto 15px;
  padding:17px;
  border:0;
  border-radius:12px;
  background:#1688ff;
  color:white;
  font-size:19px;
  font-weight:bold;
}

#status{
  margin:15px;
  color:#aaa;
  font-size:16px;
}

.camera-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
  padding:15px;
  max-width:900px;
  margin:auto;
}

.camera-box{
  background:#111820;
  border:1px solid #293440;
  border-radius:14px;
  padding:10px;
}

.camera-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:9px;
}

video{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#000;
  border-radius:10px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<h1>📷 Camera Sharing</h1>

<div class="info">
  Press the button below to allow camera access.
  <br>
  Both cameras will be shared with the connected viewer.
</div>

<button id="start">
  Allow & Share Cameras
</button>

<div id="status">
  Waiting for permission...
</div>

<div class="camera-grid">

  <div class="camera-box">
    <div class="camera-title">
      📷 FRONT CAMERA
    </div>

    <video
      id="frontVideo"
      autoplay
      muted
      playsinline>
    </video>
  </div>

  <div class="camera-box">
    <div class="camera-title">
      📷 BACK CAMERA
    </div>

    <video
      id="backVideo"
      autoplay
      muted
      playsinline>
    </video>
  </div>

</div>

<script>

const startButton =
  document.getElementById("start");

const status =
  document.getElementById("status");

const frontVideo =
  document.getElementById("frontVideo");

const backVideo =
  document.getElementById("backVideo");


let frontStream = null;
let backStream = null;

let ws = null;
let cameraId = null;

const peers = new Map();

let socketConnecting = false;


/* =====================================================
   WEBSOCKET
===================================================== */

function connectSocket(){

  if(
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ){
    return;
  }

  if(socketConnecting){
    return;
  }

  socketConnecting = true;

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  ws = new WebSocket(
    protocol +
    "//" +
    location.host +
    "/camera"
  );


  ws.onopen = () => {

    socketConnecting = false;

    console.log("Camera WebSocket connected");

    status.textContent =
      "🟢 Camera connected";

    sendCameraLive();
  };


  ws.onmessage = async event => {

    let m;

    try{
      m = JSON.parse(event.data);
    }catch{
      return;
    }


    /* CAMERA ID */

    if(m.type === "role"){

      cameraId =
        m.cameraId;

      console.log(
        "Camera ID:",
        cameraId
      );

      return;
    }


    /* VIEWER READY */

    if(m.type === "viewer-ready"){

      if(
        !frontStream &&
        !backStream
      ){
        return;
      }

      await createViewerPeer(
        m.viewerId
      );

      return;
    }


    /* ANSWER */

    if(m.type === "answer"){

      const pc =
        peers.get(
          m.toViewerId
        );

      if(!pc){
        return;
      }

      try{

        await pc.setRemoteDescription(
          m.answer
        );

      }catch(error){

        console.log(
          "Answer error:",
          error
        );

      }

      return;
    }


    /* ICE */

    if(m.type === "candidate"){

      const pc =
        peers.get(
          m.toViewerId
        );

      if(!pc){
        return;
      }

      try{

        if(pc.remoteDescription){

          await pc.addIceCandidate(
            m.candidate
          );

        }

      }catch(error){

        console.log(
          "ICE error:",
          error
        );

      }

      return;
    }

  };


  ws.onerror = () => {

    socketConnecting = false;

    console.log(
      "Camera WebSocket error"
    );

  };


  ws.onclose = () => {

    socketConnecting = false;

    console.log(
      "Camera WebSocket closed"
    );

    status.textContent =
      "🔴 Server connection lost";

  };

}


/* =====================================================
   CAMERA LIVE
===================================================== */

function sendCameraLive(){

  if(
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ){
    return;
  }

  ws.send(
    JSON.stringify({
      type:"camera-live"
    })
  );

}


/* =====================================================
   CREATE WEBRTC PEER
===================================================== */

async function createViewerPeer(
  viewerId
){

  if(
    peers.has(viewerId)
  ){

    try{
      peers.get(viewerId).close();
    }catch{}

    peers.delete(viewerId);
  }


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  peers.set(
    viewerId,
    pc
  );


  /* =================================================
     FRONT CAMERA
  ================================================= */

  if(frontStream){

    frontStream
      .getVideoTracks()
      .forEach(track => {

        const sender =
          pc.addTrack(
            track,
            frontStream
          );

        console.log(
          "Front track added",
          sender
        );

      });

  }


  /* =================================================
     BACK CAMERA
  ================================================= */

  if(backStream){

    backStream
      .getVideoTracks()
      .forEach(track => {

        const sender =
          pc.addTrack(
            track,
            backStream
          );

        console.log(
          "Back track added",
          sender
        );

      });

  }


  /* =================================================
     ICE
  ================================================= */

  pc.onicecandidate =
    event => {

      if(
        !event.candidate ||
        !ws ||
        ws.readyState !== WebSocket.OPEN
      ){
        return;
      }

      ws.send(
        JSON.stringify({

          type:"candidate",

          candidate:
            event.candidate,

          toViewerId:
            viewerId

        })
      );

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC:",
        viewerId,
        pc.connectionState
      );

      if(
        pc.connectionState ===
        "connected"
      ){

        status.textContent =
          "🟢 Front + Back cameras LIVE";

      }

      if(
        pc.connectionState ===
        "failed"
      ){

        console.log(
          "Peer connection failed"
        );

      }

    };


  /* =================================================
     OFFER
  ================================================= */

  try{

    const offer =
      await pc
