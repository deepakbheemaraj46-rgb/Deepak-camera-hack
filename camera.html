<!doctype html>

<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Camera</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#status{
    position:fixed;
    left:0;
    right:0;
    top:50%;
    transform:translateY(-50%);
    text-align:center;
    font-size:18px;
    padding:20px;
}

video{
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}

</style>

</head>

<body>

<div id="status">
    Starting camera...
</div>

<video
    id="localVideo"
    autoplay
    muted
    playsinline>
</video>


<script>

/*
==================================================
ELEMENTS
==================================================
*/

const status =
    document.getElementById(
        "status"
    );

const localVideo =
    document.getElementById(
        "localVideo"
    );


/*
==================================================
CAMERA ID
==================================================
*/

const cameraId =
    "camera-" +
    Math.random()
    .toString(36)
    .substring(2, 10);


/*
==================================================
WEBSOCKET
==================================================
*/

const wsProtocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

let ws = null;


/*
==================================================
CURRENT CAMERA
==================================================
*/

let stream = null;

let currentFacing = "user";


/*
==================================================
VIEWER PEERS
==================================================
*/

const peers = new Map();


/*
==================================================
CONNECT WEBSOCKET
==================================================
*/

function connectWebSocket(){

    ws = new WebSocket(
        wsProtocol +
        "//" +
        location.host
    );


    ws.onopen = async () => {

        console.log(
            "WebSocket connected"
        );

        ws.send(JSON.stringify({
            type: "camera-register",
            cameraId: cameraId
        }));

        status.textContent =
            "Requesting camera permission...";

        await startCamera(
            currentFacing
        );
    };


    ws.onmessage = async (event) => {

        let msg;

        try {
            msg = JSON.parse(
                event.data
            );
        }

        catch {
            return;
        }


        /*
        ------------------------------------------
        VIEWER WANTS VIDEO
        ------------------------------------------
        */

        if (
            msg.type ===
            "start-view"
        ) {

            await createViewerPeer(
                msg.viewerId
            );

            return;
        }


        /*
        ------------------------------------------
        FRONT / BACK REQUEST
        ------------------------------------------
        */

        if (
            msg.type ===
            "switch-camera"
        ) {

            await switchCamera(
                msg.facing
            );

            return;
        }


        /*
        ------------------------------------------
        ANSWER FROM VIEWER
        ------------------------------------------
        */

        if (
            msg.type ===
            "answer"
        ) {

            await handleAnswer(
                msg
            );

            return;
        }


        /*
        ------------------------------------------
        ICE FROM VIEWER
        ------------------------------------------
        */

        if (
            msg.type ===
            "ice"
        ) {

            await handleRemoteIce(
                msg
            );

            return;
        }

    };


    ws.onclose = () => {

        console.log(
            "WebSocket disconnected"
        );

        status.textContent =
            "Server disconnected. Reconnecting...";

        setTimeout(
            connectWebSocket,
            3000
        );

    };


    ws.onerror = () => {

        console.log(
            "WebSocket error"
        );

    };

}


/*
==================================================
START CAMERA
==================================================
*/

async function startCamera(
    facing
){

    try {

        /*
        Stop old stream
        */

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

            stream = null;
        }


        status.textContent =
            facing === "user"
            ? "Starting FRONT camera..."
            : "Starting BACK camera...";


        /*
        First try exact camera
        */

        try {

            stream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            exact: facing
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false

                });

        }

        catch (firstError) {

            console.log(
                "Exact camera failed:",
                firstError
            );


            /*
            Fallback
            */

            stream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            ideal: facing
                        },

                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        }
                    },

                    audio: false

                });

        }


        currentFacing = facing;

        localVideo.srcObject =
            stream;

        await localVideo.play();


        status.textContent =
            "Camera is LIVE";


        console.log(
            "Camera started:",
            facing
        );


        /*
        Replace camera track
        for existing viewers
        */

        for (
            const [
                viewerId,
                peer
            ]
            of peers
        ) {

            const newTrack =
                stream.getVideoTracks()[0];

            if (!newTrack) {
                continue;
            }


            const sender =
                peer.pc
                .getSenders()
                .find(
                    s =>
                        s.track &&
                        s.track.kind ===
                        "video"
                );


            if (sender) {

                try {

                    await sender.replaceTrack(
                        newTrack
                    );

                }

                catch (error) {

                    console.error(
                        "replaceTrack:",
                        error
                    );

                }

            }

            else {

                peer.pc.addTrack(
                    newTrack,
                    stream
                );

            }


            /*
            Renegotiate after
            camera switch
            */

            await createOffer(
                viewerId
            );

        }

    }

    catch (error) {

        console.error(
            "Camera error:",
            error
        );

        status.textContent =
            "Camera permission denied or camera unavailable.";

    }

}


/*
==================================================
CREATE PEER FOR VIEWER
==================================================
*/

async function createViewerPeer(
    viewerId
){

    /*
    Remove previous connection
    */

    removePeer(
        viewerId
    );


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }

            ]

        });


    const peer = {

        pc: pc,

        remoteIceQueue: [],

        remoteDescriptionSet: false

    };


    peers.set(
        viewerId,
        peer
    );


    /*
    Add current camera track
    */

    if (stream) {

        const videoTrack =
            stream
            .getVideoTracks()[0];

        if (videoTrack) {

            pc.addTrack(
                videoTrack,
                stream
            );

        }

    }


    /*
    ICE candidate
    */

    pc.onicecandidate =
        (event) => {

            if (
                !event.candidate
            ) {
                return;
            }

            sendToServer({

                type: "ice",

                cameraId:
                    cameraId,

                viewerId:
                    viewerId,

                candidate:
                    event.candidate

            });

        };


    /*
    Connection state
    */

    pc.onconnectionstatechange =
        () => {

            console.log(
                "Viewer:",
                viewerId,
                "state:",
                pc.connectionState
            );

            if (
                pc.connectionState ===
                "failed"
            ) {

                console.log(
                    "Connection failed"
                );

            }

        };


    /*
    Create offer
    */

    await createOffer(
        viewerId
    );

}


/*
==================================================
CREATE OFFER
==================================================
*/

async function createOffer(
    viewerId
){

    const peer =
        peers.get(
            viewerId
        );

    if (!peer) {
        return;
    }


    const pc =
        peer.pc;


    try {

        const offer =
            await pc.createOffer({

                offerToReceiveVideo:
                    false

            });


        await pc.setLocalDescription(
            offer
        );


        sendToServer({

            type: "offer",

            cameraId:
                cameraId,

            viewerId:
                viewerId,

            offer:
                pc.localDescription

        });


        console.log(
            "Offer sent to:",
            viewerId
        );

    }

    catch (error) {

        console.error(
            "Create offer:",
            error
        );

    }

}


/*
==================================================
HANDLE ANSWER
==================================================
*/

async function handleAnswer(
    msg
){

    const peer =
        peers.get(
            msg.viewerId
        );

    if (!peer) {
        return;
    }


    try {

        await peer.pc
        .setRemoteDescription(
            new RTCSessionDescription(
                msg.answer
            )
        );


        peer.remoteDescriptionSet =
            true;


        /*
        IMPORTANT:
        Add ICE candidates that
        arrived before the answer.
        */

        for (
            const candidate
            of peer.remoteIceQueue
        ) {

            try {

                await peer.pc
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            }

            catch (error) {

                console.error(
                    "Queued ICE:",
                    error
                );

            }

        }


        peer.remoteIceQueue = [];


        console.log(
            "Answer received:",
            msg.viewerId
        );

    }

    catch (error) {

        console.error(
            "Answer error:",
            error
        );

    }

}


/*
==================================================
HANDLE REMOTE ICE
==================================================
*/

async function handleRemoteIce(
    msg
){

    const peer =
        peers.get(
            msg.viewerId
        );

    if (!peer) {
        return;
    }


    /*
    If remote description
    is not ready, queue it.
    */

    if (
        !peer.remoteDescriptionSet
    ) {

        peer.remoteIceQueue.push(
            msg.candidate
        );

        return;
    }


    try {

        await peer.pc
        .addIceCandidate(
            new RTCIceCandidate(
                msg.candidate
            )
        );

    }

    catch (error) {

        console.error(
            "Remote ICE:",
            error
        );

    }

}


/*
==================================================
SWITCH CAMERA
==================================================
*/

async function switchCamera(
    facing
){

    await startCamera(
        facing
    );

}


/*
==================================================
REMOVE PEER
==================================================
*/

function removePeer(
    viewerId
){

    const peer =
        peers.get(
            viewerId
        );

    if (!peer) {
        return;
    }


    try {
        peer.pc.close();
    }

    catch {}


    peers.delete(
        viewerId
    );

}


/*
==================================================
SEND
==================================================
*/

function sendToServer(
    data
){

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

    }

}


/*
==================================================
START
==================================================
*/

connectWebSocket();

</script>

</body>

</html>
