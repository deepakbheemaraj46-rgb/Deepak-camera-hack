<!doctype html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Camera A</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.header {
    text-align: center;
    padding: 18px;
    font-size: 24px;
    font-weight: bold;
}

#status {
    text-align: center;
    color: #aaa;
    padding: 5px 15px 15px;
}

#videoBox {
    width: 100%;
    max-width: 900px;
    margin: auto;
    background: #000;
}

video {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    object-fit: contain;
    background: #000;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 16px;
    font-size: 17px;
    color: white;
    background: #333;
}

button:active {
    background: #555;
}

#info {
    text-align: center;
    color: #aaa;
    padding: 15px;
}

</style>

</head>

<body>

<div class="header">
    Camera A
</div>

<div id="status">
    Connecting...
</div>

<div id="videoBox">

    <video
        id="localVideo"
        autoplay
        muted
        playsinline>
    </video>

</div>

<div class="controls">

    <button onclick="startCamera('user')">
        📷 FRONT
    </button>

    <button onclick="startCamera('environment')">
        🔄 BACK
    </button>

</div>

<div id="info">
    Camera permission is required.
</div>


<script>

// =====================================================
// ELEMENTS
// =====================================================

const video =
    document.getElementById("localVideo");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");


// =====================================================
// WEBSOCKET
// =====================================================

const wsProtocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

let ws;


// =====================================================
// CAMERA
// =====================================================

let stream = null;

let facingMode = "user";


// =====================================================
// CAMERA ID
// =====================================================

const cameraId =
    "camera-" +
    Math.random()
        .toString(36)
        .substring(2, 10);


// =====================================================
// PEERS
// =====================================================

const peers = new Map();


// =====================================================
// CONNECT
// =====================================================

function connect() {

    const wsUrl =
        wsProtocol +
        "//" +
        location.host;

    console.log(
        "Connecting:",
        wsUrl
    );

    ws = new WebSocket(wsUrl);


    ws.onopen = async () => {

        console.log(
            "WebSocket connected"
        );

        status.textContent =
            "Connected";

        ws.send(
            JSON.stringify({
                type:
                    "camera-register",
                cameraId:
                    cameraId
            })
        );


        await startCamera(
            facingMode
        );

    };


    ws.onmessage = async (event) => {

        let msg;

        try {

            msg =
                JSON.parse(
                    event.data
                );

        } catch {

            return;

        }


        console.log(
            "Server message:",
            msg.type
        );


        // =============================================
        // VIEWER REQUESTED VIDEO
        // =============================================

        if (
            msg.type === "start-view"
        ) {

            await createPeer(
                msg.viewerId
            );

        }


        // =============================================
        // ANSWER FROM VIEWER
        // =============================================

        if (
            msg.type === "answer"
        ) {

            await handleAnswer(
                msg
            );

        }


        // =============================================
        // ICE FROM VIEWER
        // =============================================

        if (
            msg.type === "ice"
        ) {

            await handleIce(
                msg
            );

        }


        // =============================================
        // REMOTE FRONT/BACK REQUEST
        // =============================================

        if (
            msg.type === "switch-camera"
        ) {

            await startCamera(
                msg.facing
            );

        }

    };


    ws.onclose = () => {

        status.textContent =
            "Disconnected";

        setTimeout(
            connect,
            3000
        );

    };


    ws.onerror = () => {

        status.textContent =
            "Connection error";

    };

}


// =====================================================
// START CAMERA
// =====================================================

async function startCamera(
    facing
) {

    try {

        status.textContent =
            facing === "user"
                ? "Starting FRONT camera..."
                : "Starting BACK camera...";


        // Stop previous camera
        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        // Try requested camera
        try {

            stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: {
                            facingMode: {
                                exact: facing
                            },

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }
                        },

                        audio: false

                    });

        } catch {

            // Fallback
            stream =
                await navigator
                    .mediaDevices
                    .getUserMedia({

                        video: {
                            facingMode: {
                                ideal: facing
                            },

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }
                        },

                        audio: false

                    });

        }


        facingMode =
            facing;


        video.srcObject =
            stream;


        await video.play();


        status.textContent =
            facing === "user"
                ? "FRONT CAMERA LIVE"
                : "BACK CAMERA LIVE";


        info.textContent =
            "Camera A is ready for viewing";


        console.log(
            "Camera started:",
            facing
        );


        // Replace track in existing connections
        const newTrack =
            stream.getVideoTracks()[0];


        for (
            const peer of peers.values()
        ) {

            const sender =
                peer.pc
                    .getSenders()
                    .find(
                        s =>
                            s.track &&
                            s.track.kind ===
                            "video"
                    );


            if (
                sender &&
                newTrack
            ) {

                try {

                    await sender.replaceTrack(
                        newTrack
                    );

                } catch (error) {

                    console.error(
                        "replaceTrack:",
                        error
                    );

                }

            }

        }

    } catch (error) {

        console.error(
            "Camera error:",
            error
        );


        status.textContent =
            "Camera permission/error";


        info.textContent =
            error.name +
            ": " +
            error.message;

    }

}


// =====================================================
// CREATE PEER
// =====================================================

async function createPeer(
    viewerId
) {

    // Remove old peer
    if (peers.has(viewerId)) {

        try {

            peers
                .get(viewerId)
                .pc
                .close();

        } catch {}

        peers.delete(
            viewerId
        );

    }


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    const peer = {
        pc: pc,
        remoteDescriptionSet: false,
        iceQueue: []
    };


    peers.set(
        viewerId,
        peer
    );


    // =================================================
    // ADD VIDEO TRACK
    // =================================================

    if (stream) {

        const track =
            stream.getVideoTracks()[0];


        if (track) {

            pc.addTrack(
                track,
                stream
            );

        }

    }


    // =================================================
    // ICE
    // =================================================

    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                send({

                    type: "ice",

                    viewerId:
                        viewerId,

                    candidate:
                        event.candidate

                });

            }

        };


    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "Camera ICE:",
                pc.iceConnectionState
            );

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                "Camera WebRTC:",
                pc.connectionState
            );

        };


    // =================================================
    // CREATE OFFER
    // =================================================

    try {

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        send({

            type: "offer",

            viewerId:
                viewerId,

            offer:
                pc.localDescription

        });


        console.log(
            "Offer sent"
        );

    } catch (error) {

        console.error(
            "Offer error:",
            error
        );

    }

}


// =====================================================
// ANSWER
// =====================================================

async function handleAnswer(
    msg
) {

    const peer =
        peers.get(
            msg.viewerId
        );


    if (!peer) {
        return;
    }


    try {

        await peer.pc
            .setRemoteDescription(
                new RTCSessionDescription(
                    msg.answer
                )
            );


        peer.remoteDescriptionSet =
            true;


        for (
            const candidate
            of peer.iceQueue
        ) {

            await peer.pc
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }


        peer.iceQueue = [];

    } catch (error) {

        console.error(
            "Answer error:",
            error
        );

    }

}


// =====================================================
// ICE FROM VIEWER
// =====================================================

async function handleIce(
    msg
) {

    const peer =
        peers.get(
            msg.viewerId
        );


    if (!peer) {
        return;
    }


    if (
        !peer.remoteDescriptionSet
    ) {

        peer.iceQueue.push(
            msg.candidate
        );

        return;

    }


    try {

        await peer.pc
            .addIceCandidate(
                new RTCIceCandidate(
                    msg.candidate
                )
            );

    } catch (error) {

        console.error(
            "ICE error:",
            error
        );

    }

}


// =====================================================
// SEND
// =====================================================

function send(data) {

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

    }

}


// =====================================================
// START
// =====================================================

connect();

</script>

</body>

</html>
