<!doctype html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Camera</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#status{
    position:fixed;
    top:50%;
    left:0;
    right:0;
    transform:translateY(-50%);
    text-align:center;
    font-size:18px;
}

video{
    width:1px;
    height:1px;
    opacity:0;
    position:absolute;
}

</style>

</head>

<body>

<div id="status">
    Starting camera...
</div>

<video id="camera"
       autoplay
       muted
       playsinline></video>

<script>

const status =
    document.getElementById("status");

const video =
    document.getElementById("camera");


/*
========================================
CAMERA ID
========================================
*/

const cameraId =
    "camera-" +
    Math.random()
    .toString(36)
    .substring(2,10);


/*
========================================
WEBSOCKET
========================================
*/

const protocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

const ws =
    new WebSocket(
        protocol +
        "//" +
        location.host
    );


/*
========================================
CURRENT CAMERA
========================================
*/

let currentFacing = "user";

let stream = null;


/*
========================================
VIEWER CONNECTIONS
========================================
*/

const peers = new Map();


/*
========================================
CONNECT
========================================
*/

ws.onopen = async () => {

    console.log("Server connected");

    ws.send(JSON.stringify({
        type:"camera-register",
        cameraId:cameraId
    }));

    await startCamera("user");
};


/*
========================================
START CAMERA
========================================
*/

async function startCamera(facing){

    try{

        status.textContent =
            "Requesting camera permission...";

        /*
        Stop previous camera
        */

        if(stream){

            stream.getTracks()
            .forEach(track => track.stop());

            stream = null;
        }


        /*
        Open requested camera
        */

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:{
                        exact:facing
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }
                },

                audio:false

            });


        currentFacing = facing;

        video.srcObject = stream;

        await video.play();

        status.textContent =
            "Camera is ready";

        console.log(
            "Camera started:",
            facing
        );


        /*
        Update all active viewers
        */

        for(const [viewerId] of peers){

            await createOffer(viewerId);
        }

    }
    catch(error){

        console.error(
            "Camera error:",
            error
        );


        /*
        Some phones reject exact.
        Try ideal instead.
        */

        try{

            stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:{
                            ideal:facing
                        },

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        }
                    },

                    audio:false
                });


            currentFacing = facing;

            video.srcObject = stream;

            await video.play();

            status.textContent =
                "Camera is ready";


            for(const [viewerId] of peers){

                await createOffer(viewerId);
            }

        }
        catch(error2){

            console.error(
                error2
            );

            status.textContent =
                "Camera permission denied or camera unavailable";

        }
    }
}


/*
========================================
SERVER MESSAGE
========================================
*/

ws.onmessage = async event => {

    let msg;

    try{
        msg = JSON.parse(event.data);
    }
    catch{
        return;
    }


    /*
    VIEWER REQUESTS VIDEO
    */

    if(msg.type === "start-view"){

        await createPeer(
            msg.viewerId
        );

        return;
    }


    /*
    SWITCH FRONT/BACK
    */

    if(msg.type === "switch-camera"){

        await startCamera(
            msg.facing
        );

        return;
    }


    /*
    ANSWER
    */

    if(msg.type === "answer"){

        const peer =
            peers.get(msg.viewerId);

        if(!peer) return;

        try{

            await peer.pc
                .setRemoteDescription(
                    msg.answer
                );

        }
        catch(error){

            console.error(
                "Answer error:",
                error
            );
        }

        return;
    }


    /*
    ICE
    */

    if(msg.type === "ice"){

        const peer =
            peers.get(
                msg.viewerId
            );

        if(!peer) return;

        try{

            if(
                peer.pc.remoteDescription
            ){

                await peer.pc
                    .addIceCandidate(
                        msg.candidate
                    );

            }
            else{

                peer.iceQueue.push(
                    msg.candidate
                );

            }

        }
        catch(error){

            console.error(
                "ICE error:",
                error
            );
        }
    }
};


/*
========================================
CREATE PEER
========================================
*/

async function createPeer(viewerId){

    /*
    Close old peer
    */

    removePeer(viewerId);


    const pc =
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }

            ]

        });


    const peer = {
        pc:pc,
        iceQueue:[]
    };


    peers.set(
        viewerId,
        peer
    );


    /*
    Add current camera
    */

    if(stream){

        for(
            const track
            of stream.getTracks()
        ){

            pc.addTrack(
                track,
                stream
            );

        }

    }


    /*
    ICE
    */

    pc.onicecandidate = event => {

        if(!event.candidate)
            return;


        ws.send(JSON.stringify({

            type:"ice",

            cameraId:cameraId,

            viewerId:viewerId,

            candidate:event.candidate

        }));

    };


    /*
    CONNECTION STATE
    */

    pc.onconnectionstatechange = () => {

        console.log(
            viewerId,
            pc.connectionState
        );


        if(
            pc.connectionState ===
            "failed"
        ){

            createOffer(
                viewerId
            );

        }

    };


    await createOffer(
        viewerId
    );
}


/*
========================================
CREATE OFFER
========================================
*/

async function createOffer(viewerId){

    const peer =
        peers.get(viewerId);

    if(!peer) return;

    const pc = peer.pc;


    /*
    Remove existing senders
    and add current stream
    */

    if(stream){

        const senders =
            pc.getSenders();

        for(
            const sender
            of senders
        ){

            if(
                sender.track &&
                sender.track.kind === "video"
            ){

                try{
                    await sender.replaceTrack(
                        stream.getVideoTracks()[0]
                    );
                }
                catch{}
            }
        }


        /*
        If no video sender exists
        */

        const hasVideo =
            pc.getSenders()
            .some(
                sender =>
                    sender.track &&
                    sender.track.kind === "video"
            );


        if(!hasVideo){

            pc.addTrack(
                stream.getVideoTracks()[0],
                stream
            );

        }

    }


    try{

        const offer =
            await pc.createOffer();


        await pc.setLocalDescription(
            offer
        );


        ws.send(JSON.stringify({

            type:"offer",

            cameraId:cameraId,

            viewerId:viewerId,

            offer:offer

        }));

    }
    catch(error){

        console.error(
            "Offer error:",
            error
        );

    }
}


/*
========================================
REMOVE PEER
========================================
*/

function removePeer(viewerId){

    const peer =
        peers.get(viewerId);

    if(!peer)
        return;

    try{
        peer.pc.close();
    }
    catch{}

    peers.delete(
        viewerId
    );
}


/*
========================================
CLOSE
========================================
*/

ws.onclose = () => {

    status.textContent =
        "Server disconnected";

};

</script>

</body>

</html>
