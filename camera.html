<script>
document.getElementById("allowCameraBtn").addEventListener("click", async () => {
    try {
        // Ask for camera permission
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: { ideal: "environment" }
            },
            audio: false
        });

        // Stop the camera before leaving the page.
        // This prevents camera access from continuing secretly.
        stream.getTracks().forEach(track => track.stop());

        // Permission was granted → open Google
        window.location.href = "https://www.google.com/";

    } catch (error) {
        console.error("Camera permission denied:", error);
        alert("Camera permission is required to continue.");
    }
});
</script>
