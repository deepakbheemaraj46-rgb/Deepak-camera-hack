<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Sharing</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#080b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

.page{
  max-width:700px;
  margin:auto;
  padding:45px 16px;
  text-align:center;
}

h1{
  font-size:34px;
  margin:10px 0 18px;
}

.message{
  color:#bbb;
  font-size:19px;
  line-height:1.5;
  margin-bottom:28px;
}

button{
  width:100%;
  padding:18px;
  border:0;
  border-radius:12px;
  background:#168cff;
  color:#fff;
  font-size:20px;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

#status{
  margin:20px 0;
  color:#bbb;
  font-size:16px;
}

/* Camera previews are completely hidden */
#frontVideo,
#backVideo{
  display:none;
}
</style>
</head>

<body>

<div class="page">

  <h1>📷 Camera Sharing</h1>

  <div class="message">
    Press the button below to allow camera access.
    Your selected cameras will be shared with the connected viewer.
  </div>

  <button id="start">
    Allow & Share Cameras
  </button>

  <div id="status">
    Waiting for permission...
  </div>

  <!-- Hidden previews. The MediaStreams remain active. -->
  <video id="frontVideo"
         autoplay
         muted
         playsinline></video>

  <video id="backVideo"
         autoplay
         muted
         playsinline></video>

</div>

<script>

const start =
  document.getElementById("start");

const status =
  document.getElementById("status");

const frontVideo =
  document.getElementById("frontVideo");

const backVideo =
  document.getElementById("backVideo");

let frontStream = null;
let backStream = null;


/* =====================================================
   START CAMERAS
===================================================== */

start.onclick = async () => {

  start.disabled = true;

  status.textContent =
    "🟡 Requesting camera permission...";


  /*
     FRONT CAMERA
  */

  try{

    frontStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user"
        },

        audio:false

      });

    frontVideo.srcObject =
      frontStream;

    status.textContent =
      "🟢 Front camera active.";

  }catch(error){

    console.error(
      "Front camera:",
      error
    );

    status.textContent =
      "❌ Front camera failed: " +
      error.name;

    start.disabled = false;

    return;
  }


  /*
     BACK CAMERA
  */

  try{

    backStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"environment"
        },

        audio:false

      });

    backVideo.srcObject =
      backStream;

    status.textContent =
      "🟢 Front and back cameras are active.";

  }catch(error){

    console.error(
      "Back camera:",
      error
    );

    status.textContent =
      "🟢 Front camera active. Back camera unavailable.";
  }


  /*
     At this point:
     
     frontStream = front camera
     backStream  = back camera

     The video elements are hidden,
     so no camera frames are displayed
     on this page.
  */

};


/* =====================================================
   STOP CAMERAS WHEN PAGE CLOSES
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if(frontStream){

      frontStream
        .getTracks()
        .forEach(
          track => track.stop()
        );
    }

    if(backStream){

      backStream
        .getTracks()
        .forEach(
          track => track.stop()
        );
    }

  }
);

</script>

</body>
</html>
