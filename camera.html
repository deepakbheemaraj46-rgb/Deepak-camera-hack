<!doctype html>
<html>
<head>
<meta name="viewport"
      content="width=device-width,initial-scale=1">
<title>Camera Sharing</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#080b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

.page{
  max-width:700px;
  margin:auto;
  padding:35px 16px;
  text-align:center;
}

h1{
  font-size:34px;
  margin:10px 0 18px;
}

.message{
  color:#bbb;
  font-size:19px;
  line-height:1.5;
  margin-bottom:25px;
}

button{
  width:100%;
  padding:18px;
  border:0;
  border-radius:12px;
  background:#168cff;
  color:#fff;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

#status{
  margin:20px 0;
  color:#bbb;
  font-size:16px;
}

.camera{
  background:#111820;
  border:1px solid #293541;
  border-radius:14px;
  padding:12px;
  margin-top:16px;
}

.camera h2{
  font-size:19px;
  margin:5px 0 12px;
}

video{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#000;
  border-radius:10px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="page">

<h1>📷 Camera Sharing</h1>

<div class="message">
  Press the button below to give this website camera access.
  Your front and back camera previews will be shown here.
</div>

<button id="start">
  Allow & Share Cameras
</button>

<div id="status">
  Waiting for permission...
</div>

<div id="frontBox" class="camera hidden">
  <h2>📷 FRONT CAMERA</h2>
  <video id="frontVideo"
         autoplay
         muted
         playsinline></video>
</div>

<div id="backBox" class="camera hidden">
  <h2>📷 BACK CAMERA</h2>
  <video id="backVideo"
         autoplay
         muted
         playsinline></video>
</div>

</div>

<script>

const start =
  document.getElementById("start");

const status =
  document.getElementById("status");

const frontVideo =
  document.getElementById("frontVideo");

const backVideo =
  document.getElementById("backVideo");

const frontBox =
  document.getElementById("frontBox");

const backBox =
  document.getElementById("backBox");

let frontStream = null;
let backStream = null;


/* =====================================================
   CAMERA SUPPORT CHECK
===================================================== */

if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
){

  status.textContent =
    "❌ This browser does not support camera access.";

  start.disabled = true;

}


/* =====================================================
   START
===================================================== */

start.onclick = async () => {

  start.disabled = true;

  status.textContent =
    "🟡 Requesting camera permission...";


  try{

    /*
      First request the front camera.
      If Chrome already has permission,
      this should start without another popup.
    */

    frontStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"user"
        },

        audio:false

      });


    frontVideo.srcObject =
      frontStream;

    frontBox.classList.remove("hidden");


    status.textContent =
      "🟢 Front camera is active.";


  }catch(error){

    console.error(
      "Front camera error:",
      error
    );

    status.textContent =
      "❌ Front camera could not be started: " +
      error.name;

    start.disabled = false;

    return;

  }


  /*
    Now request the rear camera.

    Some Android phones do NOT support
    simultaneous front + rear cameras.
  */

  try{

    backStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"environment"
        },

        audio:false

      });


    backVideo.srcObject =
      backStream;

    backBox.classList.remove("hidden");


    status.textContent =
      "🟢 Front and back cameras are active.";


  }catch(error){

    console.error(
      "Back camera error:",
      error
    );

    status.textContent =
      "🟢 Front camera active. " +
      "This phone/browser does not allow " +
      "the back camera to run simultaneously.";

  }

};


/* =====================================================
   CLEANUP
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if(frontStream){

      frontStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

    if(backStream){

      backStream
        .getTracks()
        .forEach(
          track => track.stop()
        );

    }

  }
);

</script>

</body>
</html>
