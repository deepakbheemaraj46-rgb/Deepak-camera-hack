<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera B Viewer</title>
<style>body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}h1{font-size:26px}#status{font-size:18px;margin:15px}video{width:95%;max-width:900px;background:#000}</style></head>
<body><h1>👁️ Camera B — Live Viewer</h1><div id="status">Connecting...</div><video id="video" autoplay playsinline controls></video>
<script>
const status=document.getElementById("status"), video=document.getElementById("video");
const ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host+"/viewer");
let pc; const pending=[];
function peer(){pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({type:"candidate",candidate:e.candidate}))};
pc.ontrack=e=>{video.srcObject=e.streams[0];video.play().catch(()=>{});status.textContent="🟢 CAMERA A IS LIVE";};}
ws.onmessage=async e=>{const m=JSON.parse(e.data);
if(m.type==="role"){peer();status.textContent="👁️ Waiting for Camera A...";}
if(m.type==="camera-offline"){status.textContent="🔴 Camera A is offline";video.srcObject=null;}
if(m.type==="camera-online")status.textContent="🟡 Camera A connected — starting...";
if(m.type==="offer"){await pc.setRemoteDescription(m.offer);for(const c of pending)await pc.addIceCandidate(c).catch(()=>{});pending.length=0;const a=await pc.createAnswer();await pc.setLocalDescription(a);ws.send(JSON.stringify({type:"answer",answer:pc.localDescription}));}
if(m.type==="candidate"){if(pc.remoteDescription)await pc.addIceCandidate(m.candidate).catch(()=>{});else pending.push(m.candidate);}
};
</script></body></html>
