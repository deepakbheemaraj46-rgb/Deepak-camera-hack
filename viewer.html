<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
  font-size:22px;
  margin:18px 0;
}

#status{
  text-align:center;
  color:#aaa;
  margin-bottom:15px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px;
  padding:12px;
}

.camera{
  background:#222;
  border-radius:12px;
  overflow:hidden;
  position:relative;
}

.camera video{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  object-fit:cover;
}

.label{
  padding:10px;
  text-align:center;
  font-size:15px;
}

.offline{
  padding:40px 10px;
  text-align:center;
  color:#999;
}

.fullscreen{
  position:absolute;
  right:8px;
  bottom:45px;
  border:0;
  border-radius:8px;
  background:rgba(0,0,0,.7);
  color:white;
  padding:8px 12px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>Multi Camera Viewer</h1>

<div id="status">Connecting...</div>

<div id="grid"></div>

<script>
const grid = document.getElementById("grid");
const status = document.getElementById("status");

const cameras = new Map();

const wsProtocol =
  location.protocol === "https:" ? "wss:" : "ws:";

const ws =
  new WebSocket(wsProtocol + "//" + location.host);

function setStatus(text){
  status.textContent = text;
}

ws.onopen = () => {
  console.log("Viewer WebSocket connected");

  setStatus("Connected");

  ws.send(JSON.stringify({
    type:"register-viewer"
  }));
};

ws.onclose = () => {
  setStatus("Server disconnected");
};

ws.onerror = () => {
  setStatus("Connection error");
};

ws.onmessage = async (event) => {

  let message;

  try{
    message = JSON.parse(event.data);
  }catch{
    return;
  }

  if(message.type === "camera-online"){
    addCamera(message.cameraId);
  }

  if(message.type === "camera-offline"){
    removeCamera(message.cameraId);
  }

  if(message.type === "offer"){
    await handleOffer(message);
  }

  if(message.type === "ice-candidate"){
    await handleIceCandidate(message);
  }
};


/* =========================
   ADD CAMERA
========================= */

function addCamera(cameraId){

  if(cameras.has(cameraId)){
    return;
  }

  const card = document.createElement("div");
  card.className = "camera";
  card.id = "camera-" + cameraId;

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = cameraId;

  const fullscreen = document.createElement("button");
  fullscreen.className = "fullscreen";
  fullscreen.textContent = "⛶ Fullscreen";

  fullscreen.onclick = () => {
    if(video.requestFullscreen){
      video.requestFullscreen();
    }
  };

  card.appendChild(video);
  card.appendChild(fullscreen);
  card.appendChild(label);

  grid.appendChild(card);

  const pc = new RTCPeerConnection({
    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]
  });

  pc.ontrack = (event) => {

    if(event.streams && event.streams[0]){
      video.srcObject = event.streams[0];
    }

  };

  pc.onicecandidate = (event) => {

    if(event.candidate){

      ws.send(JSON.stringify({
        type:"ice-candidate",
        cameraId:cameraId,
        candidate:event.candidate
      }));

    }

  };

  cameras.set(cameraId,{
    pc,
    video,
    card
  });

  requestCameraOffer(cameraId,pc);
}


/* =========================
   REQUEST OFFER
========================= */

async function requestCameraOffer(cameraId,pc){

  /*
    Tell the camera that this viewer
    wants to receive its stream.
  */

  ws.send(JSON.stringify({
    type:"viewer-request",
    cameraId:cameraId
  }));
}


/* =========================
   HANDLE OFFER
========================= */

async function handleOffer(message){

  const cameraId = message.cameraId;

  const camera = cameras.get(cameraId);

  if(!camera){
    return;
  }

  const pc = camera.pc;

  try{

    await pc.setRemoteDescription(
      new RTCSessionDescription(message.offer)
    );

    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(answer);

    ws.send(JSON.stringify({
      type:"answer",
      cameraId:cameraId,
      answer:answer
    }));

  }catch(error){

    console.error(
      "Offer error:",
      error
    );

  }
}


/* =========================
   ICE
========================= */

async function handleIceCandidate(message){

  const camera =
    cameras.get(message.cameraId);

  if(!camera){
    return;
  }

  try{

    await camera.pc.addIceCandidate(
      message.candidate
    );

  }catch(error){

    console.error(
      "ICE error:",
      error
    );

  }
}


/* =========================
   REMOVE CAMERA
========================= */

function removeCamera(cameraId){

  const camera =
    cameras.get(cameraId);

  if(!camera){
    return;
  }

  camera.pc.close();

  if(camera.video.srcObject){
    camera.video.srcObject
      .getTracks()
      .forEach(track => track.stop());
  }

  camera.card.remove();

  cameras.delete(cameraId);
}
</script>

</body>
</html>
