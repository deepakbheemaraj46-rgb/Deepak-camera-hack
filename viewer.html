<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Camera Viewer</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  font-size: 25px;
  margin: 20px 10px;
}

#status {
  font-size: 17px;
  margin: 15px;
}

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  padding: 12px;
}

.card {
  background: #222;
  border-radius: 10px;
  padding: 8px;
}

.label {
  font-size: 14px;
  padding: 6px;
  color: #ddd;
}

.video-wrap {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: 8px;
  overflow: hidden;
}

.video-wrap video {
  width: 100%;
  height: auto;
  min-height: 220px;
  display: block;
  background: #000;
  border-radius: 8px;
  object-fit: contain;
}

.fullscreen-btn {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.75);
  color: white;
  font-size: 26px;
  z-index: 10;
  cursor: pointer;
}

.video-wrap:fullscreen,
.video-wrap:-webkit-full-screen {
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

.video-wrap:fullscreen video,
.video-wrap:-webkit-full-screen video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">🟡 Connecting...</div>

<div id="grid"></div>

<script>

const status = document.getElementById("status");
const grid = document.getElementById("grid");

const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" + location.host + "/viewer"
);


function sendMessage(message) {

  if (ws.readyState === WebSocket.OPEN) {

    ws.send(JSON.stringify(message));

    return true;
  }

  return false;
}


function addCamera(cameraId) {

  if (cards.has(cameraId)) {

    return;
  }

  const card = document.createElement("div");
  card.className = "card";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Camera " + cameraId;

  const videoWrap = document.createElement("div");
  videoWrap.className = "video-wrap";

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;
  video.controls = false;

  const fullscreenBtn = document.createElement("button");

  fullscreenBtn.className = "fullscreen-btn";
  fullscreenBtn.type = "button";
  fullscreenBtn.innerHTML = "⛶";

  fullscreenBtn.onclick = () => {

    if (videoWrap.requestFullscreen) {

      videoWrap.requestFullscreen();

    } else if (videoWrap.webkitRequestFullscreen) {

      videoWrap.webkitRequestFullscreen();

    } else if (video.webkitEnterFullscreen) {

      video.webkitEnterFullscreen();

    }

  };

  videoWrap.appendChild(video);
  videoWrap.appendChild(fullscreenBtn);

  card.appendChild(label);
  card.appendChild(videoWrap);

  grid.appendChild(card);

  cards.set(cameraId, {
    card: card,
    video: video,
    videoWrap: videoWrap
  });

}


function createPeer(cameraId) {

  let pc = peers.get(cameraId);

  if (pc) {

    return pc;
  }

  addCamera(cameraId);

  pc = new RTCPeerConnection({

    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]

  });

  peers.set(cameraId, pc);

  pendingCandidates.set(
    cameraId,
    []
  );


  pc.onicecandidate = event => {

    if (event.candidate) {

      sendMessage({

        type: "candidate",

        candidate: event.candidate,

        cameraId: cameraId

      });

    }

  };


  pc.ontrack = event => {

    console.log(
      "Track received:",
      cameraId,
      event.track.kind
    );

    if (event.track.kind !== "video") {

      return;
    }

    const item = cards.get(cameraId);

    if (!item) {

      return;
    }

    let stream = event.streams[0];

    if (!stream) {

      stream = new MediaStream();

      stream.addTrack(event.track);

    }

    item.video.srcObject = stream;

    item.video.play()
      .then(() => {

        status.textContent =
          "🟢 Camera is LIVE";

      })
      .catch(error => {

        console.log(
          "Video play error:",
          error
        );

      });

  };


  pc.onconnectionstatechange = () => {

    console.log(
      "Connection:",
      cameraId,
      pc.connectionState
    );

    if (pc.connectionState === "connected") {

      status.textContent =
        "🟢 Camera is LIVE";

    }

    else if (pc.connectionState === "connecting") {

      status.textContent =
        "🟡 Connecting to camera...";

    }

    else if (pc.connectionState === "failed") {

      status.textContent =
        "🔴 Connection failed";

    }

    else if (pc.connectionState === "disconnected") {

      status.textContent =
        "🟡 Connection interrupted";

    }

  };


  return pc;

}


function requestCamera(cameraId) {

  sendMessage({

    type: "viewer-ready",

    cameraId: cameraId

  });

}


async function handleOffer(message) {

  const cameraId = message.cameraId;

  if (
    !cameraId ||
    !message.offer
  ) {

    return;
  }

  const pc = createPeer(cameraId);


  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        message.offer
      )
    );


    const queuedCandidates =
      pendingCandidates.get(cameraId) || [];


    for (
      const candidate
      of queuedCandidates
    ) {

      try {

        await pc.addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

      }

      catch (error) {

        console.log(
          "Queued ICE error:",
          error
        );

      }

    }


    pendingCandidates.set(
      cameraId,
      []
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    sendMessage({

      type: "answer",

      answer: pc.localDescription,

      cameraId: cameraId

    });

  }

  catch (error) {

    console.error(
      "Offer error:",
      error
    );

    status.textContent =
      "🔴 WebRTC connection error";

  }

}


async function handleCandidate(message) {

  const cameraId = message.cameraId;

  if (
    !cameraId ||
    !message.candidate
  ) {

    return;
  }

  const pc =
    createPeer(cameraId);


  if (
    !pc.remoteDescription ||
    !pc.remoteDescription.type
  ) {

    pendingCandidates
      .get(cameraId)
      .push(message.candidate);

    return;

  }


  try {

    await pc.addIceCandidate(
      new RTCIceCandidate(
        message.candidate
      )
    );

  }

  catch (error) {

    console.log(
      "ICE candidate error:",
      error
    );

  }

}


function removeCamera(cameraId) {

  const pc = peers.get(cameraId);

  if (pc) {

    try {

      pc.close();

    }

    catch (error) {}

  }

  peers.delete(cameraId);
  pendingCandidates.delete(cameraId);

  const item = cards.get(cameraId);

  if (item) {

    item.video.srcObject = null;

    item.card.remove();

  }

  cards.delete(cameraId);

}


ws.onopen = () => {

  status.textContent =
    "🟡 Waiting for cameras...";

};


ws.onmessage = async event => {

  let message;

  try {

    message =
      JSON.parse(event.data);

  }

  catch (error) {

    return;

  }


  console.log(
    "Server message:",
    message
  );


  if (message.type === "role") {

    status.textContent =
      "🟡 Waiting for cameras...";


    if (
      Array.isArray(
        message.cameras
      )
    ) {

      message.cameras.forEach(
        cameraId => {

          addCamera(cameraId);

          createPeer(cameraId);

          requestCamera(cameraId);

        }
      );

    }

    return;

  }


  if (message.type === "camera-online") {

    addCamera(
      message.cameraId
    );

    createPeer(
      message.cameraId
    );

    requestCamera(
      message.cameraId
    );

    status.textContent =
      "🟡 Camera connected";

    return;

  }


  if (message.type === "camera-live") {

    addCamera(
      message.cameraId
    );

    createPeer(
      message.cameraId
    );


    /*
      IMPORTANT FIX

      Request the camera again after
      camera permission is granted.
    */

    requestCamera(
      message.cameraId
    );


    status.textContent =
      "🟢 Camera is LIVE";

    return;

  }


  if (message.type === "camera-offline") {

    removeCamera(
      message.cameraId
    );


    if (peers.size === 0) {

      status.textContent =
        "🔴 No cameras connected";

    }

    return;

  }


  if (message.type === "offer") {

    await handleOffer(message);

    return;

  }


  if (message.type === "candidate") {

    await handleCandidate(message);

  }

};


ws.onerror = () => {

  status.textContent =
    "🔴 Viewer server error";

};


ws.onclose = () => {

  status.textContent =
    "🔴 Viewer connection closed";


  for (
    const cameraId
    of [...peers.keys()]
  ) {

    removeCamera(cameraId);

  }

};


window.addEventListener(
  "beforeunload",
  () => {

    for (
      const pc
      of peers.values()
    ) {

      try {

        pc.close();

      }

      catch (error) {}

    }

    if (ws.readyState === WebSocket.OPEN) {

      ws.close();

    }

  }
);

</script>

</body>
</html>
