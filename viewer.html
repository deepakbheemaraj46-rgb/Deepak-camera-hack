<!doctype html>

<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 20px 10px 8px;
}

#status {
    text-align: center;
    color: #aaa;
    font-size: 18px;
    margin-bottom: 15px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));

    gap: 14px;

    padding: 12px;

    max-width: 1200px;

    margin: auto;
}

.card {
    background: #161616;
    border-radius: 15px;
    padding: 10px;
    overflow: hidden;
}

.card h2 {
    text-align: center;
    margin: 8px;
}

video {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    background: #000;
    object-fit: contain;
    border-radius: 10px;
}

button {
    display: block;
    margin: 15px auto;
    padding: 14px 25px;
    border: 0;
    border-radius: 10px;
    background: #333;
    color: white;
    font-size: 16px;
}

#message {
    text-align: center;
    color: #aaa;
    padding: 15px;
}

@media (max-width: 650px) {

    .grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<h1>
    Multi Camera Viewer
</h1>

<div id="status">
    Connecting...
</div>


<div class="grid">

    <div class="card">

        <h2>
            📷 FRONT CAMERA
        </h2>

        <video
            id="frontVideo"
            autoplay
            playsinline>
        </video>

        <button
            onclick="fullscreen('frontVideo')">
            ⛶ FRONT FULLSCREEN
        </button>

    </div>


    <div class="card">

        <h2>
            📷 BACK CAMERA
        </h2>

        <video
            id="backVideo"
            autoplay
            playsinline>
        </video>

        <button
            onclick="fullscreen('backVideo')">
            ⛶ BACK FULLSCREEN
        </button>

    </div>

</div>


<div id="message">
    Waiting for Camera A...
</div>


<script>

const frontVideo =
    document.getElementById(
        "frontVideo"
    );

const backVideo =
    document.getElementById(
        "backVideo"
    );

const status =
    document.getElementById(
        "status"
    );

const message =
    document.getElementById(
        "message"
    );


const wsProtocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


let ws;

let pc = null;

let cameraId = null;

let remoteDescriptionSet =
    false;

let iceQueue = [];


// ====================================================
// WEBSOCKET
// ====================================================

function connect() {

    ws = new WebSocket(
        wsProtocol +
        "//" +
        location.host
    );


    ws.onopen = () => {

        console.log(
            "WebSocket connected"
        );


        status.textContent =
            "Connected";


        send({

            type:
                "viewer-register",

            viewerId:
                viewerId

        });

    };


    ws.onmessage =
        async event => {

            let msg;

            try {

                msg =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }


            console.log(
                "SERVER:",
                msg.type
            );


            if (
                msg.type ===
                "camera-online"
            ) {

                cameraId =
                    msg.cameraId;


                status.textContent =
                    "Camera A is online";


                message.textContent =
                    "Connecting to both cameras...";


                startView();

            }


            if (
                msg.type ===
                "camera-offline"
            ) {

                status.textContent =
                    "Camera A offline";


                message.textContent =
                    "Waiting for Camera A...";


                frontVideo.srcObject =
                    null;

                backVideo.srcObject =
                    null;

            }


            if (
                msg.type ===
                "offer"
            ) {

                await handleOffer(
                    msg
                );

            }


            if (
                msg.type ===
                "ice"
            ) {

                await handleIce(
                    msg
                );

            }

        };


    ws.onclose = () => {

        status.textContent =
            "Disconnected";


        setTimeout(
            connect,
            3000
        );

    };

}


// ====================================================
// VIEWER ID
// ====================================================

const viewerId =
    "viewer-" +
    Math.random()
        .toString(36)
        .substring(2, 10);


// ====================================================
// START VIEW
// ====================================================

function startView() {

    send({

        type:
            "start-view",

        viewerId:
            viewerId,

        cameraId:
            cameraId

    });

}


// ====================================================
// HANDLE OFFER
// ====================================================

async function handleOffer(
    msg
) {

    cameraId =
        msg.cameraId;


    if (pc) {

        try {
            pc.close();
        } catch {}

    }


    remoteDescriptionSet =
        false;

    iceQueue = [];


    pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    // ================================================
    // RECEIVE TRACKS
    // ================================================

    pc.ontrack =
        async event => {

            console.log(
                "TRACK RECEIVED:",
                event.track.kind,
                event.track.label
            );


            if (
                event.track.kind !==
                "video"
            ) {
                return;
            }


            const stream =
                event.streams[0];


            /*
             * Camera A sends:
             *
             * Stream 1 = FRONT
             * Stream 2 = BACK
             *
             * We identify them by the
             * order they arrive.
             */

            if (
                !frontVideo.srcObject
            ) {

                frontVideo.srcObject =
                    stream;

                await frontVideo.play()
                    .catch(() => {});


                console.log(
                    "Assigned FRONT"
                );

            } else if (
                !backVideo.srcObject
            ) {

                backVideo.srcObject =
                    stream;

                await backVideo.play()
                    .catch(() => {});


                console.log(
                    "Assigned BACK"
                );

            }

            checkLive();

        };


    // ================================================
    // ICE
    // ================================================

    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                send({

                    type:
                        "ice",

                    viewerId:
                        viewerId,

                    candidate:
                        event.candidate

                });

            }

        };


    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                pc.iceConnectionState
            );

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                "WEBRTC:",
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                status.textContent =
                    "🟢 LIVE";

            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                status.textContent =
                    "WebRTC connection failed";

            }

        };


    // ================================================
    // REMOTE OFFER
    // ================================================

    try {

        await pc
            .setRemoteDescription(
                new RTCSessionDescription(
                    msg.offer
                )
            );


        remoteDescriptionSet =
            true;


        for (
            const candidate
            of iceQueue
        ) {

            await pc
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }


        iceQueue = [];


        const answer =
            await pc.createAnswer();


        await pc
            .setLocalDescription(
                answer
            );


        send({

            type:
                "answer",

            viewerId:
                viewerId,

            cameraId:
                cameraId,

            answer:
                pc.localDescription

        });


    } catch (error) {

        console.error(
            "WebRTC offer error:",
            error
        );

        status.textContent =
            "WebRTC error";

    }

}


// ====================================================
// ICE
// ====================================================

async function handleIce(
    msg
) {

    if (!pc) {
        return;
    }


    if (
        !remoteDescriptionSet
    ) {

        iceQueue.push(
            msg.candidate
        );

        return;

    }


    try {

        await pc
            .addIceCandidate(
                new RTCIceCandidate(
                    msg.candidate
                )
            );

    } catch (error) {

        console.error(
            "ICE error:",
            error
        );

    }

}


// ====================================================
// CHECK LIVE
// ====================================================

function checkLive() {

    const front =
        !!frontVideo.srcObject;

    const back =
        !!backVideo.srcObject;


    if (front && back) {

        status.textContent =
            "🟢 FRONT + BACK LIVE";

        message.textContent =
            "Both cameras are streaming.";

    } else if (front) {

        status.textContent =
            "🟡 FRONT LIVE";

        message.textContent =
            "Back camera was not received.";

    }

}


// ====================================================
// FULLSCREEN
// ====================================================

function fullscreen(
    id
) {

    const video =
        document.getElementById(id);


    if (
        video.requestFullscreen
    ) {

        video.requestFullscreen();

    } else if (
        video.webkitRequestFullscreen
    ) {

        video.webkitRequestFullscreen();

    }

}


// ====================================================
// SEND
// ====================================================

function send(data) {

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

    }

}


// ====================================================
// START
// ====================================================

connect();

</script>

</body>

</html>
