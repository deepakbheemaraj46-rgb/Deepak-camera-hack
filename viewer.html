<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Cameras</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}


/* =====================================================
   CAMERA VIEW
===================================================== */

#cameraView {

    position: fixed;

    inset: 0;

    width: 100vw;
    height: 100vh;

    background: #000;

    overflow: hidden;
}


/* =====================================================
   VIDEO
===================================================== */

#mainVideo {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;
}


/* =====================================================
   CAMERA NAME
===================================================== */

#cameraName {

    position: absolute;

    left: 12px;
    bottom: 12px;

    z-index: 20;

    padding: 7px 11px;

    background: rgba(0,0,0,.65);

    color: #fff;

    border-radius: 6px;

    font-size: 12px;

    max-width: 80%;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =====================================================
   LIVE
===================================================== */

#liveLabel {

    position: absolute;

    right: 12px;
    top: 12px;

    z-index: 20;

    padding: 6px 9px;

    background: rgba(180,0,0,.85);

    color: #fff;

    border-radius: 5px;

    font-size: 11px;

    font-weight: bold;
}


/* =====================================================
   STATUS
===================================================== */

#status {

    position: fixed;

    top: 10px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 7px 12px;

    background: rgba(0,0,0,.70);

    color: #fff;

    border-radius: 20px;

    font-size: 12px;

    white-space: nowrap;
}


/* =====================================================
   NEXT / PREVIOUS BUTTONS
===================================================== */

.navButton {

    position: fixed;

    top: 50%;

    transform: translateY(-50%);

    z-index: 200;

    width: 48px;
    height: 70px;

    border: none;

    background: rgba(0,0,0,.55);

    color: #fff;

    font-size: 25px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}

.navButton:active {

    background: rgba(255,255,255,.30);

}


#previous {

    left: 5px;

    border-radius: 0 10px 10px 0;
}


#next {

    right: 5px;

    border-radius: 10px 0 0 10px;
}


/* =====================================================
   CAMERA COUNTER
===================================================== */

#counter {

    position: fixed;

    left: 50%;

    bottom: 15px;

    transform: translateX(-50%);

    z-index: 200;

    padding: 6px 12px;

    background: rgba(0,0,0,.60);

    color: #fff;

    border-radius: 20px;

    font-size: 12px;
}


/* =====================================================
   FULLSCREEN
===================================================== */

#fullscreen {

    position: fixed;

    right: 12px;

    bottom: 55px;

    z-index: 200;

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.85);

    color: #000;

    font-size: 20px;

    cursor: pointer;
}


/* =====================================================
   HIDDEN STATE
===================================================== */

.ui-hidden #status,
.ui-hidden #previous,
.ui-hidden #next,
.ui-hidden #counter,
.ui-hidden #fullscreen,
.ui-hidden #cameraName,
.ui-hidden #liveLabel {

    opacity: 0;

    pointer-events: none;
}

</style>
</head>

<body>


<!-- =====================================================
     CAMERA
===================================================== -->

<div id="cameraView">

    <video
        id="mainVideo"
        autoplay
        playsinline
        muted>
    </video>

</div>


<!-- =====================================================
     CAMERA INFORMATION
===================================================== -->

<div id="cameraName">
    Waiting for camera...
</div>

<div id="liveLabel">
    ● LIVE
</div>


<!-- =====================================================
     STATUS
===================================================== -->

<div id="status">
    Connecting...
</div>


<!-- =====================================================
     PREVIOUS
===================================================== -->

<button
    id="previous"
    class="navButton">
    ◀
</button>


<!-- =====================================================
     NEXT
===================================================== -->

<button
    id="next"
    class="navButton">
    ▶
</button>


<!-- =====================================================
     COUNTER
===================================================== -->

<div id="counter">
    0 / 0
</div>


<!-- =====================================================
     FULLSCREEN
===================================================== -->

<button id="fullscreen">
    ⛶
</button>


<script>

"use strict";


/* =====================================================
   WEBSOCKET
===================================================== */

const protocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


const WS_URL =
    protocol +
    "//" +
    location.host +
    "/viewer";


/* =====================================================
   STATE
===================================================== */

let socket = null;

let viewerId = null;

const cameras = new Set();

const peers = new Map();

const pendingCandidates = new Map();

let reconnectTimer = null;

let currentCameraIndex = 0;

let currentCameraId = null;


/* =====================================================
   DOM
===================================================== */

const mainVideo =
    document.getElementById(
        "mainVideo"
    );


const cameraName =
    document.getElementById(
        "cameraName"
    );


const liveLabel =
    document.getElementById(
        "liveLabel"
    );


const status =
    document.getElementById(
        "status"
    );


const counter =
    document.getElementById(
        "counter"
    );


const previousButton =
    document.getElementById(
        "previous"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const fullscreenButton =
    document.getElementById(
        "fullscreen"
    );


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    status.textContent = text;

}


/* =====================================================
   CAMERA LIST
===================================================== */

function getCameraList() {

    return Array.from(
        cameras
    );

}


/* =====================================================
   UPDATE CAMERA UI
===================================================== */

function updateCameraUI() {

    const list =
        getCameraList();


    if (list.length === 0) {

        currentCameraId = null;

        currentCameraIndex = 0;

        mainVideo.srcObject = null;

        cameraName.textContent =
            "Waiting for camera...";

        liveLabel.style.display =
            "none";

        counter.textContent =
            "0 / 0";

        previousButton.style.display =
            "none";

        nextButton.style.display =
            "none";

        return;
    }


    if (
        currentCameraIndex >=
        list.length
    ) {

        currentCameraIndex =
            0;

    }


    currentCameraId =
        list[currentCameraIndex];


    counter.textContent =
        (currentCameraIndex + 1) +
        " / " +
        list.length;


    cameraName.textContent =
        "Video ID: " +
        currentCameraId;


    previousButton.style.display =
        list.length > 1
            ? "flex"
            : "none";


    nextButton.style.display =
        list.length > 1
            ? "flex"
            : "none";


    showCamera(
        currentCameraId
    );
}


/* =====================================================
   SHOW CAMERA
===================================================== */

function showCamera(cameraId) {

    if (!cameraId) {
        return;
    }


    currentCameraId =
        String(cameraId);


    const list =
        getCameraList();


    const index =
        list.indexOf(
            currentCameraId
        );


    if (index >= 0) {

        currentCameraIndex =
            index;

    }


    cameraName.textContent =
        "Video ID: " +
        currentCameraId;


    counter.textContent =
        (currentCameraIndex + 1) +
        " / " +
        list.length;


    const peer =
        peers.get(
            currentCameraId
        );


    if (
        peer &&
        peer.video
    ) {

        mainVideo.srcObject =
            peer.video.srcObject;

    } else {

        mainVideo.srcObject =
            null;

    }


    mainVideo.play()
        .catch(() => {});


    setStatus(
        "Camera " +
        (currentCameraIndex + 1) +
        " / " +
        list.length
    );
}


/* =====================================================
   NEXT CAMERA
===================================================== */

function nextCamera() {

    const list =
        getCameraList();


    if (list.length <= 1) {
        return;
    }


    currentCameraIndex++;

    if (
        currentCameraIndex >=
        list.length
    ) {

        currentCameraIndex =
            0;

    }


    showCamera(
        list[currentCameraIndex]
    );

    resetHideTimer();
}


/* =====================================================
   PREVIOUS CAMERA
===================================================== */

function previousCamera() {

    const list =
        getCameraList();


    if (list.length <= 1) {
        return;
    }


    currentCameraIndex--;

    if (
        currentCameraIndex < 0
    ) {

        currentCameraIndex =
            list.length - 1;

    }


    showCamera(
        list[currentCameraIndex]
    );

    resetHideTimer();
}


/* =====================================================
   BUTTONS
===================================================== */

nextButton.addEventListener(
    "click",
    nextCamera
);


previousButton.addEventListener(
    "click",
    previousCamera
);


/* =====================================================
   WEBSOCKET CONNECT
===================================================== */

function connect() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||

            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {

        return;
    }


    setStatus(
        "Connecting..."
    );


    socket =
        new WebSocket(
            WS_URL
        );


    socket.onopen = () => {

        console.log(
            "Viewer connected"
        );


        setStatus(
            "Waiting for cameras..."
        );


        for (
            const cameraId
            of cameras
        ) {

            requestCamera(
                cameraId
            );
        }

    };


    socket.onmessage =
        async event => {

            let message;

            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }


            await handleMessage(
                message
            );

        };


    socket.onclose = () => {

        console.log(
            "Viewer disconnected"
        );


        destroyAllPeers();


        mainVideo.srcObject =
            null;


        setStatus(
            "Reconnecting..."
        );


        reconnect();

    };


    socket.onerror = error => {

        console.log(
            "WebSocket error",
            error
        );

    };
}


/* =====================================================
   SEND
===================================================== */

function send(message) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return false;

    }


    try {

        socket.send(
            JSON.stringify(
                message
            )
        );

        return true;

    } catch {

        return false;

    }
}


/* =====================================================
   SERVER MESSAGE
===================================================== */

async function handleMessage(
    message
) {

    switch (
        message.type
    ) {

        case "role":

            if (
                message.role ===
                "viewer"
            ) {

                viewerId =
                    message.viewerId;


                if (
                    Array.isArray(
                        message.cameras
                    )
                ) {

                    for (
                        const cameraId
                        of message.cameras
                    ) {

                        addCamera(
                            cameraId
                        );

                    }

                }

            }

            break;


        case "camera-online":

            addCamera(
                message.cameraId
            );

            break;


        case "camera-live":

            addCamera(
                message.cameraId
            );


            requestCamera(
                message.cameraId
            );

            break;


        case "camera-offline":

            removeCamera(
                message.cameraId
            );

            break;


        case "offer":

            await handleOffer(
                message
            );

            break;


        case "candidate":

            await handleCandidate(
                message
            );

            break;

    }
}


/* =====================================================
   ADD CAMERA
===================================================== */

function addCamera(cameraId) {

    if (!cameraId) {
        return;
    }


    cameraId =
        String(cameraId);


    const alreadyExists =
        cameras.has(
            cameraId
        );


    cameras.add(
        cameraId
    );


    if (!alreadyExists) {

        /*
         * First camera becomes
         * the active camera.
         */

        if (
            currentCameraId ===
            null
        ) {

            currentCameraIndex =
                0;

        }


        updateCameraUI();

    }


    setStatus(
        cameras.size +
        " camera(s) connected"
    );


    requestCamera(
        cameraId
    );
}


/* =====================================================
   REQUEST CAMERA
===================================================== */

function requestCamera(
    cameraId
) {

    send({

        type:
            "viewer-ready",

        cameraId:
            String(cameraId)

    });
}


/* =====================================================
   REMOVE CAMERA
===================================================== */

function removeCamera(
    cameraId
) {

    cameraId =
        String(cameraId);


    const listBefore =
        getCameraList();


    const removedIndex =
        listBefore.indexOf(
            cameraId
        );


    cameras.delete(
        cameraId
    );


    destroyPeer(
        cameraId
    );


    pendingCandidates.delete(
        cameraId
    );


    if (
        currentCameraId ===
        cameraId
    ) {

        mainVideo.srcObject =
            null;


        currentCameraId =
            null;


        if (
            removedIndex >= 0 &&
            currentCameraIndex >
            removedIndex
        ) {

            currentCameraIndex--;

        }

    }


    const listAfter =
        getCameraList();


    if (
        currentCameraIndex >=
        listAfter.length
    ) {

        currentCameraIndex =
            0;

    }


    updateCameraUI();


    if (
        listAfter.length === 0
    ) {

        setStatus(
            "Waiting for cameras..."
        );

    }
}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(
    message
) {

    const cameraId =
        String(
            message.cameraId
        );


    if (!message.offer) {
        return;
    }


    destroyPeer(
        cameraId
    );


    const pc =
        createPeer(
            cameraId
        );


    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );


        const queued =
            pendingCandidates.get(
                cameraId
            ) || [];


        for (
            const candidate
            of queued
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            } catch {}

        }


        pendingCandidates.delete(
            cameraId
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        send({

            type:
                "answer",

            cameraId:
                cameraId,

            answer:
                pc.localDescription

        });

    } catch (error) {

        console.error(
            "Offer error:",
            error
        );


        destroyPeer(
            cameraId
        );
    }
}


/* =====================================================
   CREATE PEER
===================================================== */

function createPeer(
    cameraId
) {

    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    const peerData = {

        pc:
            pc,

        video:
            document.createElement(
                "video"
            )

    };


    peerData.video.autoplay =
        true;

    peerData.video.playsInline =
        true;

    peerData.video.muted =
        true;


    peers.set(
        cameraId,
        peerData
    );


    pc.addTransceiver(
        "video",
        {
            direction:
                "recvonly"
        }
    );


    pc.ontrack =
        event => {

            if (
                event.streams &&
                event.streams[0]
            ) {

                peerData.video.srcObject =
                    event.streams[0];

            }


            peerData.video.play()
                .catch(() => {});


            /*
             * If this is the camera
             * currently being shown,
             * display it full screen.
             */

            if (
                currentCameraId ===
                cameraId
            ) {

                mainVideo.srcObject =
                    peerData.video.srcObject;


                mainVideo.play()
                    .catch(() => {});


                liveLabel.style.display =
                    "block";


                setStatus(
                    cameras.size +
                    " camera(s) LIVE"
                );
            }

        };


    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;

            }


            send({

                type:
                    "candidate",

                cameraId:
                    cameraId,

                candidate:
                    event.candidate

            });

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                cameraId,
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "failed"
            ) {

                destroyPeer(
                    cameraId
                );


                setTimeout(
                    () => {

                        if (
                            cameras.has(
                                cameraId
                            )
                        ) {

                            requestCamera(
                                cameraId
                            );

                        }

                    },
                    1000
                );
            }


            if (
                pc.connectionState ===
                "disconnected"
            ) {

                setTimeout(
                    () => {

                        if (
                            cameras.has(
                                cameraId
                            )
                        ) {

                            requestCamera(
                                cameraId
                            );

                        }

                    },
                    1500
                );
            }

        };


    return pc;
}


/* =====================================================
   ICE
===================================================== */

async function handleCandidate(
    message
) {

    const cameraId =
        String(
            message.cameraId
        );


    if (!message.candidate) {
        return;
    }


    const candidate =
        new RTCIceCandidate(
            message.candidate
        );


    const peerData =
        peers.get(
            cameraId
        );


    const pc =
        peerData
            ? peerData.pc
            : null;


    if (
        !pc ||
        !pc.remoteDescription
    ) {

        if (
            !pendingCandidates.has(
                cameraId
            )
        ) {

            pendingCandidates.set(
                cameraId,
                []
            );
        }


        pendingCandidates
            .get(cameraId)
            .push(candidate);


        return;
    }


    try {

        await pc.addIceCandidate(
            candidate
        );

    } catch (error) {

        console.warn(
            "ICE error:",
            error
        );

    }
}


/* =====================================================
   DESTROY PEER
===================================================== */

function destroyPeer(
    cameraId
) {

    const peerData =
        peers.get(
            cameraId
        );


    if (!peerData) {
        return;
    }


    try {

        peerData.pc.close();

    } catch {}


    if (
        peerData.video
    ) {

        peerData.video.srcObject =
            null;

    }


    peers.delete(
        cameraId
    );


    if (
        currentCameraId ===
        cameraId
    ) {

        mainVideo.srcObject =
            null;

    }
}


/* =====================================================
   DESTROY ALL PEERS
===================================================== */

function destroyAllPeers() {

    for (
        const cameraId
        of Array.from(
            peers.keys()
        )
    ) {

        destroyPeer(
            cameraId
        );
    }
}


/* =====================================================
   RECONNECT
===================================================== */

function reconnect() {

    if (reconnectTimer) {
        return;
    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connect();

            },
            1500
        );
}


/* =====================================================
   NETWORK RECONNECT
===================================================== */

window.addEventListener(
    "online",
    () => {

        connect();

    }
);


/* =====================================================
   FULLSCREEN
===================================================== */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(
                "Fullscreen error:",
                error
            );

        }

        resetHideTimer();
    }
);


/* =====================================================
   UI AUTO HIDE
===================================================== */

let hideTimer;


function resetHideTimer() {

    document.body.classList.remove(
        "ui-hidden"
    );


    clearTimeout(
        hideTimer
    );


    hideTimer =
        setTimeout(
            () => {

                document.body.classList.add(
                    "ui-hidden"
                );

            },
            3000
        );
}


/* Show controls when touching screen */

document.addEventListener(
    "click",
    () => {

        resetHideTimer();

    }
);


document.addEventListener(
    "touchstart",
    () => {

        resetHideTimer();

    },
    {
        passive: true
    }
);


/* =====================================================
   START
===================================================== */

updateCameraUI();

connect();

resetHideTimer();

</script>

</body>
</html>
