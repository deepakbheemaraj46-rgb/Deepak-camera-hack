<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    overflow: hidden;

    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;

    position: relative;

    background: #000;
}


/* =========================================================
   COMMON PAGE
========================================================= */

.viewer-page {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: none;

    background: #000;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    z-index: 1;
}

.viewer-page.active {
    display: flex;
}


/* =========================================================
   LIVE CAMERA PAGE
========================================================= */

#page1 {
    background: #000;
}


/* =========================================================
   CAMERA
========================================================= */

#camera-card {
    width: 100%;
    height: 100%;

    position: relative;

    background: #000;

    overflow: hidden;
}

#liveVideo {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center;

    background: #000;
}


/* =========================================================
   STATUS
========================================================= */

#status {
    position: absolute;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    padding: 8px 14px;

    border-radius: 20px;

    color: #fff;

    background: rgba(0,0,0,.70);

    font-size: 14px;

    white-space: nowrap;
}


/* =========================================================
   CAMERA NAME
========================================================= */

.camera-name {
    position: absolute;

    left: 12px;
    bottom: 12px;

    z-index: 10;

    padding: 6px 10px;

    color: #fff;

    background: rgba(0,0,0,.60);

    border-radius: 8px;

    font-size: 13px;
}


/* =========================================================
   LIVE INDICATOR
========================================================= */

.live {
    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 10;

    padding: 6px 10px;

    color: #fff;

    background: rgba(180,0,0,.85);

    border-radius: 8px;

    font-size: 12px;

    font-weight: bold;
}


/* =========================================================
   OTHER PAGES
========================================================= */

.other-page {
    background: #111;

    color: #fff;

    padding: 25px;
}

.other-page h1 {
    margin: 0 0 15px;
}

.other-page p {
    max-width: 350px;

    line-height: 1.5;

    margin: 0 0 20px;
}


/* =========================================================
   BUTTONS
========================================================= */

.page-button {
    border: 0;

    border-radius: 10px;

    padding: 12px 22px;

    margin: 6px;

    background: #fff;

    color: #111;

    font-size: 15px;

    font-weight: bold;
}

.page-button:active {
    transform: scale(.96);
}


/* =========================================================
   RECONNECT
========================================================= */

#reconnect {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    border: 0;

    border-radius: 25px;

    padding: 12px 22px;

    background: #fff;

    color: #111;

    font-size: 14px;

    font-weight: bold;

    display: none;
}

#reconnect:active {
    transform:
        translateX(-50%)
        scale(.96);
}


/* =========================================================
   NEXT BUTTON ON CAMERA
========================================================= */

#cameraNext {
    position: absolute;

    bottom: 20px;
    right: 20px;

    z-index: 30;

    border: 0;

    border-radius: 22px;

    padding: 10px 17px;

    background: rgba(255,255,255,.90);

    color: #111;

    font-size: 14px;

    font-weight: bold;
}

#cameraNext:active {
    transform: scale(.96);
}

</style>
</head>


<body>

<div id="app">


    <!-- =====================================================
         PAGE 1 — LIVE CAMERA
    ====================================================== -->

    <section
        id="page1"
        class="viewer-page active"
    >

        <div id="camera-card">

            <!-- IMPORTANT:
                 This video element NEVER gets removed
                 when changing pages.
            -->

            <video
                id="liveVideo"
                autoplay
                playsinline
                muted
                webkit-playsinline>
            </video>


            <div class="camera-name">
                Camera
            </div>


            <div class="live">
                ● LIVE
            </div>


            <div id="status">
                🟡 Connecting...
            </div>


            <button
                id="cameraNext"
                onclick="showPage(2)"
            >
                Next →
            </button>

        </div>

    </section>


    <!-- =====================================================
         PAGE 2
    ====================================================== -->

    <section
        id="page2"
        class="viewer-page other-page"
    >

        <h1>
            Page 2
        </h1>

        <p>
            This is the second screen.
            The viewer connection remains inside
            the same page.
        </p>


        <div>

            <button
                class="page-button"
                onclick="showPage(1)"
            >
                ← Live Camera
            </button>


            <button
                class="page-button"
                onclick="showPage(3)"
            >
                Next →
            </button>

        </div>

    </section>


    <!-- =====================================================
         PAGE 3
    ====================================================== -->

    <section
        id="page3"
        class="viewer-page other-page"
    >

        <h1>
            Page 3
        </h1>

        <p>
            The WebRTC viewer is still loaded.
            Returning to the live screen does not
            reload the page.
        </p>


        <div>

            <button
                class="page-button"
                onclick="showPage(2)"
            >
                ← Page 2
            </button>


            <button
                class="page-button"
                onclick="showPage(1)"
            >
                View Live →
            </button>

        </div>

    </section>


    <!-- =====================================================
         RECONNECT
    ====================================================== -->

    <button id="reconnect">
        🔄 Reconnect
    </button>


</div>


<script>

"use strict";


/* =========================================================
   INTERNAL PAGE NAVIGATION

   IMPORTANT:
   This does NOT change URL.
   This does NOT reload the document.
   This does NOT close WebSocket.
   This does NOT close WebRTC.
========================================================= */

function showPage(pageNumber) {

    const pages =
        document.querySelectorAll(
            ".viewer-page"
        );


    pages.forEach(page => {

        page.classList.remove(
            "active"
        );

    });


    const target =
        document.getElementById(
            "page" + pageNumber
        );


    if (target) {

        target.classList.add(
            "active"
        );

    }


    console.log(
        "Showing internal page:",
        pageNumber
    );


    /*
     * The camera/video connection is
     * intentionally NOT touched here.
     *
     * Therefore clicking Next will not
     * close the WebRTC connection.
     */
}


/* =========================================================
   WEBSOCKET URL
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";


const WS_URL =
    WS_PROTOCOL +
    "//" +
    location.host +
    "/viewer";


/* =========================================================
   STATE
========================================================= */

let socket = null;

let reconnectTimer = null;

let reconnectAttempts = 0;

let manuallyClosed = false;


/*
 * Known cameras
 */

const cameras =
    new Set();


/*
 * WebRTC peers
 */

const peers =
    new Map();


/*
 * ICE candidates received
 * before remote description
 */

const pendingCandidates =
    new Map();


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById(
        "status"
    );


const videoEl =
    document.getElementById(
        "liveVideo"
    );


const reconnectBtn =
    document.getElementById(
        "reconnect"
    );


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusEl.textContent =
        text;
}


/* =========================================================
   SEND
========================================================= */

function send(data) {

    if (
        !socket ||
        socket.readyState !==
            WebSocket.OPEN
    ) {

        console.log(
            "WebSocket not ready:",
            data
        );

        return false;
    }


    try {

        socket.send(
            JSON.stringify(
                data
            )
        );


        console.log(
            "SEND:",
            data
        );


        return true;

    } catch (error) {

        console.error(
            "Send error:",
            error
        );


        return false;
    }
}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState ===
                WebSocket.OPEN ||

            socket.readyState ===
                WebSocket.CONNECTING
        )
    ) {

        return;
    }


    manuallyClosed =
        false;


    setStatus(
        "🟡 Connecting..."
    );


    console.log(
        "Connecting:",
        WS_URL
    );


    try {

        socket =
            new WebSocket(
                WS_URL
            );

    } catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );


        scheduleReconnect();

        return;
    }


    /* =====================================================
       OPEN
    ===================================================== */

    socket.onopen = () => {

        console.log(
            "WEBSOCKET CONNECTED"
        );


        reconnectAttempts = 0;


        reconnectBtn.style.display =
            "none";


        setStatus(
            "🟡 Waiting for camera..."
        );


        /*
         * Ask server for cameras.
         */

        send({
            type:
                "viewer-ready"
        });


        /*
         * Re-request known cameras.
         */

        setTimeout(() => {

            for (
                const cameraId
                of cameras
            ) {

                requestCamera(
                    cameraId
                );

            }

        }, 300);
    };


    /* =====================================================
       MESSAGE
    ===================================================== */

    socket.onmessage =
        async event => {

            let message;


            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch (error) {

                console.error(
                    "Invalid message:",
                    event.data
                );

                return;
            }


            console.log(
                "RECEIVED:",
                message
            );


            try {

                await handleMessage(
                    message
                );

            } catch (error) {

                console.error(
                    "Message error:",
                    error
                );
            }
        };


    /* =====================================================
       ERROR
    ===================================================== */

    socket.onerror =
        error => {

            console.error(
                "WEBSOCKET ERROR:",
                error
            );
        };


    /* =====================================================
       CLOSE
    ===================================================== */

    socket.onclose = () => {

        console.log(
            "WEBSOCKET CLOSED"
        );


        if (
            !manuallyClosed
        ) {

            setStatus(
                "🔴 Connection lost..."
            );


            reconnectBtn.style.display =
                "block";


            scheduleReconnect();
        }
    };
}


/* =========================================================
   REQUEST CAMERA
========================================================= */

function requestCamera(
    cameraId
) {

    if (!cameraId) {
        return;
    }


    const id =
        String(
            cameraId
        );


    send({

        type:
            "viewer-ready",

        cameraId:
            id

    });
}


/* =========================================================
   MESSAGE HANDLER
========================================================= */

async function handleMessage(
    message
) {

    const type =
        message.type;


    switch (type) {


        /* ================================================
           ROLE
        ================================================= */

        case "role":

            if (
                message.cameraId
            ) {

                addCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           CAMERA ONLINE
        ================================================= */

        case "camera-online":

            if (
                message.cameraId
            ) {

                addCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           CAMERA LIVE
        ================================================= */

        case "camera-live":

            if (
                message.cameraId
            ) {

                addCamera(
                    message.cameraId
                );


                requestCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           CAMERA OFFLINE
        ================================================= */

        case "camera-offline":

            if (
                message.cameraId
            ) {

                removeCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           OFFER
        ================================================= */

        case "offer":

            await handleOffer(
                message
            );

            break;


        /* ================================================
           ANSWER
        ================================================= */

        case "answer":

            await handleAnswer(
                message
            );

            break;


        /* ================================================
           CANDIDATE
        ================================================= */

        case "candidate":

            await handleCandidate(
                message
            );

            break;


        default:

            console.log(
                "Unknown message:",
                type
            );
    }
}


/* =========================================================
   ADD CAMERA
========================================================= */

function addCamera(
    cameraId
) {

    if (!cameraId) {
        return;
    }


    const id =
        String(
            cameraId
        );


    cameras.add(
        id
    );


    setStatus(
        "🟢 Camera available"
    );


    requestCamera(
        id
    );
}


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(
    cameraId
) {

    const id =
        String(
            cameraId
        );


    cameras.delete(
        id
    );


    destroyPeer(
        id
    );


    /*
     * Clear video only when
     * camera actually goes offline.
     */

    if (
        cameras.size === 0
    ) {

        videoEl.srcObject =
            null;


        setStatus(
            "🟡 Waiting for camera..."
        );
    }
}


/* =========================================================
   CREATE WEBRTC PEER
========================================================= */

function createPeer(
    cameraId
) {

    destroyPeer(
        cameraId
    );


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }

            ]

        });


    peers.set(
        cameraId,
        pc
    );


    /* =====================================================
       VIDEO TRACK
    ===================================================== */

    pc.ontrack =
        event => {

            console.log(
                "VIDEO TRACK RECEIVED:",
                cameraId
            );


            let stream;


            if (
                event.streams &&
                event.streams.length > 0
            ) {

                stream =
                    event.streams[0];

            } else {

                stream =
                    videoEl.srcObject;


                if (!stream) {

                    stream =
                        new MediaStream();

                }


                if (
                    event.track &&
                    !stream
                        .getTracks()
                        .includes(
                            event.track
                        )
                ) {

                    stream.addTrack(
                        event.track
                    );
                }
            }


            /*
             * IMPORTANT:
             *
             * We use the same video
             * element for the entire page.
             */

            videoEl.srcObject =
                stream;


            videoEl.play()
                .then(() => {

                    console.log(
                        "VIDEO PLAYING"
                    );

                })
                .catch(error => {

                    console.warn(
                        "Video play:",
                        error
                    );
                });


            setStatus(
                "🟢 LIVE"
            );
        };


    /* =====================================================
       ICE
    ===================================================== */

    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;
            }


            send({

                type:
                    "candidate",

                cameraId:
                    cameraId,

                candidate:
                    event.candidate

            });
        };


    /* =====================================================
       CONNECTION STATE
    ===================================================== */

    pc.onconnectionstatechange =
        () => {

            console.log(
                "WEBRTC:",
                cameraId,
                pc.connectionState
            );


            if (
                pc.connectionState ===
                    "connected"
            ) {

                setStatus(
                    "🟢 LIVE"
                );
            }


            if (
                pc.connectionState ===
                    "failed"
            ) {

                recoverCamera(
                    cameraId
                );
            }


            if (
                pc.connectionState ===
                    "disconnected"
            ) {

                setTimeout(() => {

                    const current =
                        peers.get(
                            cameraId
                        );


                    if (
                        current === pc &&
                        pc.connectionState ===
                            "disconnected"
                    ) {

                        recoverCamera(
                            cameraId
                        );
                    }

                }, 1500);
            }
        };


    /* =====================================================
       ICE STATE
    ===================================================== */

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                cameraId,
                pc.iceConnectionState
            );


            if (
                pc.iceConnectionState ===
                    "failed"
            ) {

                recoverCamera(
                    cameraId
                );
            }
        };


    return pc;
}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(
    message
) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    const offer =
        message.offer ||
        message.sdp;


    if (
        !cameraId ||
        !offer
    ) {

        console.warn(
            "Invalid offer:",
            message
        );

        return;
    }


    const id =
        String(
            cameraId
        );


    console.log(
        "OFFER FROM:",
        id
    );


    let pc =
        peers.get(
            id
        );


    if (!pc) {

        pc =
            createPeer(
                id
            );
    }


    try {

        const description =
            typeof offer ===
                "string"

                ? {
                    type:
                        "offer",

                    sdp:
                        offer
                }

                : offer;


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                description
            )
        );


        /*
         * Add ICE candidates that
         * arrived before the offer.
         */

        const queued =
            pendingCandidates.get(
                id
            ) || [];


        for (
            const candidate
            of queued
        ) {

            try {

                await pc.addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            } catch (error) {

                console.warn(
                    "Queued ICE error:",
                    error
                );
            }
        }


        pendingCandidates.delete(
            id
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        /*
         * Send answer.
         */

        send({

            type:
                "answer",

            cameraId:
                id,

            answer:
                pc.localDescription

        });


    } catch (error) {

        console.error(
            "OFFER ERROR:",
            error
        );


        destroyPeer(
            id
        );


        setTimeout(() => {

            requestCamera(
                id
            );

        }, 1000);
    }
}


/* =========================================================
   HANDLE ANSWER
========================================================= */

async function handleAnswer(
    message
) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    const answer =
        message.answer ||
        message.sdp;


    if (
        !cameraId ||
        !answer
    ) {

        return;
    }


    const id =
        String(
            cameraId
        );


    const pc =
        peers.get(
            id
        );


    if (!pc) {

        return;
    }


    try {

        await pc.setRemoteDescription(

            new RTCSessionDescription(

                typeof answer ===
                    "string"

                    ? {
                        type:
                            "answer",

                        sdp:
                            answer
                    }

                    : answer
            )

        );

    } catch (error) {

        console.error(
            "ANSWER ERROR:",
            error
        );
    }
}


/* =========================================================
   HANDLE ICE
========================================================= */

async function handleCandidate(
    message
) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    const candidate =
        message.candidate;


    if (
        !cameraId ||
        !candidate
    ) {

        return;
    }


    const id =
        String(
            cameraId
        );


    const pc =
        peers.get(
            id
        );


    /*
     * Candidate arrived before
     * remote description.
     */

    if (
        !pc ||
        !pc.remoteDescription
    ) {

        if (
            !pendingCandidates.has(
                id
            )
        ) {

            pendingCandidates.set(
                id,
                []
            );
        }


        pendingCandidates
            .get(id)
            .push(
                candidate
            );


        return;
    }


    try {

        await pc.addIceCandidate(

            new RTCIceCandidate(
                candidate
            )

        );

    } catch (error) {

        console.warn(
            "ICE ERROR:",
            error
        );
    }
}


/* =========================================================
   RECOVER CAMERA
========================================================= */

function recoverCamera(
    cameraId
) {

    const id =
        String(
            cameraId
        );


    console.log(
        "Recovering:",
        id
    );


    destroyPeer(
        id
    );


    setStatus(
        "🟡 Reconnecting..."
    );


    setTimeout(() => {

        if (
            document.visibilityState !==
                "visible"
        ) {

            return;
        }


        if (
            socket &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            requestCamera(
                id
            );
        }

    }, 800);
}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer(
    cameraId
) {

    const id =
        String(
            cameraId
        );


    const pc =
        peers.get(
            id
        );


    if (pc) {

        try {

            pc.ontrack =
                null;

            pc.onicecandidate =
                null;

            pc.onconnectionstatechange =
                null;

            pc.oniceconnectionstatechange =
                null;

            pc.close();

        } catch (error) {

            console.warn(
                "Peer close:",
                error
            );
        }


        peers.delete(
            id
        );
    }


    pendingCandidates.delete(
        id
    );


    /*
     * IMPORTANT:
     *
     * We intentionally DO NOT set
     * videoEl.srcObject = null here.
     *
     * This prevents unnecessary black
     * frames while switching internal pages.
     */
}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (
        reconnectTimer
    ) {

        return;
    }


    reconnectAttempts++;


    const delay =
        Math.min(
            1000 *
                Math.pow(
                    1.5,
                    reconnectAttempts - 1
                ),
            10000
        );


    reconnectTimer =
        setTimeout(() => {

            reconnectTimer =
                null;


            if (
                document.visibilityState ===
                    "visible"
            ) {

                connectWebSocket();
            }

        }, delay);
}


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState !==
                "visible"
        ) {

            return;
        }


        console.log(
            "Viewer visible again"
        );


        /*
         * If WebSocket disappeared,
         * reconnect it.
         */

        if (
            !socket ||
            socket.readyState !==
                WebSocket.OPEN
        ) {

            connectWebSocket();

            return;
        }


        /*
         * Re-request cameras.
         */

        for (
            const cameraId
            of cameras
        ) {

            requestCamera(
                cameraId
            );
        }
    }
);


/* =========================================================
   WINDOW FOCUS
========================================================= */

window.addEventListener(
    "focus",
    () => {

        if (
            document.visibilityState !==
                "visible"
        ) {

            return;
        }


        if (
            !socket ||
            socket.readyState !==
                WebSocket.OPEN
        ) {

            connectWebSocket();

            return;
        }


        for (
            const cameraId
            of cameras
        ) {

            requestCamera(
                cameraId
            );
        }
    }
);


/* =========================================================
   NETWORK ONLINE
========================================================= */

window.addEventListener(
    "online",
    () => {

        console.log(
            "Network online"
        );


        if (
            socket
        ) {

            try {
                socket.close();
            } catch (error) {}
        }


        socket =
            null;


        connectWebSocket();
    }
);


/* =========================================================
   NETWORK OFFLINE
========================================================= */

window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );
    }
);


/* =========================================================
   MANUAL RECONNECT
========================================================= */

reconnectBtn.addEventListener(
    "click",
    () => {

        reconnectBtn.style.display =
            "none";


        manuallyClosed =
            false;


        if (socket) {

            try {
                socket.close();
            } catch (error) {}
        }


        socket =
            null;


        connectWebSocket();
    }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
</html>
