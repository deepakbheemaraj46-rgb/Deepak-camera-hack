<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>
body {
  margin: 0;
  background: #111;
  color: #fff;
  font-family: Arial;
  text-align: center;
}

h1 {
  font-size: 25px;
}

#status {
  font-size: 17px;
  margin: 15px;
}

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  padding: 12px;
}

.card {
  background: #222;
  border-radius: 10px;
  padding: 8px;
}

.label {
  font-size: 14px;
  padding: 6px;
  color: #ddd;
}

.video-wrap {
  position: relative;
  width: 100%;
}

.video-wrap video {
  width: 100%;
  display: block;
  background: #000;
  border-radius: 8px;
}

.fullscreen-btn {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.75);
  color: white;
  font-size: 26px;
  z-index: 10;
}

video:fullscreen {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: black;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">Connecting...</div>

<div id="grid"></div>

<script>

const status = document.getElementById("status");
const grid = document.getElementById("grid");

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" + location.host + "/viewer"
);

const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();


// ADD CAMERA

function addCamera(cameraId) {

  if (cards.has(cameraId)) return;

  const card = document.createElement("div");
  card.className = "card";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Camera " + cameraId;

  const videoWrap = document.createElement("div");
  videoWrap.className = "video-wrap";

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;

  const fullscreenBtn = document.createElement("button");

  fullscreenBtn.className = "fullscreen-btn";
  fullscreenBtn.innerHTML = "⛶";

  fullscreenBtn.onclick = () => {

    if (video.requestFullscreen) {
      video.requestFullscreen();
    }

    else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }

  };

  videoWrap.appendChild(video);

  videoWrap.appendChild(fullscreenBtn);

  card.appendChild(label);

  card.appendChild(videoWrap);

  grid.appendChild(card);

  cards.set(cameraId, {
    card: card,
    video: video
  });

}


// REMOVE CAMERA

function removeCamera(cameraId) {

  const pc = peers.get(cameraId);

  if (pc) {

    pc.close();

  }

  peers.delete(cameraId);

  pendingCandidates.delete(cameraId);

  const item = cards.get(cameraId);

  if (item) {

    item.card.remove();

  }

  cards.delete(cameraId);

}


// START WEBRTC

function startPeer(cameraId) {

  if (peers.has(cameraId)) return;

  addCamera(cameraId);

  const pc = new RTCPeerConnection({

    iceServers: [

      {
        urls: "stun:stun.l.google.com:19302"
      }

    ]

  });

  peers.set(cameraId, pc);

  pendingCandidates.set(cameraId, []);


  // SEND ICE

  pc.onicecandidate = e => {

    if (e.candidate && ws.readyState === WebSocket.OPEN) {

      ws.send(JSON.stringify({

        type: "candidate",

        candidate: e.candidate,

        cameraId: cameraId

      }));

    }

  };


  // RECEIVE VIDEO

  pc.ontrack = e => {

    const item = cards.get(cameraId);

    if (item && e.streams[0]) {

      item.video.srcObject = e.streams[0];

      item.video.play().catch(() => {});

    }

  };


  // AUTO RECONNECT

  pc.onconnectionstatechange = () => {

    console.log(
      "Connection:",
      pc.connectionState
    );

    if (pc.connectionState === "connected") {

      status.textContent =
        "🟢 Camera is LIVE";

    }


    if (
      pc.connectionState === "failed"
    ) {

      status.textContent =
        "🟡 Reconnecting...";

      reconnectCamera(cameraId);

    }

  };


  // ICE FAILED

  pc.oniceconnectionstatechange = () => {

    if (
      pc.iceConnectionState === "failed"
    ) {

      status.textContent =
        "🟡 Reconnecting...";

      reconnectCamera(cameraId);

    }

  };


  // ASK CAMERA FOR VIDEO

  ws.send(JSON.stringify({

    type: "viewer-ready",

    cameraId: cameraId

  }));

}


// RECONNECT FUNCTION

function reconnectCamera(cameraId) {

  const oldPeer =
    peers.get(cameraId);

  if (oldPeer) {

    oldPeer.onconnectionstatechange = null;

    oldPeer.oniceconnectionstatechange = null;

    oldPeer.close();

  }

  peers.delete(cameraId);

  pendingCandidates.delete(cameraId);


  setTimeout(() => {

    startPeer(cameraId);

  }, 2000);

}


// WEBSOCKET MESSAGE

ws.onmessage = async e => {

  const m = JSON.parse(e.data);


  if (m.type === "role") {

    status.textContent =
      "🟡 Waiting for cameras...";

    if (Array.isArray(m.cameras)) {

      m.cameras.forEach(startPeer);

    }

  }


  if (m.type === "camera-online") {

    startPeer(m.cameraId);

    status.textContent =
      "🟢 Camera connected";

  }


  if (m.type === "camera-live") {

    addCamera(m.cameraId);

    status.textContent =
      "🟢 Camera is LIVE";

  }


  if (m.type === "camera-offline") {

    removeCamera(m.cameraId);

    if (peers.size === 0) {

      status.textContent =
        "🔴 No cameras connected";

    }

  }


  if (m.type === "offer") {

    const cameraId =
      m.cameraId;


    if (!peers.has(cameraId)) {

      startPeer(cameraId);

    }


    const pc =
      peers.get(cameraId);


    await pc.setRemoteDescription(
      m.offer
    );


    const queued =
      pendingCandidates.get(cameraId) || [];


    for (const c of queued) {

      await pc.addIceCandidate(c)
        .catch(() => {});

    }


    pendingCandidates.set(
      cameraId,
      []
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    ws.send(JSON.stringify({

      type: "answer",

      answer: pc.localDescription,

      cameraId: cameraId

    }));

  }


  if (m.type === "candidate") {

    const cameraId =
      m.cameraId;


    const pc =
      peers.get(cameraId);


    if (!pc) return;


    if (pc.remoteDescription) {

      await pc.addIceCandidate(
        m.candidate
      ).catch(() => {});

    }

    else {

      pendingCandidates
        .get(cameraId)
        .push(m.candidate);

    }

  }

};


// WEBSOCKET CLOSED

ws.onclose = () => {

  status.textContent =
    "🔴 Viewer connection closed";

};

</script>

</body>
</html>
