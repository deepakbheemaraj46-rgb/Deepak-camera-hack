<!doctype html>
<html>
<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Live Camera Viewer</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#080b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  text-align:center;
}


/* =========================================================
   HEADER
========================================================= */

h1{
  font-size:24px;
  margin:20px 0 8px;
}

#status{
  font-size:15px;
  color:#aaa;
  margin:8px 12px 15px;
}


/* =========================================================
   LIVE COUNT
========================================================= */

.live-count{
  display:inline-block;
  margin-left:5px;
  padding:5px 9px;
  border-radius:20px;
  background:#123b25;
  color:#35e879;
  font-size:12px;
  font-weight:bold;
}


/* =========================================================
   GRID
========================================================= */

#grid{

  display:grid;

  /*
     ALWAYS 2 COLUMNS
  */
  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:14px;

  padding:12px;

  width:100%;
}


/* =========================================================
   CAMERA CARD
========================================================= */

.card{

  background:#10151b;

  border:1px solid #29313a;

  border-radius:14px;

  padding:9px;

  min-width:0;

  overflow:hidden;

  text-align:left;

}


/* =========================================================
   CAMERA HEADER
========================================================= */

.card-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:6px;

  padding:3px 3px 9px;

}

.label{

  display:flex;

  align-items:center;

  gap:7px;

  font-size:16px;

  font-weight:bold;

  color:#fff;

  min-width:0;

}


/* GREEN LIVE DOT */

.live-dot{

  width:9px;

  height:9px;

  flex-shrink:0;

  border-radius:50%;

  background:#35e879;

  box-shadow:
    0 0 7px #35e879;
}


/* LIVE BADGE */

.live-badge{

  background:#123b25;

  color:#35e879;

  padding:5px 8px;

  border-radius:6px;

  font-size:10px;

  font-weight:bold;

  flex-shrink:0;

}


/* =========================================================
   VIDEO
========================================================= */

.video-wrap{

  position:relative;

  width:100%;

  aspect-ratio:16/9;

  overflow:hidden;

  background:#000;

  border-radius:9px;

}


.card video{

  display:block;

  width:100%;

  height:100%;

  object-fit:cover;

  background:#000;

  border-radius:9px;

}


/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{

  width:100%;

  margin-top:8px;

  padding:9px;

  border:1px solid #343c45;

  border-radius:7px;

  background:#181e25;

  color:#fff;

  font-size:14px;

  cursor:pointer;

}

.fullscreen-btn:active{

  background:#303943;

}


/* =========================================================
   STATE
========================================================= */

.state{

  font-size:12px;

  padding:7px 3px;

  color:#9da6af;

}


/* =========================================================
   CAMERA ID
========================================================= */

.camera-id{

  font-size:10px;

  color:#666;

  margin-top:2px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}


/* =========================================================
   FULLSCREEN VIDEO
========================================================= */

video:fullscreen{

  width:100vw;

  height:100vh;

  object-fit:contain;

  background:#000;

}

video:-webkit-full-screen{

  width:100vw;

  height:100vh;

  object-fit:contain;

  background:#000;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  padding:20px 10px;

  color:#666;

  font-size:12px;

}

.footer .secure{

  color:#35e879;

  margin-bottom:6px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  h1{

    font-size:21px;

    margin:15px 0 6px;

  }

  #status{

    font-size:13px;

    margin-bottom:8px;

  }


  #grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:7px;

    padding:7px;

  }


  .card{

    padding:6px;

    border-radius:10px;

  }


  .card-header{

    padding:2px 2px 6px;

  }


  .label{

    font-size:12px;

    gap:4px;

  }


  .live-dot{

    width:7px;

    height:7px;

  }


  .live-badge{

    padding:3px 5px;

    font-size:8px;

  }


  .state{

    font-size:9px;

    padding:5px 2px;

  }


  .camera-id{

    font-size:8px;

  }


  .fullscreen-btn{

    margin-top:5px;

    padding:7px 3px;

    font-size:10px;

  }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

  #grid{

    gap:5px;

    padding:5px;

  }


  .card{

    padding:4px;

  }


  .label{

    font-size:10px;

  }


  .live-badge{

    font-size:7px;

    padding:3px 4px;

  }


  .fullscreen-btn{

    font-size:9px;

    padding:6px 2px;

  }

}

</style>

</head>


<body>


<h1>📹 Live Camera Viewer</h1>


<div id="status">
  Connecting...
</div>


<div id="grid"></div>


<div class="footer">

  <div class="secure">
    🛡 Secure WebRTC Connection
  </div>

  Live Camera Viewer

</div>


<script>


const status =
  document.getElementById("status");

const grid =
  document.getElementById("grid");


let ws = null;

let viewerId = null;


const peers =
  new Map();


const pendingCandidates =
  new Map();


const cards =
  new Map();


const reconnectTimers =
  new Map();


const watchdogTimers =
  new Map();


let reconnectingSocket = false;


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket(){

  if(
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ){

    return;

  }


  status.textContent =
    "🟡 Connecting viewer...";


  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";


  ws = new WebSocket(
    protocol +
    "//" +
    location.host +
    "/viewer"
  );


  ws.onopen = () => {

    reconnectingSocket = false;

    status.textContent =
      "🟢 Viewer connected";

    console.log(
      "WebSocket connected"
    );

  };


  ws.onmessage = async e => {

    let m;

    try{

      m = JSON.parse(e.data);

    }catch{

      return;

    }


    await handleMessage(m);

  };


  ws.onerror = () => {

    console.log(
      "WebSocket error"
    );

  };


  ws.onclose = () => {

    console.log(
      "WebSocket closed"
    );


    status.textContent =
      "🔴 Viewer connection lost";


    if(!reconnectingSocket){

      reconnectingSocket = true;


      setTimeout(() => {

        reconnectingSocket = false;

        connectWebSocket();

      },3000);

    }

  };

}


/* =========================================================
   SAFE SEND
========================================================= */

function sendMessage(message){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    try{

      ws.send(
        JSON.stringify(message)
      );

      return true;

    }catch{}

  }

  return false;

}


/* =========================================================
   CAMERA CARD
========================================================= */

function addCamera(cameraId){

  if(cards.has(cameraId)){

    return cards.get(cameraId);

  }


  const card =
    document.createElement("div");


  card.className =
    "card";


  card.id =
    "card-" + cameraId;


  /* HEADER */

  const header =
    document.createElement("div");


  header.className =
    "card-header";


  /* LABEL */

  const label =
    document.createElement("div");


  label.className =
    "label";


  const dot =
    document.createElement("span");


  dot.className =
    "live-dot";


  label.appendChild(dot);


  const labelText =
    document.createElement("span");


  labelText.textContent =
    "Camera " + cameraId;


  label.appendChild(
    labelText
  );


  /* LIVE */

  const live =
    document.createElement("span");


  live.className =
    "live-badge";


  live.textContent =
    "LIVE";


  header.appendChild(label);

  header.appendChild(live);


  /* =====================================================
     STATE
  ===================================================== */

  const state =
    document.createElement("div");


  state.className =
    "state";


  state.textContent =
    "🟡 Connecting...";


  /* =====================================================
     VIDEO WRAPPER
  ===================================================== */

  const videoWrap =
    document.createElement("div");


  videoWrap.className =
    "video-wrap";


  const video =
    document.createElement("video");


  video.autoplay = true;

  video.playsInline = true;

  video.muted = true;


  video.setAttribute(
    "autoplay",
    ""
  );


  video.setAttribute(
    "playsinline",
    "");


  videoWrap.appendChild(
    video
  );


  /* =====================================================
     FULLSCREEN
  ===================================================== */

  const fullscreenBtn =
    document.createElement("button");


  fullscreenBtn.className =
    "fullscreen-btn";


  fullscreenBtn.textContent =
    "⛶ Full Screen";


  fullscreenBtn.onclick =
    async () => {

      try{

        if(video.requestFullscreen){

          await video.requestFullscreen();

        }

        else if(
          video.webkitRequestFullscreen
        ){

          video.webkitRequestFullscreen();

        }

        else if(
          video.webkitEnterFullscreen
        ){

          video.webkitEnterFullscreen();

        }

      }catch(error){

        console.log(
          "Fullscreen failed:",
          error
        );

      }

    };


  /* =====================================================
     CAMERA ID
  ===================================================== */

  const cameraIdText =
    document.createElement("div");


  cameraIdText.className =
    "camera-id";


  cameraIdText.textContent =
    "ID: " + cameraId;


  /* =====================================================
     BUILD CARD
  ===================================================== */

  card.appendChild(header);

  card.appendChild(state);

  card.appendChild(videoWrap);

  card.appendChild(fullscreenBtn);

  card.appendChild(cameraIdText);


  grid.appendChild(card);


  const item = {

    card,

    label,

    state,

    video,

    lastTime:0,

    lastProgress:Date.now()

  };


  cards.set(
    cameraId,
    item
  );


  return item;

}


/* =========================================================
   CAMERA STATE
========================================================= */

function setCameraState(
  cameraId,
  text
){

  const item =
    cards.get(cameraId);


  if(item){

    item.state.textContent =
      text;

  }

}


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(cameraId){

  stopWatchdog(
    cameraId
  );


  const pc =
    peers.get(cameraId);


  if(pc){

    try{

      pc.ontrack = null;

      pc.onicecandidate = null;

      pc.onconnectionstatechange = null;

      pc.oniceconnectionstatechange = null;

      pc.close();

    }catch{}

  }


  peers.delete(
    cameraId
  );


  pendingCandidates.delete(
    cameraId
  );


  const timer =
    reconnectTimers.get(
      cameraId
    );


  if(timer){

    clearTimeout(timer);

    reconnectTimers.delete(
      cameraId
    );

  }


  const item =
    cards.get(cameraId);


  if(item){

    try{

      if(item.video.srcObject){

        item.video.srcObject
          .getTracks()
          .forEach(
            track => track.stop()
          );

      }

    }catch{}


    item.card.remove();

  }


  cards.delete(
    cameraId
  );

}


/* =========================================================
   CLOSE PEER
========================================================= */

function closePeer(cameraId){

  const pc =
    peers.get(cameraId);


  if(pc){

    try{

      pc.ontrack = null;

      pc.onicecandidate = null;

      pc.onconnectionstatechange = null;

      pc.oniceconnectionstatechange = null;

      pc.close();

    }catch{}

  }


  peers.delete(
    cameraId
  );


  pendingCandidates.delete(
    cameraId
  );

}


/* =========================================================
   START PEER
========================================================= */

function startPeer(
  cameraId,
  reconnect=false
){

  if(!cameraId){

    return;

  }


  addCamera(
    cameraId
  );


  if(peers.has(cameraId)){

    if(!reconnect){

      return;

    }


    closePeer(
      cameraId
    );

  }


  const pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    });


  peers.set(
    cameraId,
    pc
  );


  pendingCandidates.set(
    cameraId,
    []
  );


  setCameraState(
    cameraId,
    reconnect
      ? "🟡 Reconnecting..."
      : "🟡 Connecting..."
  );


  /* =====================================================
     ICE
  ===================================================== */

  pc.onicecandidate =
    e => {

      if(!e.candidate){

        return;

      }


      sendMessage({

        type:"candidate",

        candidate:e.candidate,

        cameraId

      });

    };


  /* =====================================================
     REMOTE TRACK
  ===================================================== */

  pc.ontrack =
    e => {

      console.log(
        "Remote track received:",
        cameraId,
        e.track.kind
      );


      const item =
        cards.get(cameraId);


      if(!item){

        return;

      }


      let stream =
        e.streams &&
        e.streams[0];


      if(!stream){

        if(!item.video.srcObject){

          stream =
            new MediaStream();

        }else{

          stream =
            item.video.srcObject;

        }


        try{

          stream.addTrack(
            e.track
          );

        }catch{}

      }


      item.video.srcObject =
        stream;


      e.track.onended =
        () => {

          console.log(
            "Remote track ended:",
            cameraId
          );


          setCameraState(
            cameraId,
            "🟡 Video track ended"
          );


          scheduleReconnect(
            cameraId
          );

        };


      e.track.onmute =
        () => {

          setCameraState(
            cameraId,
            "🟡 Video paused"
          );

        };


      e.track.onunmute =
        () => {

          setCameraState(
            cameraId,
            "🟢 LIVE"
          );

        };


      item.video
        .play()
        .catch(
          () => {}
        );


      startWatchdog(
        cameraId
      );

    };


  /* =====================================================
     CONNECTION STATE
  ===================================================== */

  pc.onconnectionstatechange =
    () => {

      const state =
        pc.connectionState;


      console.log(
        "Connection state:",
        cameraId,
        state
      );


      if(state === "connected"){

        setCameraState(
          cameraId,
          "🟢 LIVE"
        );


        status.textContent =
          "🟢 Camera connection active";

      }


      if(state === "connecting"){

        setCameraState(
          cameraId,
          "🟡 Connecting..."
        );

      }


      if(
        state === "disconnected"
      ){

        setCameraState(
          cameraId,
          "🟡 Reconnecting..."
        );


        scheduleReconnect(
          cameraId
        );

      }


      if(state === "failed"){

        setCameraState(
          cameraId,
          "🟠 Connection failed"
        );


        scheduleReconnect(
          cameraId
        );

      }


      if(state === "closed"){

        setCameraState(
          cameraId,
          "🔴 Connection closed"
        );

      }

    };


  /* =====================================================
     ICE STATE
  ===================================================== */

  pc.oniceconnectionstatechange =
    () => {

      const state =
        pc.iceConnectionState;


      console.log(
        "ICE state:",
        cameraId,
        state
      );


      if(state === "failed"){

        setCameraState(
          cameraId,
          "🟠 ICE failed — reconnecting"
        );


        scheduleReconnect(
          cameraId
        );

      }


      if(
        state === "disconnected"
      ){

        setCameraState(
          cameraId,
          "🟡 Network interrupted"
        );


        scheduleReconnect(
          cameraId
        );

      }

    };


  /* =====================================================
     VIEWER READY
  ===================================================== */

  if(
    !sendMessage({

      type:"viewer-ready",

      cameraId,

      reconnect

    })
  ){

    setCameraState(
      cameraId,
      "🟡 Waiting for viewer connection"
    );

  }

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect(
  cameraId
){

  if(!cards.has(cameraId)){

    return;

  }


  if(
    reconnectTimers.has(cameraId)
  ){

    return;

  }


  const timer =
    setTimeout(() => {

      reconnectTimers.delete(
        cameraId
      );


      startPeer(
        cameraId,
        true
      );

    },2500);


  reconnectTimers.set(
    cameraId,
    timer
  );

}


/* =========================================================
   WATCHDOG
========================================================= */

function startWatchdog(
  cameraId
){

  stopWatchdog(
    cameraId
  );


  const timer =
    setInterval(() => {

      const item =
        cards.get(cameraId);


      const pc =
        peers.get(cameraId);


      if(!item || !pc){

        stopWatchdog(
          cameraId
        );

        return;

      }


      const video =
        item.video;


      if(video.readyState >= 2){

        const current =
          video.currentTime;


        if(
          current !==
          item.lastTime
        ){

          item.lastTime =
            current;


          item.lastProgress =
            Date.now();


          if(
            pc.connectionState ===
            "connected"
          ){

            setCameraState(
              cameraId,
              "🟢 LIVE"
            );

          }

        }else{

          if(
            Date.now() -
            item.lastProgress >
            7000
          ){

            setCameraState(
              cameraId,
              "🟡 Video stuck — reconnecting"
            );


            scheduleReconnect(
              cameraId
            );


            item.lastProgress =
              Date.now();

          }

        }

      }else{

        if(
          Date.now() -
          item.lastProgress >
          10000
        ){

          setCameraState(
            cameraId,
            "🟡 Waiting for video..."
          );


          scheduleReconnect(
            cameraId
          );


          item.lastProgress =
            Date.now();

        }

      }

    },3000);


  watchdogTimers.set(
    cameraId
