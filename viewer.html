<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Camera Viewer</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  font-size:25px;
  margin:20px 0 10px;
}

#status{
  font-size:17px;
  margin:15px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px;
  padding:12px;
}

.card{
  background:#222;
  border-radius:10px;
  padding:8px;
}

.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#000;
  border-radius:8px;
}

.card video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  border-radius:8px;
}

.label{
  font-size:14px;
  padding:6px;
  color:#ddd;
}

.state{
  font-size:13px;
  padding:4px;
  color:#aaa;
}

/* FULL SCREEN BUTTON */
.fullscreen-btn{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:0;
  border-radius:7px;
  background:#333;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

.fullscreen-btn:active{
  background:#555;
}

/* FULLSCREEN VIDEO */
video:fullscreen{
  width:100vw;
  height:100vh;
  object-fit:contain;
  background:#000;
}

/* iPhone / Safari */
video:-webkit-full-screen{
  width:100vw;
  height:100vh;
  object-fit:contain;
  background:#000;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">Connecting...</div>

<div id="grid"></div>

<script>

const status = document.getElementById("status");
const grid = document.getElementById("grid");

let ws = null;
let viewerId = null;

const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();

const reconnectTimers = new Map();
const watchdogTimers = new Map();

let reconnectingSocket = false;


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket(){

  if(
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ){
    return;
  }

  status.textContent = "🟡 Connecting viewer...";

  ws = new WebSocket(
    (location.protocol === "https:" ? "wss:" : "ws:") +
    "//" + location.host + "/viewer"
  );

  ws.onopen = () => {

    reconnectingSocket = false;

    status.textContent = "🟡 Viewer connected";

    console.log("WebSocket connected");

  };


  ws.onmessage = async e => {

    let m;

    try{
      m = JSON.parse(e.data);
    }catch{
      return;
    }

    await handleMessage(m);

  };


  ws.onerror = () => {

    console.log("WebSocket error");

  };


  ws.onclose = () => {

    console.log("WebSocket closed");

    status.textContent = "🔴 Viewer connection lost";

    if(!reconnectingSocket){

      reconnectingSocket = true;

      setTimeout(() => {

        reconnectingSocket = false;
        connectWebSocket();

      },3000);

    }

  };

}


/* =========================================================
   SAFE SEND
========================================================= */

function sendMessage(message){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    try{

      ws.send(JSON.stringify(message));

      return true;

    }catch{}

  }

  return false;

}


/* =========================================================
   CAMERA CARD
========================================================= */

function addCamera(cameraId){

  if(cards.has(cameraId)){

    return cards.get(cameraId);

  }


  const card = document.createElement("div");

  card.className = "card";
  card.id = "card-" + cameraId;


  const label = document.createElement("div");

  label.className = "label";

  label.textContent = "Camera " + cameraId;


  const state = document.createElement("div");

  state.className = "state";

  state.textContent = "🟡 Connecting...";


  /* =====================================================
     VIDEO WRAPPER
  ===================================================== */

  const videoWrap = document.createElement("div");

  videoWrap.className = "video-wrap";


  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;

  video.setAttribute("autoplay","");
  video.setAttribute("playsinline","");


  videoWrap.appendChild(video);


  /* =====================================================
     FULL SCREEN BUTTON
  ===================================================== */

  const fullscreenBtn = document.createElement("button");

  fullscreenBtn.className = "fullscreen-btn";

  fullscreenBtn.textContent = "⛶ Full Screen";


  fullscreenBtn.onclick = async () => {

    try{

      if(video.requestFullscreen){

        await video.requestFullscreen();

      }

      else if(video.webkitRequestFullscreen){

        video.webkitRequestFullscreen();

      }

      else if(video.webkitEnterFullscreen){

        video.webkitEnterFullscreen();

      }

    }catch(error){

      console.log(
        "Fullscreen failed:",
        error
      );

    }

  };


  /* =====================================================
     CARD
  ===================================================== */

  card.appendChild(label);

  card.appendChild(state);

  card.appendChild(videoWrap);

  card.appendChild(fullscreenBtn);

  grid.appendChild(card);


  const item = {

    card,
    label,
    state,
    video,

    lastTime:0,
    lastProgress:Date.now()

  };


  cards.set(cameraId,item);

  return item;

}


/* =========================================================
   CAMERA STATE
========================================================= */

function setCameraState(cameraId,text){

  const item = cards.get(cameraId);

  if(item){

    item.state.textContent = text;

  }

}


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(cameraId){

  stopWatchdog(cameraId);

  const pc = peers.get(cameraId);

  if(pc){

    try{

      pc.ontrack = null;
      pc.onicecandidate = null;
      pc.onconnectionstatechange = null;
      pc.oniceconnectionstatechange = null;

      pc.close();

    }catch{}

  }

  peers.delete(cameraId);

  pendingCandidates.delete(cameraId);

  const timer = reconnectTimers.get(cameraId);

  if(timer){

    clearTimeout(timer);

    reconnectTimers.delete(cameraId);

  }


  const item = cards.get(cameraId);

  if(item){

    try{

      if(item.video.srcObject){

        item.video.srcObject
          .getTracks()
          .forEach(track => track.stop());

      }

    }catch{}


    item.card.remove();

  }

  cards.delete(cameraId);

}


/* =========================================================
   CLOSE PEER ONLY
========================================================= */

function closePeer(cameraId){

  const pc = peers.get(cameraId);

  if(pc){

    try{

      pc.ontrack = null;
      pc.onicecandidate = null;
      pc.onconnectionstatechange = null;
      pc.oniceconnectionstatechange = null;

      pc.close();

    }catch{}

  }

  peers.delete(cameraId);

  pendingCandidates.delete(cameraId);

}


/* =========================================================
   START PEER
========================================================= */

function startPeer(cameraId,reconnect=false){

  if(!cameraId){

    return;

  }


  addCamera(cameraId);


  if(peers.has(cameraId)){

    if(!reconnect){

      return;

    }

    closePeer(cameraId);

  }


  const pc = new RTCPeerConnection({

    iceServers:[

      {
        urls:"stun:stun.l.google.com:19302"
      }

    ]

  });


  peers.set(cameraId,pc);

  pendingCandidates.set(cameraId,[]);

  setCameraState(
    cameraId,
    reconnect
      ? "🟡 Reconnecting..."
      : "🟡 Connecting..."
  );


  /* =====================================================
     ICE CANDIDATE
  ===================================================== */

  pc.onicecandidate = e => {

    if(!e.candidate){

      return;

    }


    sendMessage({

      type:"candidate",

      candidate:e.candidate,

      cameraId

    });

  };


  /* =====================================================
     REMOTE TRACK
  ===================================================== */

  pc.ontrack = e => {

    console.log(
      "Remote track received:",
      cameraId,
      e.track.kind
    );


    const item = cards.get(cameraId);

    if(!item){

      return;

    }


    let stream = e.streams && e.streams[0];


    if(!stream){

      if(!item.video.srcObject){

        stream = new MediaStream();

      }else{

        stream = item.video.srcObject;

      }

      try{

        stream.addTrack(e.track);

      }catch{}

    }


    item.video.srcObject = stream;


    e.track.onended = () => {

      console.log(
        "Remote track ended:",
        cameraId
      );

      setCameraState(
        cameraId,
        "🟡 Video track ended"
      );

      scheduleReconnect(cameraId);

    };


    e.track.onmute = () => {

      console.log(
        "Remote track muted:",
        cameraId
      );

      setCameraState(
        cameraId,
        "🟡 Video paused"
      );

    };


    e.track.onunmute = () => {

      console.log(
        "Remote track resumed:",
        cameraId
      );

      setCameraState(
        cameraId,
        "🟢 LIVE"
      );

    };


    item.video.play().catch(() => {});


    startWatchdog(cameraId);

  };


  /* =====================================================
     PEER CONNECTION STATE
  ===================================================== */

  pc.onconnectionstatechange = () => {

    const state = pc.connectionState;

    console.log(
      "Connection state:",
      cameraId,
      state
    );


    if(state === "connected"){

      setCameraState(
        cameraId,
        "🟢 LIVE"
      );

      status.textContent =
        "🟢 Camera connection active";

    }


    if(state === "connecting"){

      setCameraState(
        cameraId,
        "🟡 Connecting..."
      );

    }


    if(state === "disconnected"){

      setCameraState(
        cameraId,
        "🟡 Reconnecting..."
      );

      scheduleReconnect(cameraId);

    }


    if(state === "failed"){

      setCameraState(
        cameraId,
        "🟠 Connection failed"
      );

      scheduleReconnect(cameraId);

    }


    if(state === "closed"){

      setCameraState(
        cameraId,
        "🔴 Connection closed"
      );

    }

  };


  /* =====================================================
     ICE CONNECTION STATE
  ===================================================== */

  pc.oniceconnectionstatechange = () => {

    const state = pc.iceConnectionState;

    console.log(
      "ICE state:",
      cameraId,
      state
    );


    if(state === "failed"){

      setCameraState(
        cameraId,
        "🟠 ICE failed — reconnecting"
      );

      scheduleReconnect(cameraId);

    }


    if(state === "disconnected"){

      setCameraState(
        cameraId,
        "🟡 Network interrupted"
      );

      scheduleReconnect(cameraId);

    }

  };


  /* =====================================================
     ASK CAMERA FOR OFFER
  ===================================================== */

  if(
    !sendMessage({

      type:"viewer-ready",

      cameraId,

      reconnect

    })
  ){

    setCameraState(
      cameraId,
      "🟡 Waiting for viewer connection"
    );

  }

}


/* =========================================================
   RECONNECT CAMERA
========================================================= */

function scheduleReconnect(cameraId){

  if(!cards.has(cameraId)){

    return;

  }


  if(reconnectTimers.has(cameraId)){

    return;

  }


  const timer = setTimeout(() => {

    reconnectTimers.delete(cameraId);

    startPeer(cameraId,true);

  },2500);


  reconnectTimers.set(cameraId,timer);

}


/* =========================================================
   VIDEO WATCHDOG
========================================================= */

function startWatchdog(cameraId){

  stopWatchdog(cameraId);


  const timer = setInterval(() => {

    const item = cards.get(cameraId);

    const pc = peers.get(cameraId);


    if(!item || !pc){

      stopWatchdog(cameraId);

      return;

    }


    const video = item.video;


    if(video.readyState >= 2){

      const current = video.currentTime;


      if(current !== item.lastTime){

        item.lastTime = current;

        item.lastProgress = Date.now();


        if(pc.connectionState === "connected"){

          setCameraState(
            cameraId,
            "🟢 LIVE"
          );

        }

      }else{

        if(
          Date.now() - item.lastProgress > 7000
        ){

          console.log(
            "Video appears stuck:",
            cameraId
          );

          setCameraState(
            cameraId,
            "🟡 Video stuck — reconnecting"
          );

          scheduleReconnect(cameraId);

          item.lastProgress = Date.now();

        }

      }

    }else{

      if(
        Date.now() - item.lastProgress > 10000
      ){

        setCameraState(
          cameraId,
          "🟡 Waiting for video..."
        );

        scheduleReconnect(cameraId);

        item.lastProgress = Date.now();

      }

    }

  },3000);


  watchdogTimers.set(cameraId,timer);

}


function stopWatchdog(cameraId){

  const timer = watchdogTimers.get(cameraId);

  if(timer){

    clearInterval(timer);

    watchdogTimers.delete(cameraId);

  }

}


/* =========================================================
   HANDLE SERVER MESSAGE
========================================================= */

async function handleMessage(m){

  /* =====================================================
     ROLE
  ===================================================== */

  if(m.type === "role"){

    viewerId = m.viewerId || null;

    status.textContent =
      Array.isArray(m.cameras) && m.cameras.length
        ? "🟢 Cameras available"
        : "🟡 Waiting for cameras...";


    if(Array.isArray(m.cameras)){

      for(const cameraId of m.cameras){

        startPeer(cameraId);

      }

    }

    return;

  }


  /* =====================================================
     CAMERA ONLINE
  ===================================================== */

  if(m.type === "camera-online"){

    startPeer(m.cameraId);

    status.textContent =
      "🟢 Camera connected";

    return;

  }


  /* =====================================================
     CAMERA LIVE
  ===================================================== */

  if(m.type === "camera-live"){

    addCamera(m.cameraId);

    setCameraState(
      m.cameraId,
      "🟢 Camera LIVE"
    );

    return;

  }


  /* =====================================================
     CAMERA OFFLINE
  ===================================================== */

  if(m.type === "camera-offline"){

    removeCamera(m.cameraId);

    if(peers.size === 0){

      status.textContent =
        "🔴 No cameras connected";

    }

    return;

  }


  /* =====================================================
     OFFER
  ===================================================== */

  if(m.type === "offer"){

    const cameraId = m.cameraId;

    if(!cameraId || !m.offer){

      return;

    }


    if(!peers.has(cameraId)){

      startPeer(cameraId);

    }


    const pc = peers.get(cameraId);

    if(!pc){

      return;

    }


    try{

      if(pc.signalingState === "closed"){

        scheduleReconnect(cameraId);

        return;

      }


      await pc.setRemoteDescription(m.offer);


      const queued =
        pendingCandidates.get(cameraId) || [];


      for(const c of queued){

        try{

          await pc.addIceCandidate(c);

        }catch(error){

          console.log(
            "Queued ICE candidate failed",
            error
          );

        }

      }


      pendingCandidates.set(cameraId,[]);


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(answer);


      sendMessage({

        type:"answer",

        answer:pc.localDescription,

        cameraId

      });


    }catch(error){

      console.log(
        "Offer handling failed:",
        cameraId,
        error
      );


      setCameraState(
        cameraId,
        "🟠 Negotiation failed"
      );


      scheduleReconnect(cameraId);

    }

    return;

  }


  /* =====================================================
     ICE CANDIDATE
  ===================================================== */

  if(m.type === "candidate"){

    const cameraId = m.cameraId;

    if(!cameraId || !m.candidate){

      return;

    }


    const pc = peers.get(cameraId);

    if(!pc){

      return;

    }


    try{

      if(pc.remoteDescription){

        await pc.addIceCandidate(
          m.candidate
        );

      }else{

        if(!pendingCandidates.has(cameraId)){

          pendingCandidates.set(
            cameraId,
            []
          );

        }

        pendingCandidates
          .get(cameraId)
          .push(m.candidate);

      }

    }catch(error){

      console.log(
        "ICE candidate failed:",
        error
      );

    }

  }

}


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
</html>
