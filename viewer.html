      <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Camera Viewer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    overflow: hidden;

    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;

    position: relative;
    background: #000;
}

#status {
    position: absolute;

    top: 15px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 50;

    padding: 8px 14px;

    border-radius: 20px;

    color: #fff;
    background: rgba(0,0,0,.70);

    font-size: 14px;

    white-space: nowrap;
}

#grid {
    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;
}

.camera-card {
    width: 100%;
    height: 100%;

    position: relative;

    background: #000;
    overflow: hidden;
}

.camera-card video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center;

    background: #000;
}

.camera-name {
    position: absolute;

    left: 12px;
    bottom: 12px;

    z-index: 10;

    padding: 6px 10px;

    color: #fff;
    background: rgba(0,0,0,.60);

    border-radius: 8px;

    font-size: 13px;
}

.live {
    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 10;

    padding: 6px 10px;

    color: #fff;
    background: rgba(180,0,0,.85);

    border-radius: 8px;

    font-size: 12px;
    font-weight: bold;
}

#reconnect {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    border: 0;

    border-radius: 25px;

    padding: 12px 22px;

    background: #fff;
    color: #111;

    font-size: 14px;
    font-weight: bold;

    display: none;
}

#reconnect:active {
    transform:
        translateX(-50%)
        scale(.96);
}
</style>
</head>

<body>

<div id="app">

    <div id="status">
        🟡 Connecting...
    </div>

    <div id="grid"></div>

    <button id="reconnect">
        🔄 Reconnect
    </button>

</div>


<script>
"use strict";


/* =========================================================
   WEBSOCKET URL
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const WS_URL =
    WS_PROTOCOL +
    "//" +
    location.host +
    "/viewer";


/* =========================================================
   STATE
========================================================= */

let socket = null;

let reconnectTimer = null;

let reconnectAttempts = 0;

let manuallyClosed = false;

let pageWasHidden = false;


/*
 * Known cameras
 */
const cameras = new Set();


/*
 * WebRTC peers
 */
const peers = new Map();


/*
 * ICE candidates received
 * before remote description
 */
const pendingCandidates = new Map();


/*
 * Camera cards
 */
const cards = new Map();


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById("status");

const gridEl =
    document.getElementById("grid");

const reconnectBtn =
    document.getElementById("reconnect");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusEl.textContent = text;
}


/* =========================================================
   SEND MESSAGE
========================================================= */

function send(data) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        console.log(
            "WebSocket not ready:",
            data
        );

        return false;
    }

    try {

        socket.send(
            JSON.stringify(data)
        );

        console.log(
            "SEND:",
            data
        );

        return true;

    } catch (error) {

        console.error(
            "WebSocket send error:",
            error
        );

        return false;
    }
}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }


    manuallyClosed = false;


    setStatus(
        "🟡 Connecting..."
    );


    console.log(
        "Connecting WebSocket:",
        WS_URL
    );


    try {

        socket =
            new WebSocket(WS_URL);

    } catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );

        scheduleReconnect();

        return;
    }


    /* =====================================================
       OPEN
    ===================================================== */

    socket.onopen = () => {

        console.log(
            "WEBSOCKET CONNECTED"
        );


        reconnectAttempts = 0;


        reconnectBtn.style.display =
            "none";


        setStatus(
            "🟡 Waiting for camera..."
        );


        /*
         * Ask server for cameras.
         */
        send({
            type: "viewer-ready"
        });


        /*
         * Reconnect to cameras
         * that we already know.
         */
        setTimeout(() => {

            for (
                const cameraId
                of cameras
            ) {

                requestCamera(
                    cameraId
                );
            }

        }, 300);
    };


    /* =====================================================
       MESSAGE
    ===================================================== */

    socket.onmessage = async event => {

        let message;


        try {

            message =
                JSON.parse(
                    event.data
                );

        } catch (error) {

            console.error(
                "Invalid WebSocket message:",
                event.data
            );

            return;
        }


        console.log(
            "RECEIVED:",
            message
        );


        try {

            await handleMessage(
                message
            );

        } catch (error) {

            console.error(
                "Message handling error:",
                error
            );
        }
    };


    /* =====================================================
       ERROR
    ===================================================== */

    socket.onerror = error => {

        console.error(
            "WEBSOCKET ERROR:",
            error
        );
    };


    /* =====================================================
       CLOSE
    ===================================================== */

    socket.onclose = () => {

        console.log(
            "WEBSOCKET CLOSED"
        );


        if (!manuallyClosed) {

            setStatus(
                "🔴 Connection lost..."
            );


            reconnectBtn.style.display =
                "block";


            scheduleReconnect();
        }
    };
}


/* =========================================================
   REQUEST CAMERA
========================================================= */

function requestCamera(cameraId) {

    if (!cameraId) {
        return;
    }


    cameraId =
        String(cameraId);


    send({
        type: "viewer-ready",
        cameraId: cameraId
    });
}


/* =========================================================
   MESSAGE HANDLER
========================================================= */

async function handleMessage(message) {

    const type =
        message.type;


    switch (type) {


        /* ================================================
           ROLE
        ================================================= */

        case "role":

            if (message.cameraId) {

                addCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           CAMERA ONLINE
        ================================================= */

        case "camera-online":

            if (message.cameraId) {

                addCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           CAMERA LIVE
        ================================================= */

        case "camera-live":

            if (message.cameraId) {

                addCamera(
                    message.cameraId
                );

                requestCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           CAMERA OFFLINE
        ================================================= */

        case "camera-offline":

            if (message.cameraId) {

                removeCamera(
                    message.cameraId
                );
            }

            break;


        /* ================================================
           OFFER
        ================================================= */

        case "offer":

            await handleOffer(
                message
            );

            break;


        /* ================================================
           ANSWER
        ================================================= */

        case "answer":

            await handleAnswer(
                message
            );

            break;


        /* ================================================
           ICE
        ================================================= */

        case "candidate":

            await handleCandidate(
                message
            );

            break;


        default:

            console.log(
                "Unknown message type:",
                type
            );
    }
}


/* =========================================================
   ADD CAMERA
========================================================= */

function addCamera(cameraId) {

    if (!cameraId) {
        return;
    }


    const id =
        String(cameraId);


    cameras.add(id);


    createCameraCard(id);


    setStatus(
        "🟢 Camera available"
    );


    requestCamera(id);
}


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(cameraId) {

    const id =
        String(cameraId);


    cameras.delete(id);


    destroyPeer(id);


    const card =
        cards.get(id);


    if (card) {

        card.remove();

        cards.delete(id);
    }


    if (cameras.size === 0) {

        setStatus(
            "🟡 Waiting for camera..."
        );
    }
}


/* =========================================================
   CREATE CAMERA CARD
========================================================= */

function createCameraCard(cameraId) {

    if (
        cards.has(cameraId)
    ) {

        return cards.get(
            cameraId
        );
    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "camera-card";


    card.dataset.cameraId =
        cameraId;


    const video =
        document.createElement(
            "video"
        );


    video.autoplay = true;

    video.playsInline = true;

    video.muted = true;


    video.setAttribute(
        "autoplay",
        ""
    );

    video.setAttribute(
        "playsinline",
        ""
    );

    video.setAttribute(
        "webkit-playsinline",
        ""
    );


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "camera-name";


    name.textContent =
        "Camera";


    const live =
        document.createElement(
            "div"
        );


    live.className =
        "live";


    live.textContent =
        "● LIVE";


    card.appendChild(
        video
    );

    card.appendChild(
        name
    );

    card.appendChild(
        live
    );


    gridEl.appendChild(
        card
    );


    cards.set(
        cameraId,
        card
    );


    return card;
}


/* =========================================================
   CREATE WEBRTC PEER
========================================================= */

function createPeer(cameraId) {

    destroyPeer(
        cameraId
    );


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }
            ]
        });


    peers.set(
        cameraId,
        pc
    );


    /* =====================================================
       TRACK
    ===================================================== */

    pc.ontrack = event => {

        console.log(
            "VIDEO TRACK RECEIVED:",
            cameraId
        );


        const card =
            createCameraCard(
                cameraId
            );


        const video =
            card.querySelector(
                "video"
            );


        let stream;


        if (
            event.streams &&
            event.streams.length > 0
        ) {

            stream =
                event.streams[0];

        } else {

            stream =
                video.srcObject;


            if (!stream) {

                stream =
                    new MediaStream();

                video.srcObject =
                    stream;
            }


            if (
                event.track &&
                !stream.getTracks()
                    .includes(event.track)
            ) {

                stream.addTrack(
                    event.track
                );
            }
        }


        video.srcObject =
            stream;


        /*
         * Try to start playback.
         */
        video.play()
            .then(() => {

                console.log(
                    "Video playing:",
                    cameraId
                );

            })
            .catch(error => {

                console.warn(
                    "Video play failed:",
                    error
                );
            });


        setStatus(
            "🟢 LIVE"
        );
    };


    /* =====================================================
       ICE CANDIDATE
    ===================================================== */

    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {
                return;
            }


            /*
             * Keep the same basic
             * signaling format.
             */
            send({
                type: "candidate",
                cameraId: cameraId,
                candidate:
                    event.candidate
            });
        };


    /* =====================================================
       CONNECTION STATE
    ===================================================== */

    pc.onconnectionstatechange =
        () => {

            const state =
                pc.connectionState;


            console.log(
                "WEBRTC:",
                cameraId,
                state
            );


            if (
                state === "connected"
            ) {

                setStatus(
                    "🟢 LIVE"
                );
            }


            if (
                state === "failed"
            ) {

                console.log(
                    "Peer failed:",
                    cameraId
                );


                recoverCamera(
                    cameraId
                );
            }


            if (
                state === "disconnected"
            ) {

                console.log(
                    "Peer disconnected:",
                    cameraId
                );


                setTimeout(() => {

                    const current =
                        peers.get(
                            cameraId
                        );


                    if (
                        current === pc &&
                        pc.connectionState ===
                            "disconnected"
                    ) {

                        recoverCamera(
                            cameraId
                        );
                    }

                }, 1500);
            }
        };


    /* =====================================================
       ICE STATE
    ===================================================== */

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE STATE:",
                cameraId,
                pc.iceConnectionState
            );


            if (
                pc.iceConnectionState ===
                    "failed"
            ) {

                recoverCamera(
                    cameraId
                );
            }
        };


    return pc;
}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(message) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    const offer =
        message.offer ||
        message.sdp;


    if (
        !cameraId ||
        !offer
    ) {

        console.warn(
            "Invalid offer:",
            message
        );

        return;
    }


    const id =
        String(cameraId);


    console.log(
        "OFFER FROM CAMERA:",
        id
    );


    let pc =
        peers.get(id);


    if (!pc) {

        pc =
            createPeer(id);
    }


    try {

        const description =
            typeof offer === "string"

                ? {
                    type: "offer",
                    sdp: offer
                }

                : offer;


        await pc.setRemoteDescription(
            new RTCSessionDescription(
                description
            )
        );


        /*
         * Add ICE candidates that
         * arrived early.
         */
        const queued =
            pendingCandidates.get(
                id
            ) || [];


        for (
            const candidate
            of queued
        ) {

            try {

                await pc.addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            } catch (error) {

                console.warn(
                    "Queued ICE error:",
                    error
                );
            }
        }


        pendingCandidates.delete(
            id
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        /*
         * Send answer.
         */
        send({
            type: "answer",
            cameraId: id,
            answer:
                pc.localDescription
        });


    } catch (error) {

        console.error(
            "OFFER ERROR:",
            error
        );


        destroyPeer(
            id
        );


        setTimeout(() => {

            requestCamera(id);

        }, 1000);
    }
}


/* =========================================================
   HANDLE ANSWER
========================================================= */

async function handleAnswer(message) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    if (!cameraId) {
        return;
    }


    const answer =
        message.answer ||
        message.sdp;


    if (!answer) {
        return;
    }


    const id =
        String(cameraId);


    const pc =
        peers.get(id);


    if (!pc) {

        console.warn(
            "No peer for answer:",
            id
        );

        return;
    }


    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                typeof answer === "string"

                    ? {
                        type: "answer",
                        sdp: answer
                    }

                    : answer
            )
        );

    } catch (error) {

        console.error(
            "ANSWER ERROR:",
            error
        );
    }
}


/* =========================================================
   HANDLE ICE CANDIDATE
========================================================= */

async function handleCandidate(message) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    const candidate =
        message.candidate;


    if (
        !cameraId ||
        !candidate
    ) {
        return;
    }


    const id =
        String(cameraId);


    const pc =
        peers.get(id);


    /*
     * Remote description isn't ready yet.
     * Queue the candidate.
     */
    if (
        !pc ||
        !pc.remoteDescription
    ) {

        if (
            !pendingCandidates.has(id)
        ) {

            pendingCandidates.set(
                id,
                []
            );
        }


        pendingCandidates
            .get(id)
            .push(candidate);


        return;
    }


    try {

        await pc.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );

    } catch (error) {

        console.warn(
            "ICE ERROR:",
            error
        );
    }
}


/* =========================================================
   RECOVER CAMERA
========================================================= */

function recoverCamera(cameraId) {

    const id =
        String(cameraId);


    console.log(
        "Recovering camera:",
        id
    );


    destroyPeer(id);


    setStatus(
        "🟡 Reconnecting camera..."
    );


    setTimeout(() => {

        if (
            document.visibilityState !==
                "visible"
        ) {
            return;
        }


        if (
            socket &&
            socket.readyState ===
                WebSocket.OPEN
        ) {

            requestCamera(id);
        }

    }, 800);
}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer(cameraId) {

    const id =
        String(cameraId);


    const pc =
        peers.get(id);


    if (pc) {

        try {

            pc.ontrack = null;
            pc.onicecandidate = null;
            pc.onconnectionstatechange = null;
            pc.oniceconnectionstatechange = null;

            pc.close();

        } catch (error) {

            console.warn(
                "Peer close error:",
                error
            );
        }


        peers.delete(id);
    }


    pendingCandidates.delete(
        id
    );


    /*
     * Remove old video stream.
     */
    const card =
        cards.get(id);


    if (card) {

        const video =
            card.querySelector(
                "video"
            );


        if (video) {

            try {

                const oldStream =
                    video.srcObject;


                if (oldStream) {

                    oldStream
                        .getTracks()
                        .forEach(track => {

                            try {
                                track.stop();
                            } catch (e) {}

                        });
                }

            } catch (error) {}


            video.srcObject =
                null;
        }
    }
}


/* =========================================================
   DESTROY ALL PEERS
========================================================= */

function destroyAllPeers() {

    for (
        const cameraId
        of Array.from(peers.keys())
    ) {

        destroyPeer(
            cameraId
        );
    }
}


/* =========================================================
   RECONNECT WEBSOCKET
========================================================= */

function scheduleReconnect() {

    if (
        reconnectTimer
    ) {
        return;
    }


    reconnectAttempts++;


    const delay =
        Math.min(
            1000 *
                Math.pow(
                    1.5,
                    reconnectAttempts - 1
                ),
            10000
        );


    console.log(
        "Reconnect in:",
        delay,
        "ms"
    );


    reconnectTimer =
        setTimeout(() => {

            reconnectTimer =
                null;


            if (
                document.visibilityState ===
                    "visible"
            ) {

                connectWebSocket();
            }

        }, delay);
}


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        console.log(
            "Visibility:",
            document.visibilityState
        );


        if (
            document.visibilityState ===
                "hidden"
        ) {

            pageWasHidden = true;

            return;
        }


        if (
            document.visibilityState !==
                "visible"
        ) {
            return;
        }


        console.log(
            "Page visible - restoring video"
        );


        /*
         * If the WebSocket died while
         * the page was hidden.
         */
        if (
            !socket ||
            socket.readyState !==
                WebSocket.OPEN
        ) {

            connectWebSocket();

            return;
        }


        /*
         * Recreate every WebRTC peer.
         */
        for (
            const cameraId
            of Array.from(cameras)
        ) {

            destroyPeer(
                cameraId
            );


            requestCamera(
                cameraId
            );
        }


        pageWasHidden = false;
    }
);


/* =========================================================
   PAGE FOCUS
========================================================= */

window.addEventListener(
    "focus",
    () => {

        if (
            document.visibilityState !==
                "visible"
        ) {
            return;
        }


        console.log(
            "Window focused"
        );


        if (
            !socket ||
            socket.readyState !==
                WebSocket.OPEN
        ) {

            connectWebSocket();

            return;
        }


        for (
            const cameraId
            of cameras
        ) {

            requestCamera(
                cameraId
            );
        }
    }
);


/* =========================================================
   NETWORK ONLINE
========================================================= */

window.addEventListener(
    "online",
    () => {

        console.log(
            "Network online"
        );


        destroyAllPeers();


        if (
            socket
        ) {

            try {
                socket.close();
            } catch (error) {}
        }


        connectWebSocket();
    }
);


/* =========================================================
   NETWORK OFFLINE
========================================================= */

window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );
    }
);


/* =========================================================
   MANUAL RECONNECT
========================================================= */

reconnectBtn.addEventListener(
    "click",
    () => {

        reconnectBtn.style.display =
            "none";


        manuallyClosed =
            false;


        destroyAllPeers();


        if (socket) {

            try {
                socket.close();
            } catch (error) {}
        }


        socket =
            null;


        connectWebSocket();
    }
);


/* =========================================================
   PAGE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        manuallyClosed =
            true;


        destroyAllPeers();


        if (socket) {

            try {
                socket.close();
            } catch (error) {}
        }
    }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
</html>
