<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  font-size:28px;
  margin:20px 10px;
}

#status{
  font-size:18px;
  margin:15px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:14px;
  padding:14px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:#222;
  border-radius:14px;
  padding:10px;
}

.label{
  color:#ddd;
  margin-bottom:9px;
  font-size:17px;
}

.video-wrap{
  position:relative;
  background:#000;
  border-radius:11px;
  overflow:hidden;
  width:100%;
}

.video-wrap video{
  width:100%;
  height:220px;
  display:block;
  background:#000;
  object-fit:contain;
}

.fullscreen-btn{
  position:absolute;
  right:10px;
  bottom:10px;
  width:46px;
  height:46px;
  border:0;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:25px;
  cursor:pointer;
}

.video-wrap:fullscreen{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

.video-wrap:fullscreen video{
  width:100%;
  height:100%;
  object-fit:contain;
}

.no-camera{
  padding:40px 10px;
  color:#aaa;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">🟡 Connecting...</div>

<div id="grid">
  <div class="no-camera">
    Waiting for cameras...
  </div>
</div>

<script>

const status = document.getElementById("status");
const grid = document.getElementById("grid");

let ws = null;
let reconnectTimer = null;
let reconnectDelay = 1000;

const cameras = new Set();
const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function setStatus(text){
  status.textContent = text;
}


// --------------------------------------------------
// WEBSOCKET SEND
// --------------------------------------------------

function send(data){

  if(!ws){
    console.log("WebSocket not available:", data);
    return false;
  }

  if(ws.readyState !== WebSocket.OPEN){
    console.log("WebSocket not open:", data);
    return false;
  }

  console.log("SEND:", data);

  ws.send(JSON.stringify(data));

  return true;
}


// --------------------------------------------------
// CAMERA CARD
// --------------------------------------------------

function addCamera(id){

  if(cards.has(id)){
    return cards.get(id);
  }

  const empty = grid.querySelector(".no-camera");

  if(empty){
    empty.remove();
  }

  const card = document.createElement("div");
  card.className = "card";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Camera " + id;

  const wrap = document.createElement("div");
  wrap.className = "video-wrap";

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;

  const button = document.createElement("button");

  button.className = "fullscreen-btn";
  button.textContent = "⛶";

  button.onclick = () => {

    if(wrap.requestFullscreen){
      wrap.requestFullscreen();
    }
    else if(wrap.webkitRequestFullscreen){
      wrap.webkitRequestFullscreen();
    }

  };

  wrap.appendChild(video);
  wrap.appendChild(button);

  card.appendChild(label);
  card.appendChild(wrap);

  grid.appendChild(card);

  const item = {
    card: card,
    video: video,
    wrap: wrap
  };

  cards.set(id,item);

  return item;
}


// --------------------------------------------------
// REMOVE CAMERA
// --------------------------------------------------

function removeCamera(id){

  const item = cards.get(id);

  if(item){
    item.card.remove();
    cards.delete(id);
  }

  if(cards.size === 0){

    const empty = document.createElement("div");

    empty.className = "no-camera";
    empty.textContent = "Waiting for cameras...";

    grid.appendChild(empty);
  }
}


// --------------------------------------------------
// DESTROY WEBRTC
// --------------------------------------------------

function destroyPeer(id){

  const pc = peers.get(id);

  if(pc){

    try{
      pc.ontrack = null;
      pc.onicecandidate = null;
      pc.onconnectionstatechange = null;
      pc.oniceconnectionstatechange = null;
      pc.close();
    }
    catch(e){
      console.log(e);
    }

  }

  peers.delete(id);
  pendingCandidates.delete(id);
}


// --------------------------------------------------
// CREATE WEBRTC PEER
// --------------------------------------------------

function createPeer(id){

  if(peers.has(id)){
    return peers.get(id);
  }

  console.log("Creating peer for camera:",id);

  const item = addCamera(id);

  const pc = new RTCPeerConnection({

    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]

  });

  peers.set(id,pc);
  pendingCandidates.set(id,[]);


  // ------------------------------------------------
  // ICE CANDIDATE
  // ------------------------------------------------

  pc.onicecandidate = event => {

    if(event.candidate){

      send({
        type:"candidate",
        cameraId:id,
        candidate:event.candidate
      });

    }

  };


  // ------------------------------------------------
  // REMOTE VIDEO
  // ------------------------------------------------

  pc.ontrack = event => {

    console.log(
      "REMOTE TRACK:",
      id,
      event.track.kind,
      event.track.readyState
    );

    if(event.track.kind !== "video"){
      return;
    }

    let stream = item.video.srcObject;

    if(!(stream instanceof MediaStream)){

      stream = new MediaStream();

      item.video.srcObject = stream;

    }

    if(!stream.getTracks().includes(event.track)){

      stream.addTrack(event.track);

    }

    event.track.onunmute = () => {

      console.log("Video track unmuted:",id);

      item.video.play()
        .then(() => {
          setStatus("🟢 Camera is LIVE");
        })
        .catch(err => {
          console.log("Play error:",err);
        });

    };

    item.video.play()
      .then(() => {
        setStatus("🟢 Camera is LIVE");
      })
      .catch(err => {
        console.log("Play error:",err);
      });

  };


  // ------------------------------------------------
  // CONNECTION STATE
  // ------------------------------------------------

  pc.onconnectionstatechange = () => {

    console.log(
      "CONNECTION:",
      id,
      pc.connectionState
    );

    if(pc.connectionState === "connected"){

      setStatus("🟢 Camera is LIVE");

    }

    if(pc.connectionState === "failed"){

      console.log("Connection failed:",id);

      schedulePeerReconnect(id);

    }

    if(pc.connectionState === "disconnected"){

      console.log("Connection disconnected:",id);

      setTimeout(() => {

        if(
          peers.has(id) &&
          pc.connectionState === "disconnected"
        ){

          schedulePeerReconnect(id);

        }

      },3000);

    }

  };


  // ------------------------------------------------
  // ICE STATE
  // ------------------------------------------------

  pc.oniceconnectionstatechange = () => {

    console.log(
      "ICE:",
      id,
      pc.iceConnectionState
    );

  };


  return pc;
}


// --------------------------------------------------
// RECONNECT WEBRTC
// --------------------------------------------------

const reconnectingPeers = new Set();

function schedulePeerReconnect(id){

  if(reconnectingPeers.has(id)){
    return;
  }

  reconnectingPeers.add(id);

  destroyPeer(id);

  setTimeout(() => {

    reconnectingPeers.delete(id);

    if(!cameras.has(id)){
      return;
    }

    console.log(
      "Reconnecting camera:",
      id
    );

    createPeer(id);

    send({
      type:"viewer-ready",
      cameraId:id
    });

  },1500);
}


// --------------------------------------------------
// HANDLE OFFER
// --------------------------------------------------

async function handleOffer(msg){

  const id = msg.cameraId;

  console.log("OFFER received:",id);

  try{

    const pc = createPeer(id);

    await pc.setRemoteDescription(
      new RTCSessionDescription(msg.offer)
    );


    // Add candidates received before offer
    const list =
      pendingCandidates.get(id) || [];

    for(const candidate of list){

      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }
      catch(error){

        console.log(
          "Pending ICE error:",
          error
        );

      }

    }

    pendingCandidates.set(id,[]);


    // Create answer
    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(answer);


    send({

      type:"answer",

      cameraId:id,

      answer:pc.localDescription

    });

    console.log(
      "ANSWER sent:",
      id
    );

  }
  catch(error){

    console.error(
      "Offer error:",
      error
    );

    schedulePeerReconnect(id);

  }

}


// --------------------------------------------------
// HANDLE ICE CANDIDATE
// --------------------------------------------------

async function handleCandidate(msg){

  const id = msg.cameraId;

  console.log(
    "ICE candidate received:",
    id
  );

  const pc = createPeer(id);

  if(
    !pc.remoteDescription ||
    !pc.remoteDescription.type
  ){

    const list =
      pendingCandidates.get(id) || [];

    list.push(msg.candidate);

    pendingCandidates.set(
      id,
      list
    );

    return;
  }

  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(msg.candidate)
    );

  }
  catch(error){

    console.log(
      "ICE candidate error:",
      error
    );

  }

}


// --------------------------------------------------
// REQUEST CAMERA
// --------------------------------------------------

function requestCamera(id){

  if(!id){
    return;
  }

  cameras.add(id);

  createPeer(id);

  send({
    type:"viewer-ready",
    cameraId:id
  });

}


// --------------------------------------------------
// REQUEST ALL CAMERAS
// --------------------------------------------------

function requestAll(){

  console.log(
    "Requesting cameras:",
    [...cameras]
  );

  cameras.forEach(id => {

    createPeer(id);

    send({
      type:"viewer-ready",
      cameraId:id
    });

  });

}


// --------------------------------------------------
// WEBSOCKET MESSAGE
// --------------------------------------------------

async function handleMessage(event){

  let msg;

  try{

    msg = JSON.parse(event.data);

  }
  catch(error){

    console.log(
      "Invalid message:",
      event.data
    );

    return;
  }

  console.log(
    "RECEIVED:",
    msg
  );


  // Server tells us existing cameras
  if(msg.type === "role"){

    const list =
      Array.isArray(msg.cameras)
      ? msg.cameras
      : [];

    cameras.clear();

    list.forEach(id => {
      cameras.add(id);
      addCamera(id);
    });

    if(cameras.size > 0){

      setStatus(
        "🟡 Connecting to cameras..."
      );

      requestAll();

    }
    else{

      setStatus(
        "🟡 Waiting for cameras..."
      );

    }

    return;
  }


  // New camera
  if(
    msg.type === "camera-online" ||
    msg.type === "camera-live"
  ){

    console.log(
      "CAMERA ONLINE:",
      msg.cameraId
    );

    requestCamera(
      msg.cameraId
    );

    setStatus(
      "🟡 Connecting to camera..."
    );

    return;
  }


  // Camera offline
  if(msg.type === "camera-offline"){

    console.log(
      "CAMERA OFFLINE:",
      msg.cameraId
    );

    cameras.delete(
      msg.cameraId
    );

    destroyPeer(
      msg.cameraId
    );

    removeCamera(
      msg.cameraId
    );

    if(cameras.size === 0){

      setStatus(
        "🟡 Waiting for cameras..."
      );

    }

    return;
  }


  // WebRTC offer
  if(msg.type === "offer"){

    await handleOffer(msg);

    return;
  }


  // WebRTC ICE
  if(msg.type === "candidate"){

    await handleCandidate(msg);

    return;
  }

}


// --------------------------------------------------
// CONNECT WEBSOCKET
// --------------------------------------------------

function connectWS(){

  if(
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ){

    return;
  }

  const protocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

  const url =
    protocol +
    "//" +
    location.host +
    "/viewer";

  console.log(
    "Connecting WebSocket:",
    url
  );

  setStatus(
    "🟡 Connecting..."
  );

  ws = new WebSocket(url);


  // ------------------------------------------------
  // OPEN
  // ------------------------------------------------

  ws.onopen = () => {

    console.log(
      "WebSocket CONNECTED"
    );

    reconnectDelay = 1000;

    setStatus(
      "🟡 Waiting for cameras..."
    );

    /*
       Important:
       Ask server for the viewer role again
       after every page refresh/reconnect.
    */

    send({
      type:"viewer"
    });

    /*
       Also request any cameras we already knew about.
    */

    setTimeout(() => {

      requestAll();

    },300);

  };


  // ------------------------------------------------
  // MESSAGE
  // ------------------------------------------------

  ws.onmessage = handleMessage;


  // ------------------------------------------------
  // ERROR
  // ------------------------------------------------

  ws.onerror = error => {

    console.log(
      "WebSocket ERROR:",
      error
    );

    setStatus(
      "🔴 Server connection error"
    );

  };


  // ------------------------------------------------
  // CLOSE
  // ------------------------------------------------

  ws.onclose = () => {

    console.log(
      "WebSocket CLOSED"
    );

    setStatus(
      "🟡 Reconnecting..."
    );

    ws = null;

    if(reconnectTimer){
      return;
    }

    reconnectTimer =
      setTimeout(() => {

        reconnectTimer = null;

        connectWS();

      },reconnectDelay);

    reconnectDelay =
      Math.min(
        reconnectDelay * 1.5,
        10000
      );

  };

}


// --------------------------------------------------
// PERIODIC RECOVERY
// --------------------------------------------------

setInterval(() => {

  peers.forEach((pc,id) => {

    if(
      pc.connectionState === "failed" ||
      pc.connectionState === "closed"
    ){

      schedulePeerReconnect(id);

    }

  });

},5000);


// --------------------------------------------------
// PAGE VISIBILITY
// --------------------------------------------------

document.addEventListener(
  "visibilitychange",
  () => {

    if(!document.hidden){

      console.log(
        "Page visible - recovering"
      );

      if(
        !ws ||
        ws.readyState !== WebSocket.OPEN
      ){

        connectWS();

      }
      else{

        requestAll();

      }

    }

  }
);


// --------------------------------------------------
// START
// --------------------------------------------------

connectWS();

</script>

</body>
</html>
