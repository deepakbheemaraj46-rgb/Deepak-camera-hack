<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Cameras</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

/* FULL SCREEN CAMERA GRID */
#grid {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(300px, 1fr));

    grid-template-rows:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 2px;

    background: #000;

    overflow: hidden;
}

/* EACH CAMERA */
.camera-card {
    position: relative;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    background: #000;

    overflow: hidden;
}

/* VIDEO FILLS CAMERA AREA */
.camera-card video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;
}

/* CAMERA NAME */
.camera-name {
    position: absolute;

    left: 10px;
    bottom: 10px;

    z-index: 10;

    padding: 6px 10px;

    background: rgba(0,0,0,.55);

    color: white;

    border-radius: 6px;

    font-size: 12px;
}

/* LIVE LABEL */
.live {
    position: absolute;

    right: 10px;
    top: 10px;

    z-index: 10;

    padding: 5px 8px;

    background: rgba(180,0,0,.85);

    color: white;

    border-radius: 5px;

    font-size: 11px;

    font-weight: bold;
}

/* STATUS */
#status {
    position: fixed;

    top: 10px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 100;

    padding: 7px 12px;

    background: rgba(0,0,0,.65);

    color: white;

    border-radius: 20px;

    font-size: 12px;
}

/* FULLSCREEN BUTTON */
#fullscreen {
    position: fixed;

    right: 12px;
    bottom: 12px;

    z-index: 200;

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,.85);

    color: #000;

    font-size: 20px;
}
</style>
</head>

<body>

<div id="status">
    Connecting...
</div>

<div id="grid"></div>

<button id="fullscreen">⛶</button>

<script>

"use strict";


/* =====================================================
   WEBSOCKET
===================================================== */

const protocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const WS_URL =
    protocol +
    "//" +
    location.host +
    "/viewer";


/* =====================================================
   STATE
===================================================== */

let socket = null;

let viewerId = null;

const cameras = new Set();

const peers = new Map();

const pendingCandidates = new Map();

const cards = new Map();

let reconnectTimer = null;


/* =====================================================
   DOM
===================================================== */

const grid =
    document.getElementById("grid");

const status =
    document.getElementById("status");

const fullscreenButton =
    document.getElementById("fullscreen");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

    status.textContent = text;

}


/* =====================================================
   WEBSOCKET CONNECT
===================================================== */

function connect() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }


    setStatus("Connecting...");


    socket =
        new WebSocket(WS_URL);


    socket.onopen = () => {

        console.log("Viewer connected");

        setStatus("Waiting for cameras...");


        for (
            const cameraId
            of cameras
        ) {

            requestCamera(cameraId);

        }

    };


    socket.onmessage = async event => {

        let message;

        try {

            message =
                JSON.parse(event.data);

        } catch {

            return;

        }


        await handleMessage(message);

    };


    socket.onclose = () => {

        console.log("Viewer disconnected");

        destroyAllPeers();

        setStatus("Reconnecting...");

        reconnect();

    };


    socket.onerror = error => {

        console.log("WebSocket error", error);

    };

}


/* =====================================================
   SEND
===================================================== */

function send(message) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        return false;

    }


    socket.send(
        JSON.stringify(message)
    );

    return true;

}


/* =====================================================
   SERVER MESSAGE
===================================================== */

async function handleMessage(message) {

    switch (message.type) {


        case "role":

            if (
                message.role === "viewer"
            ) {

                viewerId =
                    message.viewerId;


                if (
                    Array.isArray(message.cameras)
                ) {

                    for (
                        const cameraId
                        of message.cameras
                    ) {

                        addCamera(cameraId);

                    }

                }

            }

            break;


        case "camera-online":

            addCamera(
                message.cameraId
            );

            break;


        case "camera-live":

            addCamera(
                message.cameraId
            );

            requestCamera(
                message.cameraId
            );

            break;


        case "camera-offline":

            removeCamera(
                message.cameraId
            );

            break;


        case "offer":

            await handleOffer(message);

            break;


        case "candidate":

            await handleCandidate(message);

            break;

    }

}


/* =====================================================
   ADD CAMERA
===================================================== */

function addCamera(cameraId) {

    if (!cameraId) {
        return;
    }


    cameraId =
        String(cameraId);


    cameras.add(cameraId);


    createCameraCard(cameraId);


    setStatus(
        cameras.size +
        " camera(s) connected"
    );


    requestCamera(cameraId);

}


/* =====================================================
   REQUEST CAMERA
===================================================== */

function requestCamera(cameraId) {

    send({

        type: "viewer-ready",

        cameraId: String(cameraId)

    });

}


/* =====================================================
   CREATE CAMERA CARD
===================================================== */

function createCameraCard(cameraId) {

    if (
        cards.has(cameraId)
    ) {

        return cards.get(cameraId);

    }


    const card =
        document.createElement("div");

    card.className =
        "camera-card";


    const video =
        document.createElement("video");

    video.autoplay = true;

    video.playsInline = true;

    video.muted = true;


    const name =
        document.createElement("div");

    name.className =
        "camera-name";

    name.textContent =
        "Camera " + cameraId;


    const live =
        document.createElement("div");

    live.className =
        "live";

    live.textContent =
        "● LIVE";


    card.appendChild(video);

    card.appendChild(name);

    card.appendChild(live);


    grid.appendChild(card);


    cards.set(
        cameraId,
        card
    );


    return card;

}


/* =====================================================
   REMOVE CAMERA
===================================================== */

function removeCamera(cameraId) {

    cameraId =
        String(cameraId);


    cameras.delete(cameraId);


    destroyPeer(cameraId);


    pendingCandidates.delete(
        cameraId
    );


    const card =
        cards.get(cameraId);


    if (card) {

        const video =
            card.querySelector("video");


        if (video) {

            video.srcObject = null;

        }


        card.remove();


        cards.delete(cameraId);

    }


    if (cameras.size === 0) {

        setStatus(
            "Waiting for cameras..."
        );

    }

}


/* =====================================================
   HANDLE OFFER
===================================================== */

async function handleOffer(message) {

    const cameraId =
        String(message.cameraId);


    if (!message.offer) {
        return;
    }


    destroyPeer(cameraId);


    const pc =
        createPeer(cameraId);


    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );


        const queued =
            pendingCandidates.get(
                cameraId
            ) || [];


        for (
            const candidate
            of queued
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            } catch {}

        }


        pendingCandidates.delete(
            cameraId
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        send({

            type: "answer",

            cameraId: cameraId,

            answer: pc.localDescription

        });


    } catch (error) {

        console.error(
            "Offer error:",
            error
        );

        destroyPeer(cameraId);

    }

}


/* =====================================================
   CREATE PEER
===================================================== */

function createPeer(cameraId) {

    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    peers.set(
        cameraId,
        pc
    );


    pc.addTransceiver(
        "video",
        {
            direction: "recvonly"
        }
    );


    pc.ontrack = event => {

        const card =
            createCameraCard(
                cameraId
            );


        const video =
            card.querySelector(
                "video"
            );


        if (
            event.streams &&
            event.streams[0]
        ) {

            video.srcObject =
                event.streams[0];

        }


        video.play()
            .catch(() => {});


        setStatus(
            cameras.size +
            " camera(s) LIVE"
        );

    };


    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;

            }


            send({

                type: "candidate",

                cameraId: cameraId,

                candidate:
                    event.candidate

            });

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                cameraId,
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "failed"
            ) {

                destroyPeer(cameraId);


                setTimeout(
                    () => {

                        if (
                            cameras.has(cameraId)
                        ) {

                            requestCamera(
                                cameraId
                            );

                        }

                    },
                    1000
                );

            }

        };


    return pc;

}


/* =====================================================
   ICE
===================================================== */

async function handleCandidate(message) {

    const cameraId =
        String(message.cameraId);


    if (
        !message.candidate
    ) {

        return;

    }


    const candidate =
        new RTCIceCandidate(
            message.candidate
        );


    const pc =
        peers.get(cameraId);


    if (
        !pc ||
        !pc.remoteDescription
    ) {

        if (
            !pendingCandidates.has(
                cameraId
            )
        ) {

            pendingCandidates.set(
                cameraId,
                []
            );

        }


        pendingCandidates
            .get(cameraId)
            .push(candidate);


        return;

    }


    try {

        await pc.addIceCandidate(
            candidate
        );

    } catch (error) {

        console.warn(
            "ICE error:",
            error
        );

    }

}


/* =====================================================
   DESTROY PEER
===================================================== */

function destroyPeer(cameraId) {

    const pc =
        peers.get(cameraId);


    if (!pc) {
        return;
    }


    try {

        pc.close();

    } catch {}


    peers.delete(cameraId);

}


/* =====================================================
   DESTROY ALL
===================================================== */

function destroyAllPeers() {

    for (
        const cameraId
        of peers.keys()
    ) {

        destroyPeer(cameraId);

    }

}


/* =====================================================
   RECONNECT
===================================================== */

function reconnect() {

    if (reconnectTimer) {
        return;
    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connect();

            },
            1500
        );

}


/* =====================================================
   NETWORK RECONNECT
===================================================== */

window.addEventListener(
    "online",
    () => {

        connect();

    }
);


/* =====================================================
   FULL SCREEN
===================================================== */

fullscreenButton.addEventListener(
    "click",
    async () => {

        try {

            if (
                !document.fullscreenElement
            ) {

                await document.documentElement
                    .requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =====================================================
   HIDE UI AFTER 3 SECONDS
===================================================== */

let hideTimer;


function hideStatus() {

    clearTimeout(hideTimer);


    hideTimer =
        setTimeout(
            () => {

                status.style.display =
                    "none";

                fullscreenButton.style.display =
                    "none";

            },
            3000
        );

}


document.addEventListener(
    "click",
    () => {

        status.style.display =
            "block";

        fullscreenButton.style.display =
            "block";

        hideStatus();

    }
);


hideStatus();


/* =====================================================
   START
===================================================== */

connect();

</script>

</body>
</html>
