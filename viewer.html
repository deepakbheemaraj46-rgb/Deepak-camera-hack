<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Camera Viewer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* =========================================================
   MAIN APPLICATION
========================================================= */

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

/* =========================================================
   STATUS
========================================================= */

#status {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 100;

    padding: 8px 14px;
    border-radius: 20px;

    color: white;
    background: rgba(0,0,0,.65);

    font-size: 14px;
    white-space: nowrap;
}

/* =========================================================
   CAMERA GRID
   Only ONE camera is displayed at a time.
========================================================= */

#grid {
    width: 100%;
    height: 100%;

    position: relative;

    overflow: hidden;

    background: #000;
}

/* =========================================================
   CAMERA CARD
========================================================= */

.camera-card {
    width: 100%;
    height: 100%;

    position: absolute;
    top: 0;
    left: 0;

    display: none;

    background: #000;

    overflow: hidden;
}

/* Currently selected camera */
.camera-card.active {
    display: block;
}

/* =========================================================
   VIDEO
========================================================= */

.camera-card video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center center;

    background: #000;
}

/* =========================================================
   CAMERA NAME
========================================================= */

.camera-name {
    position: absolute;

    left: 12px;
    bottom: 12px;

    padding: 6px 10px;

    color: white;
    background: rgba(0,0,0,.55);

    border-radius: 8px;

    font-size: 13px;

    z-index: 10;
}

/* =========================================================
   LIVE INDICATOR
========================================================= */

.live {
    position: absolute;

    top: 15px;
    right: 15px;

    padding: 6px 10px;

    background: rgba(180,0,0,.85);

    color: white;

    border-radius: 8px;

    font-size: 12px;
    font-weight: bold;

    z-index: 10;
}

/* =========================================================
   RECONNECT BUTTON
========================================================= */

#reconnect {
    position: absolute;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 200;

    border: none;

    border-radius: 25px;

    padding: 11px 20px;

    background: rgba(255,255,255,.9);

    color: #111;

    font-size: 14px;
    font-weight: bold;

    display: none;
}

#reconnect:active {
    transform: translateX(-50%) scale(.96);
}

/* =========================================================
   NEXT CAMERA BUTTON
========================================================= */

#nextCamera {
    position: absolute;

    right: 15px;
    bottom: 20px;

    z-index: 200;

    border: none;

    border-radius: 25px;

    padding: 11px 18px;

    background: rgba(255,255,255,.9);

    color: #111;

    font-size: 14px;
    font-weight: bold;

    display: none;
}

#nextCamera:active {
    transform: scale(.96);
}

/* =========================================================
   CAMERA COUNTER
========================================================= */

#cameraCounter {
    position: absolute;

    left: 50%;
    bottom: 22px;

    transform: translateX(-50%);

    z-index: 150;

    padding: 7px 12px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);

    color: white;

    font-size: 13px;

    display: none;
}
</style>
</head>

<body>

<div id="app">

    <!-- STATUS -->

    <div id="status">
        🟡 Waiting for cameras...
    </div>


    <!-- CAMERAS -->

    <div id="grid"></div>


    <!-- RECONNECT -->

    <button id="reconnect">
        🔄 Reconnect
    </button>


    <!-- NEXT CAMERA -->

    <button id="nextCamera">
        ▶ Next
    </button>


    <!-- CAMERA NUMBER -->

    <div id="cameraCounter">
        Camera 1 / 1
    </div>

</div>


<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:" ? "wss:" : "ws:";

const WS_URL =
    WS_PROTOCOL + "//" + location.host + "/viewer";


/* =========================================================
   STATE
========================================================= */

let socket = null;

const cameras = new Set();

const peers = new Map();

const pendingCandidates = new Map();

const cards = new Map();


/*
 * List of cameras in the order they were received.
 */
const cameraList = [];


/*
 * Currently displayed camera.
 */
let activeIndex = 0;


let reconnectTimer = null;

let manuallyClosed = false;


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById("status");

const gridEl =
    document.getElementById("grid");

const reconnectBtn =
    document.getElementById("reconnect");

const nextCameraBtn =
    document.getElementById("nextCamera");

const cameraCounter =
    document.getElementById("cameraCounter");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusEl.textContent = text;
}


/* =========================================================
   UPDATE CAMERA UI
========================================================= */

function updateCameraUI() {

    /*
     * Hide every camera.
     */

    cards.forEach(card => {

        card.classList.remove("active");

    });


    /*
     * No cameras.
     */

    if (cameraList.length === 0) {

        nextCameraBtn.style.display = "none";

        cameraCounter.style.display = "none";

        return;
    }


    /*
     * Make sure index is valid.
     */

    if (activeIndex >= cameraList.length) {

        activeIndex = 0;

    }


    /*
     * Get active camera.
     */

    const activeCameraId =
        cameraList[activeIndex];


    const activeCard =
        cards.get(activeCameraId);


    /*
     * Show only active camera.
     */

    if (activeCard) {

        activeCard.classList.add("active");

    }


    /*
     * Next button.
     */

    if (cameraList.length > 1) {

        nextCameraBtn.style.display = "block";

    } else {

        nextCameraBtn.style.display = "none";

    }


    /*
     * Camera counter.
     */

    cameraCounter.textContent =
        "Camera " +
        (activeIndex + 1) +
        " / " +
        cameraList.length;

    cameraCounter.style.display = "block";
}


/* =========================================================
   NEXT CAMERA
========================================================= */

function showNextCamera() {

    if (cameraList.length <= 1) {

        return;
    }


    /*
     * Move to next camera.
     */

    activeIndex =
        (activeIndex + 1) %
        cameraList.length;


    console.log(
        "Showing camera:",
        cameraList[activeIndex]
    );


    updateCameraUI();


    /*
     * Make sure the selected camera
     * has a WebRTC connection.
     */

    sendViewerReady(
        cameraList[activeIndex]
    );
}


/* =========================================================
   NEXT BUTTON
========================================================= */

nextCameraBtn.addEventListener(
    "click",
    showNextCamera
);


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {

        return;
    }


    manuallyClosed = false;


    setStatus("🟡 Connecting...");


    console.log(
        "Connecting:",
        WS_URL
    );


    try {

        socket =
            new WebSocket(WS_URL);

    } catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );

        scheduleReconnect();

        return;
    }


    /* =====================================================
       WEBSOCKET OPEN
    ===================================================== */

    socket.onopen = () => {

        console.log(
            "WEBSOCKET CONNECTED"
        );


        setStatus(
            "🟡 Waiting for cameras..."
        );


        reconnectBtn.style.display =
            "none";


        /*
         * Ask server for cameras.
         */

        requestAll();


        /*
         * Re-request known cameras.
         */

        for (const cameraId of cameras) {

            sendViewerReady(
                cameraId
            );

        }

    };


    /* =====================================================
       WEBSOCKET MESSAGE
    ===================================================== */

    socket.onmessage = async event => {

        console.log(
            "RECEIVED:",
            event.data
        );


        let message;


        try {

            message =
                JSON.parse(event.data);

        } catch (error) {

            console.error(
                "Invalid WebSocket message:",
                event.data
            );

            return;
        }


        await handleMessage(message);

    };


    /* =====================================================
       WEBSOCKET ERROR
    ===================================================== */

    socket.onerror = error => {

        console.error(
            "WEBSOCKET ERROR:",
            error
        );

    };


    /* =====================================================
       WEBSOCKET CLOSE
    ===================================================== */

    socket.onclose = () => {

        console.log(
            "WEBSOCKET CLOSED"
        );


        if (!manuallyClosed) {

            setStatus(
                "🔴 Connection lost — reconnecting..."
            );


            scheduleReconnect();

        }

    };
}


/* =========================================================
   SEND
========================================================= */

function send(data) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        console.warn(
            "WebSocket not ready:",
            data
        );

        return false;
    }


    console.log(
        "SEND:",
        data
    );


    socket.send(
        JSON.stringify(data)
    );


    return true;
}


/* =========================================================
   REQUEST CAMERAS
========================================================= */

function requestAll() {

    /*
     * Keep your original protocol.
     */

    send({
        type: "viewer-ready"
    });
}


/* =========================================================
   VIEWER READY
========================================================= */

function sendViewerReady(cameraId) {

    if (!cameraId) {

        return;
    }


    send({

        type: "viewer-ready",

        cameraId: cameraId

    });
}


/* =========================================================
   MESSAGE HANDLER
========================================================= */

async function handleMessage(message) {

    const type =
        message.type;


    switch (type) {


        /* =================================================
           ROLE
        ================================================= */

        case "role":

            console.log(
                "ROLE:",
                message
            );


            if (message.cameraId) {

                addCamera(
                    message.cameraId
                );

            }

            break;


        /* =================================================
           CAMERA ONLINE
        ================================================= */

        case "camera-online":

        case "camera-live":

            if (message.cameraId) {

                addCamera(
                    message.cameraId
                );


                sendViewerReady(
                    message.cameraId
                );

            }

            break;


        /* =================================================
           CAMERA OFFLINE
        ================================================= */

        case "camera-offline":

            if (message.cameraId) {

                removeCamera(
                    message.cameraId
                );

            }

            break;


        /* =================================================
           OFFER
        ================================================= */

        case "offer":

            await handleOffer(
                message
            );

            break;


        /* =================================================
           ICE CANDIDATE
        ================================================= */

        case "candidate":

            await handleCandidate(
                message
            );

            break;


        default:

            console.log(
                "Unknown message type:",
                type
            );

    }
}


/* =========================================================
   ADD CAMERA
========================================================= */

function addCamera(cameraId) {

    if (!cameraId) {

        return;
    }


    cameraId =
        String(cameraId);


    /*
     * Already exists.
     */

    if (cameras.has(cameraId)) {

        /*
         * Make sure card exists.
         */

        createCameraCard(
            cameraId
        );

        return;
    }


    /*
     * Add camera.
     */

    cameras.add(cameraId);


    cameraList.push(
        cameraId
    );


    console.log(
        "Camera available:",
        cameraId
    );


    /*
     * Create camera card.
     */

    createCameraCard(
        cameraId
    );


    /*
     * First camera automatically
     * becomes active.
     */

    if (cameraList.length === 1) {

        activeIndex = 0;

    }


    updateCameraUI();


    setStatus(
        "🟢 Camera available"
    );


    /*
     * Tell camera viewer is ready.
     */

    sendViewerReady(
        cameraId
    );
}


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(cameraId) {

    cameraId =
        String(cameraId);


    cameras.delete(
        cameraId
    );


    destroyPeer(
        cameraId
    );


    /*
     * Remove camera from list.
     */

    const index =
        cameraList.indexOf(
            cameraId
        );


    if (index !== -1) {

        cameraList.splice(
            index,
            1
        );


        /*
         * Keep active index correct.
         */

        if (
            index < activeIndex &&
            activeIndex > 0
        ) {

            activeIndex--;

        }


        if (
            activeIndex >=
            cameraList.length
        ) {

            activeIndex = 0;

        }

    }


    /*
     * Remove card.
     */

    const card =
        cards.get(cameraId);


    if (card) {

        card.remove();

        cards.delete(
            cameraId
        );

    }


    updateCameraUI();


    if (cameras.size === 0) {

        setStatus(
            "🟡 Waiting for cameras..."
        );

    }
}


/* =========================================================
   CREATE CAMERA CARD
========================================================= */

function createCameraCard(cameraId) {

    if (
        cards.has(cameraId)
    ) {

        return cards.get(
            cameraId
        );
    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "camera-card";


    card.dataset.cameraId =
        cameraId;


    /* =====================================================
       VIDEO
    ===================================================== */

    const video =
        document.createElement(
            "video"
        );


    video.autoplay =
        true;


    video.playsInline =
        true;


    video.muted =
        true;


    video.setAttribute(
        "autoplay",
        ""
    );


    video.setAttribute(
        "playsinline",
        ""
    );


    video.setAttribute(
        "webkit-playsinline",
        ""
    );


    /* =====================================================
       CAMERA NAME
    ===================================================== */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "camera-name";


    name.textContent =
        "Camera " +
        (cameraList.indexOf(
            cameraId
        ) + 1);


    /* =====================================================
       LIVE
    ===================================================== */

    const live =
        document.createElement(
            "div"
        );


    live.className =
        "live";


    live.textContent =
        "● LIVE";


    /* =====================================================
       ADD ELEMENTS
    ===================================================== */

    card.appendChild(
        video
    );


    card.appendChild(
        name
    );


    card.appendChild(
        live
    );


    gridEl.appendChild(
        card
    );


    cards.set(
        cameraId,
        card
    );


    return card;
}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(message) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    const offer =
        message.offer ||
        message.sdp;


    if (
        !cameraId ||
        !offer
    ) {

        console.warn(
            "Offer missing cameraId or SDP:",
            message
        );

        return;
    }


    console.log(
        "Received offer from:",
        cameraId
    );


    let pc =
        peers.get(
            String(cameraId)
        );


    if (!pc) {

        pc =
            createPeer(
                String(cameraId)
            );

    }


    try {

        await pc.setRemoteDescription(

            new RTCSessionDescription(

                typeof offer === "string"

                    ? {
                        type: "offer",
                        sdp: offer
                    }

                    : offer

            )
        );


        /*
         * Add queued candidates.
         */

        const candidates =
            pendingCandidates.get(
                String(cameraId)
            ) || [];


        for (
            const candidate
            of candidates
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            } catch (error) {

                console.warn(
                    "Could not add queued candidate:",
                    error
                );

            }

        }


        pendingCandidates.delete(
            String(cameraId)
        );


        /*
         * Create answer.
         */

        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        /*
         * Send answer.
         */

        send({

            type: "answer",

            cameraId:
                String(cameraId),

            answer:
                answer

        });


    } catch (error) {

        console.error(
            "WebRTC offer error:",
            error
        );


        destroyPeer(
            String(cameraId)
        );

    }
}


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(cameraId) {

    destroyPeer(
        cameraId
    );


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls: [
                        "stun:stun.l.google.com:19302"
                    ]
                }

            ]

        });


    peers.set(
        cameraId,
        pc
    );


    /* =====================================================
       TRACK
    ===================================================== */

    pc.ontrack = event => {

        console.log(
            "VIDEO TRACK RECEIVED:",
            cameraId
        );


        const card =
            createCameraCard(
                cameraId
            );


        const video =
            card.querySelector(
                "video"
            );


        if (
            event.streams &&
            event.streams[0]
        ) {

            video.srcObject =
                event.streams[0];

        } else {

            let stream =
                video.srcObject;


            if (!stream) {

                stream =
                    new MediaStream();


                video.srcObject =
                    stream;

            }


            stream.addTrack(
                event.track
            );

        }


        video.play().catch(
            error => {

                console.warn(
                    "Video autoplay failed:",
                    error
                );

            }
        );


        /*
         * Only show LIVE when
         * the selected camera is live.
         */

        if (
            cameraList[activeIndex] ===
            String(cameraId)
        ) {

            setStatus(
                "🟢 LIVE"
            );

        }


        updateCameraUI();

    };


    /* =====================================================
       ICE CANDIDATE
    ===================================================== */

    pc.onicecandidate = event => {

        if (
            !event.candidate
        ) {

            return;
        }


        send({

            type: "candidate",

            cameraId:
                cameraId,

            candidate:
                event.candidate

        });

    };


    /* =====================================================
       CONNECTION STATE
    ===================================================== */

    pc.onconnectionstatechange = () => {

        console.log(
            "Connection:",
            cameraId,
            pc.connectionState
        );


        if (
            pc.connectionState ===
            "connected"
        ) {

            if (
                cameraList[activeIndex] ===
                String(cameraId)
            ) {

                setStatus(
                    "🟢 LIVE"
                );

            }

        }


        if (
            pc.connectionState ===
            "failed" ||

            pc.connectionState ===
            "disconnected" ||

            pc.connectionState ===
            "closed"
        ) {

            setTimeout(() => {

                if (
                    !peers.has(
                        cameraId
                    )
                ) {

                    return;
                }


                destroyPeer(
                    cameraId
                );


                sendViewerReady(
                    cameraId
                );


            }, 1500);

        }

    };


    /* =====================================================
       ICE CONNECTION STATE
    ===================================================== */

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                cameraId,
                pc.iceConnectionState
            );

        };


    return pc;
}


/* =========================================================
   HANDLE ICE CANDIDATE
========================================================= */

async function handleCandidate(message) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    if (!cameraId) {

        return;
    }


    const candidate =
        message.candidate;


    if (!candidate) {

        return;
    }


    const id =
        String(cameraId);


    const pc =
        peers.get(id);


    /*
     * Queue candidate if remote
     * description is not ready.
     */

    if (
        !pc ||
        !pc.remoteDescription
    ) {

        if (
            !pendingCandidates.has(id)
        ) {

            pendingCandidates.set(
                id,
                []
            );

        }


        pendingCandidates
            .get(id)
            .push(candidate);


        return;
    }


    try {

        await pc.addIceCandidate(

            new RTCIceCandidate(
                candidate
            )

        );

    } catch (error) {

        console.warn(
            "ICE candidate error:",
            error
        );

    }
}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer(cameraId) {

    const id =
        String(cameraId);


    const pc =
        peers.get(id);


    if (pc) {

        try {

            pc.close();

        } catch (error) {}


        peers.delete(id);

    }
}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (
        reconnectTimer
    ) {

        return;
    }


    reconnectTimer =
        setTimeout(() => {

            reconnectTimer =
                null;


            connectWebSocket();


        }, 2000);
}


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            console.log(
                "Page visible - checking connection"
            );


            if (
                !socket ||
                socket.readyState !==
                WebSocket.OPEN
            ) {

                connectWebSocket();

                return;
            }


            /*
             * Re-request existing cameras.
             */

            for (
                const cameraId
                of cameras
            ) {

                sendViewerReady(
                    cameraId
                );

            }

        }

    }
);


/* =========================================================
   NETWORK ONLINE
========================================================= */

window.addEventListener(
    "online",
    () => {

        console.log(
            "Network online"
        );


        connectWebSocket();

    }
);


/* =========================================================
   NETWORK OFFLINE
========================================================= */

window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );

    }
);


/* =========================================================
   RECONNECT BUTTON
========================================================= */

reconnectBtn.addEventListener(
    "click",
    () => {

        reconnectBtn.style.display =
            "none";


        if (socket) {

            try {

                socket.close();

            } catch (error) {}

        }


        connectWebSocket();

    }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
</html>
