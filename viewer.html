<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Live Camera Viewer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Main application */
#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

/* Waiting/status screen */
#status {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    padding: 8px 14px;
    border-radius: 20px;

    color: white;
    background: rgba(0,0,0,.65);

    font-size: 14px;
    white-space: nowrap;
}

/* Camera container */
#grid {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
}

/* Camera card */
.camera-card {
    width: 100%;
    height: 100%;

    position: relative;
    background: #000;

    overflow: hidden;
}

/*
   IMPORTANT:
   cover = fills the complete phone screen.
   Change to "contain" if you want the entire camera
   frame visible without cropping.
*/
.camera-card video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center center;

    background: #000;
}

/* Camera name */
.camera-name {
    position: absolute;
    left: 12px;
    bottom: 12px;

    padding: 6px 10px;

    color: white;
    background: rgba(0,0,0,.55);

    border-radius: 8px;
    font-size: 13px;

    z-index: 5;
}

/* Live indicator */
.live {
    position: absolute;
    top: 15px;
    right: 15px;

    padding: 6px 10px;

    background: rgba(180,0,0,.85);
    color: white;

    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;

    z-index: 5;
}

/* Reconnect button */
#reconnect {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 30;

    border: none;
    border-radius: 25px;

    padding: 11px 20px;

    background: rgba(255,255,255,.9);
    color: #111;

    font-size: 14px;
    font-weight: bold;

    display: none;
}

#reconnect:active {
    transform: translateX(-50%) scale(.96);
}
</style>
</head>

<body>

<div id="app">

    <div id="status">
        🟡 Waiting for cameras...
    </div>

    <div id="grid"></div>

    <button id="reconnect">
        🔄 Reconnect
    </button>

</div>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:" ? "wss:" : "ws:";

const WS_URL =
    WS_PROTOCOL + "//" + location.host + "/viewer";


/* =========================================================
   STATE
========================================================= */

let socket = null;

const cameras = new Set();
const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();

let reconnectTimer = null;
let manuallyClosed = false;


/* =========================================================
   DOM
========================================================= */

const statusEl = document.getElementById("status");
const gridEl = document.getElementById("grid");
const reconnectBtn = document.getElementById("reconnect");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {
    statusEl.textContent = text;
}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }

    manuallyClosed = false;

    setStatus("🟡 Connecting...");

    console.log("Connecting:", WS_URL);

    try {
        socket = new WebSocket(WS_URL);
    } catch (error) {
        console.error("WebSocket creation error:", error);
        scheduleReconnect();
        return;
    }

    socket.onopen = () => {

        console.log("WEBSOCKET CONNECTED");

        setStatus("🟡 Waiting for cameras...");

        reconnectBtn.style.display = "none";

        /*
         * Ask the server for cameras using the protocol
         * already used by your original page.
         */
        requestAll();

        /*
         * Re-request known cameras.
         */
        for (const cameraId of cameras) {
            sendViewerReady(cameraId);
        }
    };


    socket.onmessage = async event => {

        console.log("RECEIVED:", event.data);

        let message;

        try {
            message = JSON.parse(event.data);
        } catch (error) {
            console.error("Invalid WebSocket message:", event.data);
            return;
        }

        await handleMessage(message);
    };


    socket.onerror = error => {
        console.error("WEBSOCKET ERROR:", error);
    };


    socket.onclose = () => {

        console.log("WEBSOCKET CLOSED");

        if (!manuallyClosed) {
            setStatus("🔴 Connection lost — reconnecting...");
            scheduleReconnect();
        }
    };
}


/* =========================================================
   SEND
========================================================= */

function send(data) {

    if (!socket || socket.readyState !== WebSocket.OPEN) {
        console.warn("WebSocket not ready:", data);
        return false;
    }

    console.log("SEND:", data);

    socket.send(JSON.stringify(data));

    return true;
}


/* =========================================================
   REQUEST CAMERAS
========================================================= */

function requestAll() {

    /*
     * This is the existing protocol from your page.
     * Do not invent a new "viewer" message here.
     */
    send({
        type: "viewer-ready"
    });
}


/* =========================================================
   VIEWER READY
========================================================= */

function sendViewerReady(cameraId) {

    if (!cameraId) return;

    send({
        type: "viewer-ready",
        cameraId: cameraId
    });
}


/* =========================================================
   WEBSOCKET MESSAGE HANDLER
========================================================= */

async function handleMessage(message) {

    const type = message.type;

    switch (type) {

        case "role":

            console.log("ROLE:", message);

            /*
             * Server may send camera information here.
             */
            if (message.cameraId) {
                addCamera(message.cameraId);
            }

            break;


        case "camera-online":
        case "camera-live":

            if (message.cameraId) {
                addCamera(message.cameraId);

                /*
                 * Tell camera that this viewer is ready.
                 */
                sendViewerReady(message.cameraId);
            }

            break;


        case "camera-offline":

            if (message.cameraId) {
                removeCamera(message.cameraId);
            }

            break;


        case "offer":

            await handleOffer(message);

            break;


        case "candidate":

            await handleCandidate(message);

            break;


        default:

            console.log("Unknown message type:", type);
    }
}


/* =========================================================
   ADD CAMERA
========================================================= */

function addCamera(cameraId) {

    if (!cameraId) return;

    cameraId = String(cameraId);

    cameras.add(cameraId);

    console.log("Camera available:", cameraId);

    createCameraCard(cameraId);

    setStatus("🟢 Camera available");

    sendViewerReady(cameraId);
}


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(cameraId) {

    cameraId = String(cameraId);

    cameras.delete(cameraId);

    destroyPeer(cameraId);

    const card = cards.get(cameraId);

    if (card) {
        card.remove();
        cards.delete(cameraId);
    }

    if (cameras.size === 0) {
        setStatus("🟡 Waiting for cameras...");
    }
}


/* =========================================================
   CREATE CAMERA CARD
========================================================= */

function createCameraCard(cameraId) {

    if (cards.has(cameraId)) {
        return cards.get(cameraId);
    }

    const card = document.createElement("div");

    card.className = "camera-card";
    card.dataset.cameraId = cameraId;


    const video = document.createElement("video");

    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;

    /*
     * Important for mobile browsers.
     */
    video.setAttribute("autoplay", "");
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");


    const name = document.createElement("div");

    name.className = "camera-name";
    name.textContent = "Camera";


    const live = document.createElement("div");

    live.className = "live";
    live.textContent = "● LIVE";


    card.appendChild(video);
    card.appendChild(name);
    card.appendChild(live);

    gridEl.appendChild(card);

    cards.set(cameraId, card);

    return card;
}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(message) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;

    const offer = message.offer || message.sdp;

    if (!cameraId || !offer) {

        console.warn(
            "Offer missing cameraId or SDP:",
            message
        );

        return;
    }

    console.log("Received offer from:", cameraId);

    let pc = peers.get(String(cameraId));

    if (!pc) {
        pc = createPeer(String(cameraId));
    }

    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                typeof offer === "string"
                    ? {
                        type: "offer",
                        sdp: offer
                    }
                    : offer
            )
        );


        const candidates =
            pendingCandidates.get(String(cameraId)) || [];

        for (const candidate of candidates) {

            try {
                await pc.addIceCandidate(candidate);
            } catch (error) {
                console.warn(
                    "Could not add queued candidate:",
                    error
                );
            }
        }

        pendingCandidates.delete(String(cameraId));


        const answer =
            await pc.createAnswer();

        await pc.setLocalDescription(answer);


        send({
            type: "answer",
            cameraId: String(cameraId),
            answer: answer
        });

    } catch (error) {

        console.error(
            "WebRTC offer error:",
            error
        );

        destroyPeer(String(cameraId));
    }
}


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(cameraId) {

    destroyPeer(cameraId);

    const pc = new RTCPeerConnection({

        iceServers: [
            {
                urls: [
                    "stun:stun.l.google.com:19302"
                ]
            }
        ]
    });


    peers.set(cameraId, pc);


    pc.ontrack = event => {

        console.log(
            "VIDEO TRACK RECEIVED:",
            cameraId
        );

        const card =
            createCameraCard(cameraId);

        const video =
            card.querySelector("video");

        if (event.streams && event.streams[0]) {

            video.srcObject =
                event.streams[0];

        } else {

            let stream =
                video.srcObject;

            if (!stream) {
                stream = new MediaStream();
                video.srcObject = stream;
            }

            stream.addTrack(event.track);
        }


        video.play().catch(error => {
            console.warn(
                "Video autoplay failed:",
                error
            );
        });


        setStatus("🟢 LIVE");
    };


    pc.onicecandidate = event => {

        if (!event.candidate) return;

        send({
            type: "candidate",
            cameraId: cameraId,
            candidate: event.candidate
        });
    };


    pc.onconnectionstatechange = () => {

        console.log(
            "Connection:",
            cameraId,
            pc.connectionState
        );


        if (
            pc.connectionState === "connected"
        ) {
            setStatus("🟢 LIVE");
        }


        if (
            pc.connectionState === "failed" ||
            pc.connectionState === "disconnected" ||
            pc.connectionState === "closed"
        ) {

            /*
             * Give the connection a moment,
             * then request a fresh offer.
             */
            setTimeout(() => {

                if (!peers.has(cameraId)) {
                    return;
                }

                destroyPeer(cameraId);

                sendViewerReady(cameraId);

            }, 1500);
        }
    };


    pc.oniceconnectionstatechange = () => {

        console.log(
            "ICE:",
            cameraId,
            pc.iceConnectionState
        );
    };


    return pc;
}


/* =========================================================
   HANDLE ICE CANDIDATE
========================================================= */

async function handleCandidate(message) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;

    if (!cameraId) return;

    const candidate =
        message.candidate;

    if (!candidate) return;

    const id = String(cameraId);

    const pc = peers.get(id);


    if (!pc || !pc.remoteDescription) {

        if (!pendingCandidates.has(id)) {
            pendingCandidates.set(id, []);
        }

        pendingCandidates
            .get(id)
            .push(candidate);

        return;
    }


    try {

        await pc.addIceCandidate(
            new RTCIceCandidate(candidate)
        );

    } catch (error) {

        console.warn(
            "ICE candidate error:",
            error
        );
    }
}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer(cameraId) {

    const id = String(cameraId);

    const pc = peers.get(id);

    if (pc) {

        try {
            pc.close();
        } catch (error) {}

        peers.delete(id);
    }
}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (reconnectTimer) return;

    reconnectTimer = setTimeout(() => {

        reconnectTimer = null;

        connectWebSocket();

    }, 2000);
}


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState === "visible"
        ) {

            console.log(
                "Page visible - checking connection"
            );

            if (
                !socket ||
                socket.readyState !== WebSocket.OPEN
            ) {
                connectWebSocket();
                return;
            }

            /*
             * Re-request existing cameras.
             */
            for (const cameraId of cameras) {
                sendViewerReady(cameraId);
            }
        }
    }
);


/* =========================================================
   NETWORK CHANGE
========================================================= */

window.addEventListener(
    "online",
    () => {

        console.log("Network online");

        connectWebSocket();
    }
);


window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );
    }
);


/* =========================================================
   RECONNECT BUTTON
========================================================= */

reconnectBtn.addEventListener(
    "click",
    () => {

        reconnectBtn.style.display = "none";

        if (socket) {

            try {
                socket.close();
            } catch (error) {}
        }

        connectWebSocket();
    }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
      </html>
