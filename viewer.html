<!doctype html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 20px 10px 10px;
}

#status {
    text-align: center;
    color: #aaa;
    font-size: 18px;
    margin-bottom: 15px;
}

.camera-card {
    width: calc(100% - 20px);
    max-width: 1000px;
    margin: auto;
    background: #1c1c1c;
    border-radius: 15px;
    overflow: hidden;
}

video {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: block;
    background: black;
    object-fit: contain;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    padding: 10px;
}

button {
    border: 0;
    border-radius: 10px;
    min-height: 55px;
    background: #333;
    color: white;
    font-size: 15px;
}

button:active {
    background: #555;
}

#message {
    text-align: center;
    padding: 20px;
    color: #aaa;
}

</style>

</head>

<body>

<h1>
    Multi Camera Viewer
</h1>

<div id="status">
    Connecting...
</div>


<div class="camera-card">

    <video
        id="remoteVideo"
        autoplay
        playsinline>
    </video>


    <div class="controls">

        <button
            onclick="switchCamera('user')">
            📷 FRONT
        </button>

        <button
            onclick="switchCamera('environment')">
            🔄 BACK
        </button>

        <button
            onclick="fullscreenVideo()">
            ⛶ FULLSCREEN
        </button>

    </div>

</div>


<div id="message">
    Waiting for Camera A...
</div>


<script>

// =====================================================
// ELEMENTS
// =====================================================

const video =
    document.getElementById(
        "remoteVideo"
    );

const status =
    document.getElementById(
        "status"
    );

const message =
    document.getElementById(
        "message"
    );


// =====================================================
// WEBSOCKET
// =====================================================

const wsProtocol =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

let ws;


// =====================================================
// IDs
// =====================================================

const viewerId =
    "viewer-" +
    Math.random()
        .toString(36)
        .substring(2, 10);

let cameraId = null;


// =====================================================
// WEBRTC
// =====================================================

let pc = null;

let remoteDescriptionSet =
    false;

let iceQueue = [];


// =====================================================
// CONNECT
// =====================================================

function connect() {

    const wsUrl =
        wsProtocol +
        "//" +
        location.host;


    console.log(
        "WebSocket:",
        wsUrl
    );


    ws =
        new WebSocket(
            wsUrl
        );


    ws.onopen = () => {

        status.textContent =
            "Connected";


        ws.send(
            JSON.stringify({

                type:
                    "viewer-register",

                viewerId:
                    viewerId

            })
        );

    };


    ws.onmessage =
        async event => {

            let msg;


            try {

                msg =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }


            console.log(
                "Server:",
                msg.type
            );


            // =========================================
            // CAMERA ONLINE
            // =========================================

            if (
                msg.type ===
                "camera-online"
            ) {

                cameraId =
                    msg.cameraId;


                status.textContent =
                    "Camera A is online";


                message.textContent =
                    "Connecting to Camera A...";


                startView();

            }


            // =========================================
            // CAMERA OFFLINE
            // =========================================

            if (
                msg.type ===
                "camera-offline"
            ) {

                cameraId = null;


                status.textContent =
                    "Camera A offline";


                message.textContent =
                    "Waiting for Camera A...";


                video.srcObject =
                    null;


                if (pc) {

                    try {
                        pc.close();
                    } catch {}

                    pc = null;

                }

            }


            // =========================================
            // OFFER
            // =========================================

            if (
                msg.type ===
                "offer"
            ) {

                await handleOffer(
                    msg
                );

            }


            // =========================================
            // ICE
            // =========================================

            if (
                msg.type ===
                "ice"
            ) {

                await handleIce(
                    msg
                );

            }

        };


    ws.onclose = () => {

        status.textContent =
            "Disconnected";


        setTimeout(
            connect,
            3000
        );

    };


    ws.onerror = () => {

        status.textContent =
            "WebSocket error";

    };

}


// =====================================================
// START VIEW
// =====================================================

function startView() {

    if (!cameraId) {
        return;
    }


    send({

        type:
            "start-view",

        cameraId:
            cameraId,

        viewerId:
            viewerId

    });

}


// =====================================================
// CREATE PEER
// =====================================================

function createPeer() {

    if (pc) {

        try {
            pc.close();
        } catch {}

    }


    remoteDescriptionSet =
        false;

    iceQueue = [];


    pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    // =================================================
    // VIDEO RECEIVED
    // =================================================

    pc.ontrack =
        async event => {

            console.log(
                "VIDEO TRACK RECEIVED"
            );


            if (
                event.streams &&
                event.streams[0]
            ) {

                video.srcObject =
                    event.streams[0];


                try {

                    await video.play();

                } catch (error) {

                    console.log(
                        "Video play:",
                        error
                    );

                }


                status.textContent =
                    "LIVE";


                message.textContent =
                    "Camera A is live";

            }

        };


    // =================================================
    // ICE
    // =================================================

    pc.onicecandidate =
        event => {

            if (
                event.candidate
            ) {

                send({

                    type:
                        "ice",

                    cameraId:
                        cameraId,

                    viewerId:
                        viewerId,

                    candidate:
                        event.candidate

                });

            }

        };


    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                pc.iceConnectionState
            );

        };


    pc.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC:",
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                status.textContent =
                    "LIVE";

            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                status.textContent =
                    "WebRTC connection failed";


                message.textContent =
                    "Network connection failed";

            }

        };

}


// =====================================================
// HANDLE OFFER
// =====================================================

async function handleOffer(
    msg
) {

    cameraId =
        msg.cameraId;


    createPeer();


    try {

        await pc
            .setRemoteDescription(
                new RTCSessionDescription(
                    msg.offer
                )
            );


        remoteDescriptionSet =
            true;


        // Add queued ICE
        for (
            const candidate
            of iceQueue
        ) {

            await pc
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }


        iceQueue = [];


        const answer =
            await pc.createAnswer();


        await pc
            .setLocalDescription(
                answer
            );


        send({

            type:
                "answer",

            cameraId:
                cameraId,

            viewerId:
                viewerId,

            answer:
                pc.localDescription

        });


        status.textContent =
            "Connecting video...";

    } catch (error) {

        console.error(
            "Offer error:",
            error
        );


        status.textContent =
            "WebRTC error";

    }

}


// =====================================================
// HANDLE ICE
// =====================================================

async function handleIce(
    msg
) {

    if (!pc) {

        createPeer();

    }


    if (
        !remoteDescriptionSet
    ) {

        iceQueue.push(
            msg.candidate
        );

        return;

    }


    try {

        await pc
            .addIceCandidate(
                new RTCIceCandidate(
                    msg.candidate
                )
            );

    } catch (error) {

        console.error(
            "ICE error:",
            error
        );

    }

}


// =====================================================
// FRONT / BACK
// =====================================================

function switchCamera(
    facing
) {

    if (!cameraId) {

        message.textContent =
            "Camera A is offline";

        return;

    }


    send({

        type:
            "switch-camera",

        cameraId:
            cameraId,

        viewerId:
            viewerId,

        facing:
            facing

    });

}


// =====================================================
// FULLSCREEN
// =====================================================

function fullscreenVideo() {

    if (
        video.requestFullscreen
    ) {

        video.requestFullscreen();

    } else if (
        video.webkitRequestFullscreen
    ) {

        video.webkitRequestFullscreen();

    }

}


// =====================================================
// SEND
// =====================================================

function send(data) {

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

    }

}


// =====================================================
// START
// =====================================================

connect();

</script>

</body>

</html>
