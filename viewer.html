<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}
h1{font-size:28px;margin:20px 10px;}
#status{font-size:18px;margin:15px;}
#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px;
  padding:12px;
}
.card{background:#222;border-radius:12px;padding:8px;}
.label{color:#ddd;margin-bottom:8px;}
.video-wrap{
  position:relative;
  background:#000;
  border-radius:10px;
  overflow:hidden;
}
.video-wrap video{
  width:100%;
  min-height:220px;
  display:block;
  background:#000;
  object-fit:contain;
  filter:brightness(3) contrast(1.3) saturate(1.2);
}
.fullscreen-btn{
  position:absolute;
  right:10px;
  bottom:10px;
  width:48px;
  height:48px;
  border:none;
  border-radius:10px;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:24px;
  cursor:pointer;
}
.video-wrap:fullscreen{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}
.video-wrap:fullscreen video{
  width:100%;
  height:100%;
  object-fit:contain;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>
<div id="status">🟡 Connecting...</div>
<div id="grid"></div>

<script>
const status=document.getElementById("status");
const grid=document.getElementById("grid");

const peers=new Map();
const pending=new Map();
const cards=new Map();
let cameras=[];
let ws;
let reconnectingWS=false;

function send(msg){
  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify(msg));
  }
}

function addCamera(id){
  if(cards.has(id)) return;

  const card=document.createElement("div");
  card.className="card";

  const label=document.createElement("div");
  label.className="label";
  label.textContent="Camera "+id;

  const wrap=document.createElement("div");
  wrap.className="video-wrap";

  const video=document.createElement("video");
  video.autoplay=true;
  video.playsInline=true;
  video.muted=true;

  const btn=document.createElement("button");
  btn.className="fullscreen-btn";
  btn.innerHTML="⛶";
  btn.onclick=()=>{
    if(wrap.requestFullscreen) wrap.requestFullscreen();
    else if(wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
  };

  wrap.append(video,btn);
  card.append(label,wrap);
  grid.append(card);

  cards.set(id,{card,video});
}

function removeCamera(id){
  const item=cards.get(id);
  if(item){
    item.card.remove();
    cards.delete(id);
  }
}

function destroyPeer(id){
  const pc=peers.get(id);
  if(pc) pc.close();
  peers.delete(id);
  pending.delete(id);
}

function createPeer(id){

  if(peers.has(id)) return peers.get(id);

  addCamera(id);

  const pc=new RTCPeerConnection({
    iceServers:[{urls:"stun:stun.l.google.com:19302"}]
  });

  peers.set(id,pc);
  pending.set(id,[]);

  pc.onicecandidate=e=>{
    if(e.candidate){
      send({
        type:"candidate",
        cameraId:id,
        candidate:e.candidate
      });
    }
  };

  pc.ontrack=e=>{
    const item=cards.get(id);
    if(!item) return;

    item.video.srcObject=e.streams[0];
    item.video.play().catch(()=>{});

    status.textContent="🟢 Camera is LIVE";
  };

  pc.onconnectionstatechange=()=>{
    const state=pc.connectionState;

    if(state==="failed"||state==="closed"){
      reconnectPeer(id);
    }

    if(state==="connected"){
      status.textContent="🟢 Camera is LIVE";
    }
  };

  return pc;
}

function reconnectPeer(id){
  destroyPeer(id);

  setTimeout(()=>{
    createPeer(id);
    send({type:"viewer-ready",cameraId:id});
  },500);
}

async function handleOffer(msg){

  const pc=createPeer(msg.cameraId);

  await pc.setRemoteDescription(msg.offer);

  const list=pending.get(msg.cameraId)||[];
  for(const c of list){
    try{
      await pc.addIceCandidate(c);
    }catch{}
  }
  pending.set(msg.cameraId,[]);

  const answer=await pc.createAnswer();
  await pc.setLocalDescription(answer);

  send({
    type:"answer",
    cameraId:msg.cameraId,
    answer:pc.localDescription
  });
}

async function handleCandidate(msg){

  const pc=createPeer(msg.cameraId);

  if(!pc.remoteDescription){
    pending.get(msg.cameraId).push(msg.candidate);
    return;
  }

  try{
    await pc.addIceCandidate(msg.candidate);
  }catch{}
}

function requestAll(){
  cameras.forEach(id=>{
    createPeer(id);
    send({type:"viewer-ready",cameraId:id});
  });
}

function handleMessage(e){

  const msg=JSON.parse(e.data);

  if(msg.type==="role"){
    cameras=msg.cameras||[];
    requestAll();
  }

  if(msg.type==="camera-online"||msg.type==="camera-live"){

    if(!cameras.includes(msg.cameraId))
      cameras.push(msg.cameraId);

    createPeer(msg.cameraId);
    send({type:"viewer-ready",cameraId:msg.cameraId});
  }

  if(msg.type==="camera-offline"){
    destroyPeer(msg.cameraId);
    removeCamera(msg.cameraId);
    cameras=cameras.filter(x=>x!==msg.cameraId);
  }

  if(msg.type==="offer") handleOffer(msg);
  if(msg.type==="candidate") handleCandidate(msg);
}

function connectWS(){

  ws=new WebSocket(
    (location.protocol==="https:"?"wss:":"ws:")
    +"//"+location.host+"/viewer"
  );

  ws.onopen=()=>{
    reconnectingWS=false;
    status.textContent="🟡 Waiting for cameras...";
    requestAll();
  };

  ws.onmessage=handleMessage;

  ws.onerror=()=>{
    status.textContent="🔴 Server error";
  };

  ws.onclose=()=>{

    status.textContent="🟡 Reconnecting...";

    if(reconnectingWS) return;
    reconnectingWS=true;

    setTimeout(connectWS,1500);
  };
}

connectWS();

/* Recover frozen video */
setInterval(()=>{
  peers.forEach((pc,id)=>{
    if(pc.connectionState==="failed"||pc.connectionState==="closed"){
      reconnectPeer(id);
    }
  });
},5000);

document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    requestAll();
  }
});
</script>

</body>
</html>
