<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Camera Viewer</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  font-size:25px;
  margin:20px 0 10px;
}

#status{
  font-size:17px;
  margin:15px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px;
  padding:12px;
}

.card{
  background:#222;
  border-radius:10px;
  padding:8px;
  overflow:hidden;
}

.card video{
  display:block;
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  background:#000;
  border-radius:8px;
}

.label{
  font-size:14px;
  padding:7px 4px 3px;
  color:#ddd;
}

.state{
  font-size:13px;
  padding:4px;
  color:#aaa;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
  margin-top:7px;
}

.controls button{
  border:0;
  border-radius:7px;
  padding:9px 11px;
  background:#333;
  color:#fff;
  font-size:13px;
  cursor:pointer;
}

.controls button:active{
  transform:scale(.96);
}

.fullscreen-video{
  width:100vw !important;
  height:100vh !important;
  object-fit:contain !important;
  background:#000 !important;
  border-radius:0 !important;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">Connecting...</div>

<div id="grid"></div>

<script>

const status =
  document.getElementById("status");

const grid =
  document.getElementById("grid");


let ws = null;
let viewerId = null;

const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();

const reconnectTimers = new Map();
const watchdogTimers = new Map();

let reconnectingSocket = false;


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket(){

  if(
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ){

    return;

  }


  status.textContent =
    "🟡 Connecting viewer...";


  ws = new WebSocket(
    (location.protocol === "https:" ? "wss:" : "ws:") +
    "//" + location.host + "/viewer"
  );


  ws.onopen = () => {

    reconnectingSocket = false;

    status.textContent =
      "🟢 Viewer connected";

    console.log(
      "Viewer WebSocket connected"
    );

  };


  ws.onmessage = async event => {

    let message;

    try{

      message =
        JSON.parse(event.data);

    }catch{

      return;

    }


    await handleMessage(message);

  };


  ws.onerror = () => {

    console.log(
      "Viewer WebSocket error"
    );

  };


  ws.onclose = () => {

    console.log(
      "Viewer WebSocket closed"
    );


    status.textContent =
      "🔴 Viewer connection lost";


    if(!reconnectingSocket){

      reconnectingSocket = true;


      setTimeout(() => {

        reconnectingSocket = false;

        connectWebSocket();

      },3000);

    }

  };

}


/* =========================================================
   SAFE SEND
========================================================= */

function sendMessage(message){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    try{

      ws.send(
        JSON.stringify(message)
      );

      return true;

    }catch(error){

      console.log(
        "WebSocket send failed",
        error
      );

    }

  }

  return false;

}


/* =========================================================
   CAMERA CARD
========================================================= */

function addCamera(cameraId){

  if(cards.has(cameraId)){

    return cards.get(cameraId);

  }


  const card =
    document.createElement("div");

  card.className =
    "card";

  card.id =
    "card-" + cameraId;


  const label =
    document.createElement("div");

  label.className =
    "label";

  label.textContent =
    "Camera " + cameraId;


  const state =
    document.createElement("div");

  state.className =
    "state";

  state.textContent =
    "🟡 Connecting...";


  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;

  video.setAttribute(
    "autoplay",
    ""
  );

  video.setAttribute(
    "playsinline",
    "" 
  );


  /* =======================================================
     CONTROLS
  ======================================================= */

  const controls =
    document.createElement("div");

  controls.className =
    "controls";


  const frontButton =
    document.createElement("button");

  frontButton.textContent =
    "📷 Front";

  frontButton.onclick =
    () => requestCameraSwitch(
      cameraId,
      "user"
    );


  const backButton =
    document.createElement("button");

  backButton.textContent =
    "🔄 Back";

  backButton.onclick =
    () => requestCameraSwitch(
      cameraId,
      "environment"
    );


  const fullButton =
    document.createElement("button");

  fullButton.textContent =
    "⛶ Full";

  fullButton.onclick =
    () => fullscreenVideo(
      video
    );


  controls.appendChild(
    frontButton
  );

  controls.appendChild(
    backButton
  );

  controls.appendChild(
    fullButton
  );


  card.appendChild(
    label
  );

  card.appendChild(
    state
  );

  card.appendChild(
    video
  );

  card.appendChild(
    controls
  );


  grid.appendChild(
    card
  );


  const item = {

    card,
    label,
    state,
    video,
    frontButton,
    backButton,
    fullButton,

    lastTime:0,

    lastProgress:
      Date.now()

  };


  cards.set(
    cameraId,
    item
  );


  return item;

}


/* =========================================================
   REQUEST FRONT / BACK CAMERA
========================================================= */

function requestCameraSwitch(
  cameraId,
  facingMode
){

  const item =
    cards.get(cameraId);


  if(!item){

    return;

  }


  const name =
    facingMode === "user"
      ? "Front"
      : "Back";


  setCameraState(
    cameraId,
    "🟡 " +
    name +
    " camera requested..."
  );


  /*
   * This is a REQUEST.
   *
   * The camera.html page must receive this
   * and ask the camera user for confirmation.
   */

  const sent =
    sendMessage({

      type:"camera-switch-request",

      cameraId,

      facingMode

    });


  if(!sent){

    setCameraState(
      cameraId,
      "🔴 Viewer disconnected"
    );

    return;

  }


  console.log(
    "Camera switch requested:",
    cameraId,
    facingMode
  );

}


/* =========================================================
   CAMERA STATE
========================================================= */

function setCameraState(
  cameraId,
  text
){

  const item =
    cards.get(cameraId);


  if(item){

    item.state.textContent =
      text;

  }

}


/* =========================================================
   FULLSCREEN
========================================================= */

async function fullscreenVideo(
  video
){

  try{

    if(
      document.fullscreenElement
    ){

      await document.exitFullscreen();

      return;

    }


    if(
      video.requestFullscreen
    ){

      await video.requestFullscreen();

    }else if(
      video.webkitEnterFullscreen
    ){

      video.webkitEnterFullscreen();

    }else{

      video.classList.add(
        "fullscreen-video"
      );

    }

  }catch(error){

    console.log(
      "Fullscreen failed:",
      error
    );

  }

}


/* =========================================================
   EXIT FULLSCREEN
========================================================= */

document.addEventListener(
  "fullscreenchange",
  () => {

    if(
      !document.fullscreenElement
    ){

      document
        .querySelectorAll(
          ".fullscreen-video"
        )
        .forEach(video => {

          video.classList.remove(
            "fullscreen-video"
          );

        });

    }

  }
);


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(
  cameraId
){

  stopWatchdog(
    cameraId
  );


  const pc =
    peers.get(cameraId);


  if(pc){

    try{

      pc.ontrack = null;
      pc.onicecandidate = null;
      pc.onconnectionstatechange = null;
      pc.oniceconnectionstatechange = null;

      pc.close();

    }catch{}

  }


  peers.delete(
    cameraId
  );


  pendingCandidates.delete(
    cameraId
  );


  const timer =
    reconnectTimers.get(
      cameraId
    );


  if(timer){

    clearTimeout(timer);

    reconnectTimers.delete(
      cameraId
    );

  }


  const item =
    cards.get(cameraId);


  if(item){

    try{

      if(
        item.video.srcObject
      ){

        item.video.srcObject
          .getTracks()
          .forEach(
            track => track.stop()
          );

      }

    }catch{}


    item.card.remove();

  }


  cards.delete(
    cameraId
  );

}


/* =========================================================
   CLOSE PEER
========================================================= */

function closePeer(
  cameraId
){

  stopWatchdog(
    cameraId
  );


  const pc =
    peers.get(cameraId);


  if(pc){

    try{

      pc.ontrack = null;
      pc.onicecandidate = null;
      pc.onconnectionstatechange = null;
      pc.oniceconnectionstatechange = null;

      pc.close();

    }catch{}

  }


  peers.delete(
    cameraId
  );


  pendingCandidates.delete(
    cameraId
  );

}


/* =========================================================
   RESET ALL PEERS
========================================================= */

function resetAllPeers(){

  for(
    const cameraId of Array.from(
      peers.keys()
    )
  ){

    closePeer(
      cameraId
    );


    if(
      cards.has(cameraId)
    ){

      setCameraState(
        cameraId,
        "🟡 Reconnecting..."
      );

    }

  }

}


/* =========================================================
   RECONNECT VIEWER
========================================================= */

function reconnectViewer(){

  console.log(
    "Reconnecting viewer..."
  );


  status.textContent =
    "🟡 Reconnecting cameras...";


  resetAllPeers();


  for(
    const timer of reconnectTimers.values()
  ){

    clearTimeout(timer);

  }


  reconnectTimers.clear();


  reconnectingSocket = true;


  if(ws){

    try{

      ws.onclose = null;
      ws.onerror = null;

      ws.close();

    }catch{}

  }


  ws = null;


  setTimeout(() => {

    reconnectingSocket = false;

    connectWebSocket();

  },700);

}


/* =========================================================
   START PEER
========================================================= */

function startPeer(
  cameraId,
  reconnect=false
){

  if(!cameraId){

    return;

  }


  addCamera(
    cameraId
  );


  if(
    peers.has(cameraId)
  ){

    if(!reconnect){

      return;

    }


    closePeer(
      cameraId
    );

  }


  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  peers.set(
    cameraId,
    pc
  );


  pendingCandidates.set(
    cameraId,
    []
  );


  setCameraState(
    cameraId,
    reconnect
      ? "🟡 Reconnecting..."
      : "🟡 Connecting..."
  );


  /* =====================================================
     ICE
  ===================================================== */

  pc.onicecandidate =
    event => {

      if(
        !event.candidate
      ){

        return;

      }


      sendMessage({

        type:"candidate",

        candidate:
          event.candidate,

        cameraId

      });

    };


  /* =====================================================
     REMOTE TRACK
  ===================================================== */

  pc.ontrack =
    event => {

      console.log(
        "Remote track:",
        cameraId,
        event.track.kind
      );


      const item =
        cards.get(cameraId);


      if(!item){

        return;

      }


      let stream =
        event.streams &&
        event.streams[0];


      if(!stream){

        if(
          !item.video.srcObject
        ){

          stream =
            new MediaStream();

        }else{

          stream =
            item.video.srcObject;

        }


        try{

          stream.addTrack(
            event.track
          );

        }catch{}

      }


      item.video.srcObject =
        stream;


      event.track.onended =
        () => {

          setCameraState(
            cameraId,
            "🟡 Video ended"
          );

          scheduleReconnect(
            cameraId
          );

        };


      event.track.onmute =
        () => {

          setCameraState(
            cameraId,
            "🟡 Video paused"
          );

        };


      event.track.onunmute =
        () => {

          setCameraState(
            cameraId,
            "🟢 LIVE"
          );

        };


      item.video
        .play()
        .catch(
          () => {}
        );


      startWatchdog(
        cameraId
      );

    };


  /* =====================================================
     CONNECTION STATE
  ===================================================== */

  pc.onconnectionstatechange =
    () => {

      const state =
        pc.connectionState;


      console.log(
        "Connection:",
        cameraId,
        state
      );


      if(
        state === "connected"
      ){

        setCameraState(
          cameraId,
          "🟢 LIVE"
        );


        status.textContent =
          "🟢 Camera connection active";

      }


      if(
        state === "connecting"
      ){

        setCameraState(
          cameraId,
          "🟡 Connecting..."
        );

      }


      if(
        state === "disconnected"
      ){

        setCameraState(
          cameraId,
          "🟡 Reconnecting..."
        );


        scheduleReconnect(
          cameraId
        );

      }


      if(
        state === "failed"
      ){

        setCameraState(
          cameraId,
          "🟠 Connection failed"
        );


        scheduleReconnect(
          cameraId
        );

      }

    };


  /* =====================================================
     ICE STATE
  ===================================================== */

  pc.oniceconnectionstatechange =
    () => {

      const state =
        pc.iceConnectionState;


      if(
        state === "failed"
      ){

        setCameraState(
          cameraId,
          "🟠 ICE failed"
        );


        scheduleReconnect(
          cameraId
        );

      }


      if(
        state === "disconnected"
      ){

        setCameraState(
          cameraId,
          "🟡 Network interrupted"
        );


        scheduleReconnect(
          cameraId
        );

      }

    };


  /* =====================================================
     REQUEST OFFER
  ===================================================== */

  if(
    !sendMessage({

      type:"viewer-ready",

      cameraId,

      reconnect

    })
  ){

    setCameraState(
      cameraId,
      "🟡 Waiting for viewer connection"
    );

  }

}


/* =========================================================
   RECONNECT CAMERA
========================================================= */

function scheduleReconnect(
  cameraId
){

  if(
    !cards.has(cameraId)
  ){

    return;

  }


  if(
    reconnectTimers.has(cameraId)
  ){

    return;

  }


  const timer =
    setTimeout(
      () => {

        reconnectTimers.delete(
          cameraId
        );


        startPeer(
          cameraId,
          true
        );

      },
      2500
    );


  reconnectTimers.set(
    cameraId,
    timer
  );

}


/* =========================================================
   WATCHDOG
========================================================= */

function startWatchdog(
  cameraId
){

  stopWatchdog(
    cameraId
  );


  const timer =
    setInterval(
      () => {

        const item =
          cards.get(cameraId);


        const pc =
          peers.get(cameraId);


        if(
          !item ||
          !pc
        ){

          stopWatchdog(
            cameraId
          );

          return;

        }


        const video =
          item.video;


        if(
          video.readyState >= 2
        ){

          const current =
            video.currentTime;


          if(
            current !==
            item.lastTime
          ){

            item.lastTime =
              current;


            item.lastProgress =
              Date.now();


            if(
              pc.connectionState ===
              "connected"
            ){

              setCameraState(
                cameraId,
                "🟢 LIVE"
              );

            }

          }else{

            if(
              Date.now() -
              item.lastProgress >
              7000
            ){

              setCameraState(
                cameraId,
                "🟡 Video stuck"
              );


              scheduleReconnect(
                cameraId
              );


              item.lastProgress =
                Date.now();

            }

          }

        }else{

          if(
            Date.now() -
            item.lastProgress >
            10000
          ){

            setCameraState(
              cameraId,
              "🟡 Waiting for video..."
            );


            scheduleReconnect(
              cameraId
            );


            item.lastProgress =
              Date.now();

          }

        }

      },
      3000
    );


  watchdogTimers.set(
    cameraId,
    timer
  );

}


function stopWatchdog(
  cameraId
){

  const timer =
    watchdogTimers.get(
      cameraId
    );


  if(timer){

    clearInterval(
      timer
    );


    watchdogTimers.delete(
      cameraId
    );

  }

}


/* =========================================================
   SERVER MESSAGES
========================================================= */

async function handleMessage(m){

  /* =====================================================
     ROLE
  ===================================================== */

  if(
    m.type === "role"
  ){

    viewerId =
      m.viewerId || null;


    status.textContent =
      Array.isArray(m.cameras) &&
      m.cameras.length
        ? "🟢 Cameras available"
        : "🟡 Waiting for cameras...";


    if(
      Array.isArray(m.cameras)
    ){

      for(
        const cameraId of m.cameras
      ){

        startPeer(
          cameraId
        );

      }

    }


    return;

  }


  /* =====================================================
     CAMERA ONLINE
  ===================================================== */

  if(
    m.type === "camera-online"
  ){

    startPeer(
      m.cameraId
    );


    status.textContent =
      "🟢 Camera connected";


    return;

  }


  /* =====================================================
     CAMERA LIVE
  ===================================================== */

  if(
    m.type === "camera-live"
  ){

    addCamera(
      m.cameraId
    );


    setCameraState(
      m.cameraId,
      "🟢 Camera LIVE"
    );


    return;

  }


  /* =====================================================
     CAMERA OFFLINE
  ===================================================== */

  if(
    m.type === "camera-offline"
  ){

    removeCamera(
      m.cameraId
    );


    if(
      peers.size === 0
    ){

      status.textContent =
        "🔴 No cameras connected";

    }


    return;

  }


  /* =====================================================
     OFFER
  ===================================================== */

  if(
    m.type === "offer"
  ){

    const cameraId =
      m.cameraId;


    if(
      !cameraId ||
      !m.offer
    ){

      return;

    }


    if(
      !peers.has(cameraId)
    ){

      startPeer(
        cameraId
      );

    }


    const pc =
      peers.get(cameraId);


    if(!pc){

      return;

    }


    try{

      if(
        pc.signalingState ===
        "closed"
      ){

        scheduleReconnect(
          cameraId
        );

        return;

      }


      await pc.setRemoteDescription(
        m.offer
      );


      const queued =
        pendingCandidates.get(
          cameraId
        ) || [];


      for(
        const candidate of queued
      ){

        try{

          await pc.addIceCandidate(
            candidate
          );

        }catch{}

      }


      pendingCandidates.set(
        cameraId,
        []
      );


      const answer =
        await pc.createAnswer();


      await pc.setLocalDescription(
        answer
      );


      sendMessage({

        type:"answer",

        answer:
          pc.localDescription,

        cameraId

      });

    }catch(error){

      console.log(
        "Offer failed:",
        error
      );


      setCameraState(
        cameraId,
        "🟠 Negotiation failed"
      );


      scheduleReconnect(
        cameraId
      );

    }


    return;

  }


  /* =====================================================
     ICE CANDIDATE
  ===================================================== */

  if(
    m.type === "candidate"
  ){

    const cameraId =
      m.cameraId;


    if(
      !cameraId ||
      !m.candidate
    ){

      return;

    }


    const pc =
      peers.get(cameraId);


    if(!pc){

      return;

    }


    try{

      if(
        pc.remoteDescription
      ){

        await pc.addIceCandidate(
          m.candidate
        );

      }else{

        if(
          !pendingCandidates.has(
            cameraId
          )
        ){

          pendingCandidates.set(
            cameraId,
            []
          );

        }


        pendingCandidates
          .get(cameraId)
          .push(
            m.candidate
          );

      }

    }catch(error){

      console.log(
        "ICE candidate failed:",
        error
      );

    }

  }


  /* =====================================================
     CAMERA SWITCH RESULT
  ===================================================== */

  if(
    m.type === "camera-switch-result"
  ){

    if(
      m.cameraId
    ){

      if(
        m.approved
      ){

        const name =
          m.facingMode === "user"
            ? "Front"
            : "Back";


        setCameraState(
          m.cameraId,
          "🟢 " +
          name +
          " camera"
        );

      }else{

        setCameraState(
          m.cameraId,
          "🟡 Camera switch declined"
        );

      }

    }


    return;

  }

}


/* =========================================================
   ANDROID / CHROME RETURN
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      console.log(
        "Viewer visible again"
      );


      reconnectViewer();

    }

  }
);


window.addEventListener(
  "pageshow",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      reconnectViewer();

    }

  }
);


window.addEventListener(
  "online",
  () => {

    reconnectViewer();

  }
);


window.addEventListener(
  "focus",
  () => {

    if(
      document.visibilityState ===
      "visible" &&
      (
        !ws ||
        ws.readyState !==
        WebSocket.OPEN
      )
    ){

      reconnectViewer();

    }

  }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
</html>
