<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Camera Viewer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

#status {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    padding: 8px 14px;
    border-radius: 20px;
    color: white;
    background: rgba(0,0,0,.65);
    font-size: 14px;
    white-space: nowrap;
}

#grid {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: #000;
}

.camera-card {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    background: #000;
    overflow: hidden;
}

.camera-card.active {
    display: block;
}

.camera-card video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center center;
    background: #000;
}

.camera-name {
    position: absolute;
    left: 12px;
    bottom: 12px;
    padding: 6px 10px;
    color: white;
    background: rgba(0,0,0,.55);
    border-radius: 8px;
    font-size: 13px;
    z-index: 10;
}

.live {
    position: absolute;
    top: 15px;
    right: 15px;
    padding: 6px 10px;
    background: rgba(180,0,0,.85);
    color: white;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    z-index: 10;
}

#reconnect {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    border: none;
    border-radius: 25px;
    padding: 11px 20px;
    background: rgba(255,255,255,.9);
    color: #111;
    font-size: 14px;
    font-weight: bold;
    display: none;
}

#nextCamera {
    position: absolute;
    right: 15px;
    bottom: 20px;
    z-index: 200;
    border: none;
    border-radius: 25px;
    padding: 11px 18px;
    background: rgba(255,255,255,.9);
    color: #111;
    font-size: 14px;
    font-weight: bold;
    display: none;
}

#cameraCounter {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 150;
    padding: 7px 12px;
    border-radius: 20px;
    background: rgba(0,0,0,.65);
    color: white;
    font-size: 13px;
    display: none;
}
</style>
</head>

<body>

<div id="app">

    <div id="status">
        🟡 Waiting for cameras...
    </div>

    <div id="grid"></div>

    <button id="reconnect">
        🔄 Reconnect
    </button>

    <button id="nextCamera">
        ▶ Next
    </button>

    <div id="cameraCounter">
        Camera 1 / 1
    </div>

</div>


<script>
"use strict";


/* =========================================================
   CONFIG
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const WS_URL =
    WS_PROTOCOL +
    "//" +
    location.host +
    "/viewer";


/* =========================================================
   STATE
========================================================= */

let socket = null;

const cameras = new Set();

const peers = new Map();

const pendingCandidates =
    new Map();

const cards = new Map();

const cameraList = [];

let activeIndex = 0;

let reconnectTimer = null;

let manuallyClosed = false;


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById(
        "status"
    );

const gridEl =
    document.getElementById(
        "grid"
    );

const reconnectBtn =
    document.getElementById(
        "reconnect"
    );

const nextCameraBtn =
    document.getElementById(
        "nextCamera"
    );

const cameraCounter =
    document.getElementById(
        "cameraCounter"
    );


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusEl.textContent =
        text;

}


/* =========================================================
   UPDATE CAMERA UI
========================================================= */

function updateCameraUI() {

    cards.forEach(
        card => {

            card.classList.remove(
                "active"
            );

        }
    );


    if (
        cameraList.length === 0
    ) {

        nextCameraBtn.style.display =
            "none";

        cameraCounter.style.display =
            "none";

        return;
    }


    if (
        activeIndex >=
        cameraList.length
    ) {

        activeIndex = 0;

    }


    const activeCameraId =
        cameraList[activeIndex];


    const activeCard =
        cards.get(
            activeCameraId
        );


    if (activeCard) {

        activeCard.classList.add(
            "active"
        );

    }


    if (
        cameraList.length > 1
    ) {

        nextCameraBtn.style.display =
            "block";

    } else {

        nextCameraBtn.style.display =
            "none";

    }


    cameraCounter.textContent =
        "Camera " +
        (activeIndex + 1) +
        " / " +
        cameraList.length;


    cameraCounter.style.display =
        "block";

}


/* =========================================================
   NEXT CAMERA
========================================================= */

function showNextCamera() {

    if (
        cameraList.length <= 1
    ) {

        return;

    }


    activeIndex =
        (
            activeIndex + 1
        ) %
        cameraList.length;


    updateCameraUI();


    sendViewerReady(
        cameraList[activeIndex]
    );

}


nextCameraBtn.addEventListener(
    "click",
    showNextCamera
);


/* =========================================================
   WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||

            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {

        return;

    }


    manuallyClosed =
        false;


    setStatus(
        "🟡 Connecting..."
    );


    try {

        socket =
            new WebSocket(
                WS_URL
            );

    } catch (error) {

        console.error(
            "WebSocket creation error:",
            error
        );

        scheduleReconnect();

        return;

    }


    socket.onopen =
        () => {

            console.log(
                "WEBSOCKET CONNECTED"
            );


            setStatus(
                "🟡 Waiting for cameras..."
            );


            reconnectBtn.style.display =
                "none";


            /*
             * Ask server for cameras.
             */

            send({
                type:
                    "viewer-ready"
            });


            /*
             * Reconnect known cameras.
             */

            for (
                const cameraId
                of cameras
            ) {

                sendViewerReady(
                    cameraId
                );

            }

        };


    socket.onmessage =
        async event => {

            let message;


            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch (error) {

                console.error(
                    "Invalid message:",
                    event.data
                );

                return;

            }


            await handleMessage(
                message
            );

        };


    socket.onerror =
        error => {

            console.error(
                "WEBSOCKET ERROR:",
                error
            );

        };


    socket.onclose =
        () => {

            console.log(
                "WEBSOCKET CLOSED"
            );


            if (
                !manuallyClosed
            ) {

                setStatus(
                    "🔴 Connection lost — reconnecting..."
                );


                scheduleReconnect();

            }

        };

}


/* =========================================================
   SEND
========================================================= */

function send(data) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        return false;

    }


    try {

        socket.send(
            JSON.stringify(
                data
            )
        );

        return true;

    } catch (error) {

        console.error(
            "Send error:",
            error
        );

        return false;

    }

}


/* =========================================================
   VIEWER READY
========================================================= */

function sendViewerReady(
    cameraId
) {

    if (!cameraId) {
        return;
    }


    send({

        type:
            "viewer-ready",

        cameraId:
            String(cameraId)

    });

}


/* =========================================================
   MESSAGE HANDLER
========================================================= */

async function handleMessage(
    message
) {

    const type =
        message.type;


    switch (type) {

        case "role":

            /*
             * Viewer role.
             */

            if (
                Array.isArray(
                    message.cameras
                )
            ) {

                for (
                    const cameraId
                    of message.cameras
                ) {

                    addCamera(
                        cameraId
                    );

                }

            }

            break;


        case "camera-online":

        case "camera-live":

            if (
                message.cameraId
            ) {

                addCamera(
                    message.cameraId
                );


                sendViewerReady(
                    message.cameraId
                );

            }

            break;


        case "camera-offline":

            if (
                message.cameraId
            ) {

                removeCamera(
                    message.cameraId
                );

            }

            break;


        case "offer":

            await handleOffer(
                message
            );

            break;


        case "candidate":

            await handleCandidate(
                message
            );

            break;


        default:

            console.log(
                "Unknown message:",
                type
            );

    }

}


/* =========================================================
   ADD CAMERA
========================================================= */

function addCamera(
    cameraId
) {

    if (!cameraId) {
        return;
    }


    cameraId =
        String(cameraId);


    if (
        cameras.has(
            cameraId
        )
    ) {

        createCameraCard(
            cameraId
        );

        return;

    }


    cameras.add(
        cameraId
    );


    cameraList.push(
        cameraId
    );


    createCameraCard(
        cameraId
    );


    if (
        cameraList.length === 1
    ) {

        activeIndex =
            0;

    }


    updateCameraUI();


    setStatus(
        "🟢 Camera available"
    );


    sendViewerReady(
        cameraId
    );

}


/* =========================================================
   REMOVE CAMERA
========================================================= */

function removeCamera(
    cameraId
) {

    cameraId =
        String(cameraId);


    cameras.delete(
        cameraId
    );


    destroyPeer(
        cameraId
    );


    pendingCandidates.delete(
        cameraId
    );


    const index =
        cameraList.indexOf(
            cameraId
        );


    if (
        index !== -1
    ) {

        cameraList.splice(
            index,
            1
        );


        if (
            index < activeIndex &&
            activeIndex > 0
        ) {

            activeIndex--;

        }


        if (
            activeIndex >=
            cameraList.length
        ) {

            activeIndex =
                0;

        }

    }


    const card =
        cards.get(
            cameraId
        );


    if (card) {

        card.remove();

        cards.delete(
            cameraId
        );

    }


    updateCameraUI();


    if (
        cameras.size === 0
    ) {

        setStatus(
            "🟡 Waiting for cameras..."
        );

    }

}


/* =========================================================
   CREATE CAMERA CARD
========================================================= */

function createCameraCard(
    cameraId
) {

    if (
        cards.has(
            cameraId
        )
    ) {

        return cards.get(
            cameraId
        );

    }


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "camera-card";


    card.dataset.cameraId =
        cameraId;


    const video =
        document.createElement(
            "video"
        );


    video.autoplay =
        true;

    video.playsInline =
        true;

    video.muted =
        true;


    video.setAttribute(
        "autoplay",
        ""
    );

    video.setAttribute(
        "playsinline",
        ""
    );

    video.setAttribute(
        "webkit-playsinline",
        ""
    );


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "camera-name";


    name.textContent =
        "Camera " +
        (
            cameraList.indexOf(
                cameraId
            ) + 1
        );


    const live =
        document.createElement(
            "div"
        );


    live.className =
        "live";


    live.textContent =
        "● LIVE";


    card.appendChild(
        video
    );


    card.appendChild(
        name
    );


    card.appendChild(
        live
    );


    gridEl.appendChild(
        card
    );


    cards.set(
        cameraId,
        card
    );


    return card;

}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(
    message
) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    const offer =
        message.offer ||
        message.sdp;


    if (
        !cameraId ||
        !offer
    ) {

        console.warn(
            "Offer missing cameraId or SDP:",
            message
        );

        return;

    }


    const id =
        String(
            cameraId
        );


    let pc =
        peers.get(
            id
        );


    if (!pc) {

        pc =
            createPeer(
                id
            );

    }


    try {

        await pc.setRemoteDescription(

            new RTCSessionDescription(

                typeof offer ===
                "string"

                    ? {
                        type:
                            "offer",

                        sdp:
                            offer
                    }

                    : offer

            )

        );


        const candidates =
            pendingCandidates.get(
                id
            ) || [];


        for (
            const candidate
            of candidates
        ) {

            try {

                await pc.addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            } catch (error) {

                console.warn(
                    "Queued ICE error:",
                    error
                );

            }

        }


        pendingCandidates.delete(
            id
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        send({

            type:
                "answer",

            cameraId:
                id,

            answer:
                answer

        });

    } catch (error) {

        console.error(
            "WebRTC offer error:",
            error
        );


        destroyPeer(
            id
        );


        sendViewerReady(
            id
        );

    }

}


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer(
    cameraId
) {

    destroyPeer(
        cameraId
    );


    const pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                },

                {
                    urls:
                        "stun:stun1.l.google.com:19302"
                }

            ]

        });


    peers.set(
        cameraId,
        pc
    );


    /* =====================================================
       TRACK
    ===================================================== */

    pc.ontrack =
        event => {

            console.log(
                "VIDEO TRACK RECEIVED:",
                cameraId
            );


            const card =
                createCameraCard(
                    cameraId
                );


            const video =
                card.querySelector(
                    "video"
                );


            if (
                event.streams &&
                event.streams[0]
            ) {

                video.srcObject =
                    event.streams[0];

            } else {

                let mediaStream =
                    video.srcObject;


                if (!mediaStream) {

                    mediaStream =
                        new MediaStream();


                    video.srcObject =
                        mediaStream;

                }


                mediaStream.addTrack(
                    event.track
                );

            }


            video.play().catch(
                error => {

                    console.warn(
                        "Video play error:",
                        error
                    );

                }
            );


            if (
                cameraList[activeIndex] ===
                String(cameraId)
            ) {

                setStatus(
                    "🟢 LIVE"
                );

            }


            updateCameraUI();

        };


    /* =====================================================
       ICE
    ===================================================== */

    pc.onicecandidate =
        event => {

            if (
                !event.candidate
            ) {

                return;

            }


            send({

                type:
                    "candidate",

                cameraId:
                    cameraId,

                candidate:
                    event.candidate

            });

        };


    /* =====================================================
       CONNECTION STATE
    ===================================================== */

    pc.onconnectionstatechange =
        () => {

            console.log(
                "Connection:",
                cameraId,
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                if (
                    cameraList[
                        activeIndex
                    ] ===
                    String(cameraId)
                ) {

                    setStatus(
                        "🟢 LIVE"
                    );

                }

            }


            if (
                pc.connectionState ===
                    "failed" ||

                pc.connectionState ===
                    "disconnected"
            ) {

                setTimeout(
                    () => {

                        if (
                            peers.get(
                                cameraId
                            ) !== pc
                        ) {

                            return;

                        }


                        destroyPeer(
                            cameraId
                        );


                        sendViewerReady(
                            cameraId
                        );

                    },
                    1500
                );

            }

        };


    /* =====================================================
       ICE STATE
    ===================================================== */

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                cameraId,
                pc.iceConnectionState
            );

        };


    return pc;

}


/* =========================================================
   HANDLE ICE CANDIDATE
========================================================= */

async function handleCandidate(
    message
) {

    const cameraId =
        message.cameraId ||
        message.from ||
        message.sender;


    if (!cameraId) {
        return;
    }


    const id =
        String(
            cameraId
        );


    const candidate =
        message.candidate;


    if (!candidate) {
        return;
    }


    const pc =
        peers.get(
            id
        );


    if (
        !pc ||
        !pc.remoteDescription
    ) {

        if (
            !pendingCandidates.has(
                id
            )
        ) {

            pendingCandidates.set(
                id,
                []
            );

        }


        pendingCandidates
            .get(id)
            .push(
                candidate
            );


        return;

    }


    try {

        await pc.addIceCandidate(

            new RTCIceCandidate(
                candidate
            )

        );

    } catch (error) {

        console.warn(
            "ICE error:",
            error
        );

    }

}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer(
    cameraId
) {

    const id =
        String(
            cameraId
        );


    const pc =
        peers.get(
            id
        );


    if (pc) {

        try {
            pc.close();
        } catch (error) {}


        peers.delete(
            id
        );

    }

}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (
        reconnectTimer
    ) {

        return;

    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectWebSocket();

            },
            2000
        );

}


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (
                !socket ||
                socket.readyState !==
                WebSocket.OPEN
            ) {

                connectWebSocket();

                return;

            }


            for (
                const cameraId
                of cameras
            ) {

                sendViewerReady(
                    cameraId
                );

            }

        }

    }
);


/* =========================================================
   NETWORK ONLINE
========================================================= */

window.addEventListener(
    "online",
    () => {

        connectWebSocket();

    }
);


/* =========================================================
   NETWORK OFFLINE
========================================================= */

window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );

    }
);


/* =========================================================
   RECONNECT BUTTON
========================================================= */

reconnectBtn.addEventListener(
    "click",
    () => {

        reconnectBtn.style.display =
            "none";


        manuallyClosed =
            false;


        if (socket) {

            try {
                socket.close();
            } catch (error) {}

        }


        socket =
            null;


        connectWebSocket();

    }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
</html>
