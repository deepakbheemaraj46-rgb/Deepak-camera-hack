<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Live Camera Viewer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

#status {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    padding: 8px 14px;
    border-radius: 20px;

    color: white;
    background: rgba(0,0,0,.65);

    font-size: 14px;
    white-space: nowrap;
}

#grid {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
}

.camera-card {
    width: 100%;
    height: 100%;

    position: relative;
    background: #000;

    overflow: hidden;
}

.camera-card video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center center;

    background: #000;
}

.camera-name {
    position: absolute;
    left: 12px;
    bottom: 12px;

    padding: 6px 10px;

    color: white;
    background: rgba(0,0,0,.55);

    border-radius: 8px;
    font-size: 13px;

    z-index: 5;
}

.live {
    position: absolute;
    top: 15px;
    right: 15px;

    padding: 6px 10px;

    background: rgba(180,0,0,.85);
    color: white;

    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;

    z-index: 5;
}

#reconnect {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 30;

    border: none;
    border-radius: 25px;

    padding: 11px 20px;

    background: rgba(255,255,255,.9);
    color: #111;

    font-size: 14px;
    font-weight: bold;

    display: none;
}
</style>
</head>

<body>

<div id="app">

    <div id="status">
        🟡 Connecting...
    </div>

    <div id="grid"></div>

    <button id="reconnect">
        🔄 Reconnect
    </button>

</div>

<script>
"use strict";


/* =========================================================
   WEBSOCKET
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const WS_URL =
    WS_PROTOCOL +
    "//" +
    location.host +
    "/viewer";


/* =========================================================
   STATE
========================================================= */

let socket = null;

let reconnectTimer = null;

let manuallyClosed = false;

let cameraId = null;

let viewerId = null;

let peer = null;

let pendingCandidates = [];

let remoteDescriptionSet = false;


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById("status");

const gridEl =
    document.getElementById("grid");

const reconnectBtn =
    document.getElementById("reconnect");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusEl.textContent = text;
}


/* =========================================================
   SEND
========================================================= */

function send(data) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {

        console.warn(
            "WebSocket not ready:",
            data
        );

        return false;
    }


    console.log(
        "SEND:",
        data
    );


    socket.send(
        JSON.stringify(data)
    );


    return true;
}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {

        return;
    }


    manuallyClosed = false;


    setStatus(
        "🟡 Connecting..."
    );


    console.log(
        "Connecting:",
        WS_URL
    );


    socket =
        new WebSocket(
            WS_URL
        );


    /* =====================================================
       OPEN
    ===================================================== */

    socket.onopen = () => {

        console.log(
            "WEBSOCKET CONNECTED"
        );


        setStatus(
            "🟡 Waiting for camera..."
        );


        reconnectBtn.style.display =
            "none";
    };


    /* =====================================================
       MESSAGE
    ===================================================== */

    socket.onmessage = async event => {

        console.log(
            "RECEIVED:",
            event.data
        );


        let message;


        try {

            message =
                JSON.parse(
                    event.data
                );

        } catch (error) {

            console.error(
                "Invalid message:",
                event.data
            );

            return;
        }


        try {

            await handleMessage(
                message
            );

        } catch (error) {

            console.error(
                "Message handling error:",
                error
            );

            setStatus(
                "🔴 WebRTC error"
            );
        }
    };


    /* =====================================================
       ERROR
    ===================================================== */

    socket.onerror = error => {

        console.error(
            "WEBSOCKET ERROR:",
            error
        );
    };


    /* =====================================================
       CLOSE
    ===================================================== */

    socket.onclose = () => {

        console.log(
            "WEBSOCKET CLOSED"
        );


        destroyPeer();


        if (!manuallyClosed) {

            setStatus(
                "🔴 Connection lost..."
            );


            scheduleReconnect();
        }
    };
}


/* =========================================================
   MESSAGE HANDLER
========================================================= */

async function handleMessage(message) {

    console.log(
        "MESSAGE TYPE:",
        message.type
    );


    switch (message.type) {


        /* =================================================
           ROLE
        ================================================= */

        case "role":

            if (
                message.role === "viewer"
            ) {

                viewerId =
                    message.viewerId;


                console.log(
                    "Viewer ID:",
                    viewerId
                );
            }


            break;


        /* =================================================
           CAMERA ONLINE
        ================================================= */

        case "camera-online":

            console.log(
                "Camera online:",
                message.cameraId
            );


            cameraId =
                message.cameraId;


            setStatus(
                "🟢 Camera online — connecting..."
            );


            /*
             * IMPORTANT FIX:
             *
             * Tell server that this viewer
             * wants to connect to this camera.
             */

            requestCamera(
                cameraId
            );


            break;


        /* =================================================
           CAMERA LIVE
        ================================================= */

        case "camera-live":

            console.log(
                "Camera live:",
                message.cameraId
            );


            cameraId =
                message.cameraId;


            setStatus(
                "🟡 Camera live — connecting..."
            );


            /*
             * IMPORTANT FIX:
             *
             * The old code only changed the
             * status here.
             *
             * Now we actually request the
             * WebRTC connection.
             */

            requestCamera(
                cameraId
            );


            break;


        /* =================================================
           OFFER
        ================================================= */

        case "offer":

            await handleOffer(
                message
            );

            break;


        /* =================================================
           ICE
        ================================================= */

        case "candidate":

            await handleCandidate(
                message
            );

            break;


        /* =================================================
           CAMERA OFFLINE
        ================================================= */

        case "camera-offline":

            console.log(
                "Camera offline"
            );


            if (
                cameraId ===
                message.cameraId
            ) {

                destroyPeer();


                gridEl.innerHTML =
                    "";


                cameraId =
                    null;


                setStatus(
                    "🔴 Camera offline"
                );
            }


            break;


        default:

            console.log(
                "Unknown message:",
                message
            );
    }
}


/* =========================================================
   REQUEST CAMERA
========================================================= */

function requestCamera(id) {

    if (!id) {

        console.warn(
            "No camera ID"
        );

        return;
    }


    cameraId =
        id;


    console.log(
        "REQUESTING CAMERA:",
        cameraId
    );


    send({

        type:
            "viewer-ready",

        cameraId:
            cameraId
    });
}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(message) {

    console.log(
        "OFFER RECEIVED:",
        message
    );


    cameraId =
        message.cameraId;


    if (!cameraId) {

        console.error(
            "Offer has no cameraId"
        );

        return;
    }


    if (!message.offer) {

        console.error(
            "Offer has no SDP"
        );

        return;
    }


    createCameraCard();


    /*
     * Close old connection.
     */

    destroyPeer();


    /*
     * Create WebRTC connection.
     */

    peer =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ],

            bundlePolicy:
                "max-bundle",

            rtcpMuxPolicy:
                "require"
        });


    /* =====================================================
       TRACK
    ===================================================== */

    peer.ontrack = event => {

        console.log(
            "VIDEO TRACK RECEIVED"
        );


        const video =
            document.getElementById(
                "remoteVideo"
            );


        if (!video) {

            console.error(
                "Video element missing"
            );

            return;
        }


        if (
            event.streams &&
            event.streams.length
        ) {

            video.srcObject =
                event.streams[0];

        } else {

            if (!video.srcObject) {

                video.srcObject =
                    new MediaStream();
            }


            video.srcObject.addTrack(
                event.track
            );
        }


        video.play()
            .then(() => {

                console.log(
                    "VIDEO PLAYING"
                );

            })
            .catch(error => {

                console.warn(
                    "Video play:",
                    error
                );
            });
    };


    /* =====================================================
       ICE CANDIDATE
    ===================================================== */

    peer.onicecandidate =
        event => {

            if (!event.candidate) {
                return;
            }


            console.log(
                "Sending ICE candidate"
            );


            send({

                type:
                    "candidate",

                cameraId:
                    cameraId,

                candidate:
                    event.candidate
            });
        };


    /* =====================================================
       ICE STATE
    ===================================================== */

    peer.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE:",
                peer.iceConnectionState
            );


            if (
                peer.iceConnectionState ===
                "connected" ||
                peer.iceConnectionState ===
                "completed"
            ) {

                setStatus(
                    "🟢 LIVE"
                );
            }


            if (
                peer.iceConnectionState ===
                "failed"
            ) {

                setStatus(
                    "🔴 ICE connection failed"
                );
            }
        };


    /* =====================================================
       CONNECTION STATE
    ===================================================== */

    peer.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC:",
                peer.connectionState
            );


            switch (
                peer.connectionState
            ) {

                case "new":

                    setStatus(
                        "🟡 Preparing video..."
                    );

                    break;


                case "connecting":

                    setStatus(
                        "🟡 Connecting video..."
                    );

                    break;


                case "connected":

                    setStatus(
                        "🟢 LIVE"
                    );

                    break;


                case "disconnected":

                    setStatus(
                        "🟡 Video interrupted..."
                    );

                    break;


                case "failed":

                    setStatus(
                        "🔴 WebRTC connection failed"
                    );

                    break;


                case "closed":

                    setStatus(
                        "🔴 Video connection closed"
                    );

                    break;
            }
        };


    /* =====================================================
       SET REMOTE OFFER
    ===================================================== */

    try {

        await peer.setRemoteDescription(
            new RTCSessionDescription(
                message.offer
            )
        );


        remoteDescriptionSet =
            true;


        console.log(
            "REMOTE OFFER SET"
        );


        /*
         * Add queued ICE candidates.
         */

        await flushCandidates();


        /* =================================================
           CREATE ANSWER
        ================================================= */

        const answer =
            await peer.createAnswer();


        await peer.setLocalDescription(
            answer
        );


        console.log(
            "ANSWER CREATED"
        );


        /*
         * Send answer to server.
         */

        send({

            type:
                "answer",

            cameraId:
                cameraId,

            answer:
                peer.localDescription
        });


    } catch (error) {

        console.error(
            "OFFER ERROR:",
            error
        );


        setStatus(
            "🔴 WebRTC error"
        );
    }
}


/* =========================================================
   HANDLE CANDIDATE
========================================================= */

async function handleCandidate(message) {

    const candidate =
        message.candidate;


    if (!candidate) {
        return;
    }


    console.log(
        "ICE CANDIDATE RECEIVED:",
        candidate
    );


    /*
     * If peer isn't ready yet,
     * store candidate.
     */

    if (
        !peer ||
        !remoteDescriptionSet
    ) {

        pendingCandidates.push(
            candidate
        );

        return;
    }


    try {

        await peer.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );


        console.log(
            "ICE candidate added"
        );

    } catch (error) {

        console.error(
            "ICE candidate error:",
            error
        );
    }
}


/* =========================================================
   FLUSH ICE
========================================================= */

async function flushCandidates() {

    if (!peer) {
        return;
    }


    for (
        const candidate
        of pendingCandidates
    ) {

        try {

            await peer.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        } catch (error) {

            console.warn(
                "Queued ICE error:",
                error
            );
        }
    }


    pendingCandidates = [];
}


/* =========================================================
   CAMERA CARD
========================================================= */

function createCameraCard() {

    if (
        document.getElementById(
            "cameraCard"
        )
    ) {

        return;
    }


    const card =
        document.createElement(
            "div"
        );


    card.id =
        "cameraCard";

    card.className =
        "camera-card";


    const video =
        document.createElement(
            "video"
        );


    video.id =
        "remoteVideo";


    video.autoplay =
        true;

    video.playsInline =
        true;

    video.muted =
        true;


    video.setAttribute(
        "autoplay",
        ""
    );

    video.setAttribute(
        "playsinline",
        ""
    );

    video.setAttribute(
        "webkit-playsinline",
        ""
    );


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "camera-name";

    name.textContent =
        "Camera";


    const live =
        document.createElement(
        "div"
        );


    live.className =
        "live";

    live.textContent =
        "● LIVE";


    card.appendChild(
        video
    );

    card.appendChild(
        name
    );

    card.appendChild(
        live
    );


    gridEl.appendChild(
        card
    );
}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer() {

    remoteDescriptionSet =
        false;


    pendingCandidates =
        [];


    if (peer) {

        try {

            peer.ontrack =
                null;

            peer.onicecandidate =
                null;

            peer.onconnectionstatechange =
                null;

            peer.oniceconnectionstatechange =
                null;

            peer.close();

        } catch (error) {

            console.warn(
                "Peer close:",
                error
            );
        }


        peer =
            null;
    }
}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (reconnectTimer) {
        return;
    }


    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connectWebSocket();

            },
            2000
        );
}


/* =========================================================
   RECONNECT BUTTON
========================================================= */

reconnectBtn.addEventListener(
    "click",
    () => {

        reconnectBtn.style.display =
            "none";


        destroyPeer();


        if (socket) {

            try {

                socket.close();

            } catch (error) {}
        }


        connectWebSocket();
    }
);


/* =========================================================
   NETWORK ONLINE
========================================================= */

window.addEventListener(
    "online",
    () => {

        console.log(
            "Network online"
        );


        connectWebSocket();
    }
);


/* =========================================================
   NETWORK OFFLINE
========================================================= */

window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );
    }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
</html>
