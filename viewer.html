<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Live Camera Viewer</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

#status {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    padding: 8px 14px;
    border-radius: 20px;

    color: white;
    background: rgba(0,0,0,.65);

    font-size: 14px;
    white-space: nowrap;
}

#grid {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
}

.camera-card {
    width: 100%;
    height: 100%;

    position: relative;
    background: #000;

    overflow: hidden;
}

.camera-card video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
    object-position: center center;

    background: #000;
}

.camera-name {
    position: absolute;
    left: 12px;
    bottom: 12px;

    padding: 6px 10px;

    color: white;
    background: rgba(0,0,0,.55);

    border-radius: 8px;
    font-size: 13px;

    z-index: 5;
}

.live {
    position: absolute;
    top: 15px;
    right: 15px;

    padding: 6px 10px;

    background: rgba(180,0,0,.85);
    color: white;

    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;

    z-index: 5;
}

#reconnect {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 30;

    border: none;
    border-radius: 25px;

    padding: 11px 20px;

    background: rgba(255,255,255,.9);
    color: #111;

    font-size: 14px;
    font-weight: bold;

    display: none;
}
</style>
</head>

<body>

<div id="app">

    <div id="status">
        🟡 Connecting...
    </div>

    <div id="grid"></div>

    <button id="reconnect">
        🔄 Reconnect
    </button>

</div>

<script>
"use strict";


/* =========================================================
   WEBSOCKET
========================================================= */

const WS_PROTOCOL =
    location.protocol === "https:"
        ? "wss:"
        : "ws:";

const WS_URL =
    WS_PROTOCOL +
    "//" +
    location.host +
    "/viewer";


/* =========================================================
   STATE
========================================================= */

let socket = null;

let reconnectTimer = null;

let manuallyClosed = false;

let cameraId = null;

let peer = null;

let pendingCandidates = [];


/* =========================================================
   DOM
========================================================= */

const statusEl =
    document.getElementById("status");

const gridEl =
    document.getElementById("grid");

const reconnectBtn =
    document.getElementById("reconnect");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    statusEl.textContent = text;
}


/* =========================================================
   SEND
========================================================= */

function send(data) {

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        console.warn(
            "WebSocket not ready:",
            data
        );

        return false;
    }

    console.log(
        "SEND:",
        data
    );

    socket.send(
        JSON.stringify(data)
    );

    return true;
}


/* =========================================================
   CONNECT WEBSOCKET
========================================================= */

function connectWebSocket() {

    if (
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ) {
        return;
    }


    manuallyClosed = false;

    setStatus(
        "🟡 Connecting..."
    );


    console.log(
        "Connecting:",
        WS_URL
    );


    socket =
        new WebSocket(
            WS_URL
        );


    /* -----------------------------------------
       OPEN
    ----------------------------------------- */

    socket.onopen = () => {

        console.log(
            "WEBSOCKET CONNECTED"
        );

        setStatus(
            "🟡 Waiting for camera..."
        );

        reconnectBtn.style.display =
            "none";
    };


    /* -----------------------------------------
       MESSAGE
    ----------------------------------------- */

    socket.onmessage = async event => {

        console.log(
            "RECEIVED:",
            event.data
        );


        let message;

        try {

            message =
                JSON.parse(
                    event.data
                );

        } catch (error) {

            console.error(
                "Invalid message:",
                event.data
            );

            return;
        }


        await handleMessage(
            message
        );
    };


    /* -----------------------------------------
       ERROR
    ----------------------------------------- */

    socket.onerror = error => {

        console.error(
            "WEBSOCKET ERROR:",
            error
        );
    };


    /* -----------------------------------------
       CLOSE
    ----------------------------------------- */

    socket.onclose = () => {

        console.log(
            "WEBSOCKET CLOSED"
        );


        if (!manuallyClosed) {

            setStatus(
                "🔴 Connection lost..."
            );

            scheduleReconnect();
        }
    };
}


/* =========================================================
   MESSAGE HANDLER
========================================================= */

async function handleMessage(message) {

    console.log(
        "MESSAGE TYPE:",
        message.type
    );


    switch (message.type) {


        /* -----------------------------------------
           ROLE
        ----------------------------------------- */

        case "role":

            console.log(
                "Viewer role received"
            );

            break;


        /* -----------------------------------------
           CAMERA ONLINE
        ----------------------------------------- */

        case "camera-online":

            console.log(
                "Camera is online"
            );

            setStatus(
                "🟢 Camera online — connecting..."
            );

            /*
             * IMPORTANT:
             *
             * Your server sends viewer-ready
             * to the camera automatically.
             *
             * Therefore we do NOT send
             * viewer-ready from here.
             */

            break;


        /* -----------------------------------------
           CAMERA LIVE
        ----------------------------------------- */

        case "camera-live":

            console.log(
                "Camera is live"
            );

            setStatus(
                "🟢 Camera live — connecting..."
            );

            break;


        /* -----------------------------------------
           OFFER
        ----------------------------------------- */

        case "offer":

            await handleOffer(
                message
            );

            break;


        /* -----------------------------------------
           ICE CANDIDATE
        ----------------------------------------- */

        case "candidate":

            await handleCandidate(
                message
            );

            break;


        /* -----------------------------------------
           CAMERA OFFLINE
        ----------------------------------------- */

        case "camera-offline":

            console.log(
                "Camera offline"
            );

            setStatus(
                "🔴 Camera offline"
            );

            destroyPeer();

            gridEl.innerHTML = "";

            cameraId = null;

            break;


        default:

            console.log(
                "Unknown message:",
                message
            );
    }
}


/* =========================================================
   HANDLE OFFER
========================================================= */

async function handleOffer(message) {

    console.log(
        "OFFER RECEIVED:",
        message
    );


    /*
     * Your server sends cameraId
     * with the offer.
     */

    cameraId =
        message.cameraId;


    if (!cameraId) {

        console.error(
            "Offer has no cameraId"
        );

        return;
    }


    const offer =
        message.offer;


    if (!offer) {

        console.error(
            "Offer has no SDP"
        );

        return;
    }


    createCameraCard();


    /*
     * Remove old peer
     */

    if (peer) {

        try {
            peer.close();
        } catch (error) {}

        peer = null;
    }


    /*
     * Create WebRTC connection
     */

    peer =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

                /*
                 * TURN server can be added here
                 * for difficult remote connections.
                 */

            ],

            bundlePolicy:
                "max-bundle",

            rtcpMuxPolicy:
                "require"
        });


    /* -----------------------------------------
       RECEIVE VIDEO
    ----------------------------------------- */

    peer.ontrack = event => {

        console.log(
            "VIDEO TRACK RECEIVED"
        );


        const video =
            document.querySelector(
                "#remoteVideo"
            );


        if (
            event.streams &&
            event.streams.length > 0
        ) {

            video.srcObject =
                event.streams[0];

        } else {

            if (!video.srcObject) {

                video.srcObject =
                    new MediaStream();
            }


            video.srcObject.addTrack(
                event.track
            );
        }


        video.play()
            .catch(error => {

                console.log(
                    "Play:",
                    error
                );
            });


        setStatus(
            "🟢 LIVE"
        );
    };


    /* -----------------------------------------
       SEND ICE
    ----------------------------------------- */

    peer.onicecandidate = event => {

        if (!event.candidate) {
            return;
        }


        /*
         * IMPORTANT:
         *
         * We include cameraId so the server
         * knows which camera connection
         * this candidate belongs to.
         */

        send({

            type: "candidate",

            cameraId: cameraId,

            candidate:
                event.candidate
        });
    };


    /* -----------------------------------------
       CONNECTION STATE
    ----------------------------------------- */

    peer.onconnectionstatechange =
        () => {

            console.log(
                "Connection state:",
                peer.connectionState
            );


            if (
                peer.connectionState ===
                "connected"
            ) {

                setStatus(
                    "🟢 LIVE"
                );
            }


            if (
                peer.connectionState ===
                "connecting"
            ) {

                setStatus(
                    "🟡 Connecting video..."
                );
            }


            if (
                peer.connectionState ===
                "failed"
            ) {

                setStatus(
                    "🔴 WebRTC connection failed"
                );
            }


            if (
                peer.connectionState ===
                "disconnected"
            ) {

                setStatus(
                    "🟡 Connection interrupted"
                );
            }
        };


    /* -----------------------------------------
       ICE STATE
    ----------------------------------------- */

    peer.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE state:",
                peer.iceConnectionState
            );
        };


    /* -----------------------------------------
       SET OFFER
    ----------------------------------------- */

    try {

        await peer.setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );


        /*
         * Add candidates that arrived
         * before the offer.
         */

        for (
            const candidate
            of pendingCandidates
        ) {

            try {

                await peer.addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            } catch (error) {

                console.warn(
                    "Queued ICE error:",
                    error
                );
            }
        }


        pendingCandidates = [];


        /* -----------------------------------------
           CREATE ANSWER
        ----------------------------------------- */

        const answer =
            await peer.createAnswer();


        await peer.setLocalDescription(
            answer
        );


        console.log(
            "ANSWER CREATED"
        );


        /*
         * Send answer to server.
         */

        send({

            type: "answer",

            cameraId:
                cameraId,

            answer:
                peer.localDescription
        });


    } catch (error) {

        console.error(
            "OFFER ERROR:",
            error
        );

        setStatus(
            "🔴 WebRTC error"
        );
    }
}


/* =========================================================
   HANDLE ICE
========================================================= */

async function handleCandidate(message) {

    console.log(
        "ICE CANDIDATE:",
        message
    );


    const candidate =
        message.candidate;


    if (!candidate) {
        return;
    }


    /*
     * Your old server may send
     * candidate without cameraId.
     *
     * We therefore use the current
     * camera connection.
     */

    if (!peer) {

        pendingCandidates.push(
            candidate
        );

        return;
    }


    /*
     * If remote description isn't ready,
     * queue the candidate.
     */

    if (!peer.remoteDescription) {

        pendingCandidates.push(
            candidate
        );

        return;
    }


    try {

        await peer.addIceCandidate(

            new RTCIceCandidate(
                candidate
            )

        );

    } catch (error) {

        console.warn(
            "ICE ERROR:",
            error
        );
    }
}


/* =========================================================
   CAMERA CARD
========================================================= */

function createCameraCard() {

    if (
        document.getElementById(
            "cameraCard"
        )
    ) {
        return;
    }


    const card =
        document.createElement(
            "div"
        );


    card.id =
        "cameraCard";

    card.className =
        "camera-card";


    const video =
        document.createElement(
            "video"
        );


    video.id =
        "remoteVideo";

    video.autoplay =
        true;

    video.playsInline =
        true;

    video.muted =
        true;


    video.setAttribute(
        "autoplay",
        ""
    );

    video.setAttribute(
        "playsinline",
        ""
    );

    video.setAttribute(
        "webkit-playsinline",
        ""
    );


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "camera-name";

    name.textContent =
        "Camera";


    const live =
        document.createElement(
            "div"
        );


    live.className =
        "live";

    live.textContent =
        "● LIVE";


    card.appendChild(
        video
    );

    card.appendChild(
        name
    );

    card.appendChild(
        live
    );


    gridEl.appendChild(
        card
    );
}


/* =========================================================
   DESTROY PEER
========================================================= */

function destroyPeer() {

    if (peer) {

        try {
            peer.close();
        } catch (error) {}

        peer = null;
    }

    pendingCandidates = [];
}


/* =========================================================
   RECONNECT
========================================================= */

function scheduleReconnect() {

    if (reconnectTimer) {
        return;
    }


    reconnectTimer =
        setTimeout(() => {

            reconnectTimer =
                null;

            connectWebSocket();

        }, 2000);
}


/* =========================================================
   RECONNECT BUTTON
========================================================= */

reconnectBtn.addEventListener(
    "click",
    () => {

        reconnectBtn.style.display =
            "none";


        if (socket) {

            try {
                socket.close();
            } catch (error) {}
        }


        connectWebSocket();
    }
);


/* =========================================================
   NETWORK
========================================================= */

window.addEventListener(
    "online",
    () => {

        console.log(
            "Network online"
        );

        connectWebSocket();
    }
);


window.addEventListener(
    "offline",
    () => {

        setStatus(
            "🔴 Network disconnected"
        );
    }
);


/* =========================================================
   START
========================================================= */

connectWebSocket();

</script>

</body>
      </html>
