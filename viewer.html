<!doctype html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

h1{
  text-align:center;
  margin:25px 0 10px;
  font-size:28px;
}

#status{
  text-align:center;
  color:#aaa;
  font-size:18px;
  margin-bottom:20px;
}

#grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

  gap:12px;
  padding:12px;
}

.camera{
  position:relative;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

.camera video{
  width:100%;
  aspect-ratio:16/9;
  display:block;
  background:#000;
  object-fit:cover;
}

.label{
  padding:10px;
  text-align:center;
  background:#222;
  font-size:15px;
}

.fullscreen{
  position:absolute;
  right:8px;
  bottom:45px;

  border:0;
  border-radius:8px;

  padding:8px 12px;

  background:rgba(0,0,0,.7);
  color:white;

  font-size:14px;
}

</style>

</head>

<body>

<h1>Multi Camera Viewer</h1>

<div id="status">
  Connecting...
</div>

<div id="grid"></div>

<script>

const grid =
  document.getElementById("grid");

const status =
  document.getElementById("status");

const cameras = new Map();

const protocol =
  location.protocol === "https:"
    ? "wss:"
    : "ws:";

const ws =
  new WebSocket(
    protocol + "//" + location.host
  );


/*
==========================
WEBSOCKET OPEN
==========================
*/

ws.onopen = () => {

  console.log(
    "Viewer connected to server"
  );

  status.textContent =
    "Connected";

  ws.send(JSON.stringify({
    type:"register-viewer"
  }));

};


/*
==========================
WEBSOCKET CLOSE
==========================
*/

ws.onclose = () => {

  status.textContent =
    "Server disconnected";

};


/*
==========================
WEBSOCKET ERROR
==========================
*/

ws.onerror = () => {

  status.textContent =
    "Connection error";

};


/*
==========================
SERVER MESSAGE
==========================
*/

ws.onmessage = async (event) => {

  let msg;

  try {

    msg =
      JSON.parse(event.data);

  } catch {

    return;

  }

  console.log(
    "SERVER:",
    msg.type,
    msg.cameraId || ""
  );


  /*
  CAMERA ONLINE
  */

  if(msg.type === "camera-online") {

    addCamera(
      msg.cameraId
    );

  }


  /*
  CAMERA OFFLINE
  */

  if(msg.type === "camera-offline") {

    removeCamera(
      msg.cameraId
    );

  }


  /*
  CAMERA OFFER
  */

  if(msg.type === "offer") {

    await handleOffer(msg);

  }


  /*
  CAMERA ICE
  */

  if(msg.type === "ice-candidate") {

    await handleIce(msg);

  }


  /*
  CAMERA ERROR
  */

  if(msg.type === "camera-error") {

    console.log(
      "Camera error:",
      msg.message
    );

  }

};


/*
==========================
ADD CAMERA
==========================
*/

function addCamera(cameraId){

  if(cameras.has(cameraId)){
    return;
  }

  console.log(
    "Adding camera:",
    cameraId
  );

  const card =
    document.createElement("div");

  card.className = "camera";

  card.id =
    "camera-" + cameraId;


  const video =
    document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.controls = false;


  const label =
    document.createElement("div");

  label.className = "label";

  label.textContent =
    cameraId;


  const fullscreen =
    document.createElement("button");

  fullscreen.className =
    "fullscreen";

  fullscreen.textContent =
    "⛶ Fullscreen";


  fullscreen.onclick = () => {

    if(video.requestFullscreen){

      video.requestFullscreen();

    }

  };


  card.appendChild(video);
  card.appendChild(fullscreen);
  card.appendChild(label);

  grid.appendChild(card);


  /*
  WEBRTC
  */

  const pc =
    new RTCPeerConnection({

      iceServers:[
        {
          urls:
            "stun:stun.l.google.com:19302"
        }
      ]

    });


  /*
  VIDEO TRACK
  */

  pc.ontrack = (event) => {

    console.log(
      "VIDEO TRACK:",
      cameraId
    );

    if(event.streams &&
       event.streams[0]){

      video.srcObject =
        event.streams[0];

      video.play().catch(
        () => {}
      );

    }

  };


  /*
  ICE
  */

  pc.onicecandidate =
    (event) => {

      if(!event.candidate){
        return;
      }

      ws.send(JSON.stringify({

        type:
          "ice-candidate",

        cameraId:
          cameraId,

        candidate:
          event.candidate

      }));

    };


  pc.onconnectionstatechange =
    () => {

      console.log(
        "WebRTC:",
        cameraId,
        pc.connectionState
      );

    };


  cameras.set(
    cameraId,
    {
      pc,
      video,
      card
    }
  );


  /*
  IMPORTANT:
  Tell server that we want
  this camera.
  */

  ws.send(JSON.stringify({

    type:
      "viewer-request",

    cameraId:
      cameraId

  }));

}


/*
==========================
HANDLE OFFER
==========================
*/

async function handleOffer(msg){

  const camera =
    cameras.get(msg.cameraId);

  if(!camera){
    return;
  }

  const pc =
    camera.pc;

  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        msg.offer
      )
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    ws.send(JSON.stringify({

      type:
        "answer",

      cameraId:
        msg.cameraId,

      answer:
        answer

    }));


  } catch(error) {

    console.error(
      "Offer error:",
      error
    );

  }

}


/*
==========================
HANDLE ICE
==========================
*/

async function handleIce(msg){

  const camera =
    cameras.get(msg.cameraId);

  if(!camera){
    return;
  }

  try {

    await camera.pc.addIceCandidate(
      msg.candidate
    );

  } catch(error) {

    console.error(
      "ICE error:",
      error
    );

  }

}


/*
==========================
REMOVE CAMERA
==========================
*/

function removeCamera(cameraId){

  const camera =
    cameras.get(cameraId);

  if(!camera){
    return;
  }

  camera.pc.close();

  if(camera.video.srcObject){

    camera.video.srcObject
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }

  camera.card.remove();

  cameras.delete(
    cameraId
  );

}

</script>

</body>
</html>
