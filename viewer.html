<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  font-size:28px;
  margin:20px 10px;
}

#status{
  font-size:18px;
  margin:15px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:14px;
  padding:14px;
  max-width:1200px;
  margin:auto;
}

.card{
  background:#222;
  border-radius:14px;
  padding:10px;
}

.label{
  color:#ddd;
  margin-bottom:9px;
  font-size:17px;
}

.video-wrap{
  position:relative;
  background:#000;
  border-radius:11px;
  overflow:hidden;
}

video{
  width:100%;
  height:220px;
  display:block;
  background:#000;
  object-fit:contain;
}

.fullscreen-btn{
  position:absolute;
  right:10px;
  bottom:10px;
  width:46px;
  height:46px;
  border:0;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:25px;
}

.no-camera{
  padding:40px 10px;
  color:#aaa;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">🟡 Connecting...</div>

<div id="grid">
  <div class="no-camera">Waiting for cameras...</div>
</div>

<script>

const status = document.getElementById("status");
const grid = document.getElementById("grid");

let ws = null;
let reconnectTimer = null;
let reconnectDelay = 1000;

const cameras = new Set();
const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();


// ==================================================
// STATUS
// ==================================================

function setStatus(text){
  status.textContent = text;
}


// ==================================================
// SEND
// ==================================================

function send(data){

  if(!ws || ws.readyState !== WebSocket.OPEN){
    console.log("Cannot send:",data);
    return false;
  }

  console.log("SEND:",data);

  ws.send(JSON.stringify(data));

  return true;
}


// ==================================================
// CAMERA CARD
// ==================================================

function addCamera(id){

  if(cards.has(id)){
    return cards.get(id);
  }

  const old = grid.querySelector(".no-camera");

  if(old){
    old.remove();
  }

  const card = document.createElement("div");
  card.className = "card";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Camera " + id;

  const wrap = document.createElement("div");
  wrap.className = "video-wrap";

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;

  const button = document.createElement("button");

  button.className = "fullscreen-btn";
  button.textContent = "⛶";

  button.onclick = () => {

    if(wrap.requestFullscreen){
      wrap.requestFullscreen();
    }

  };

  wrap.append(video,button);
  card.append(label,wrap);
  grid.appendChild(card);

  const item = {
    card,
    video,
    wrap
  };

  cards.set(id,item);

  return item;
}


// ==================================================
// REMOVE CAMERA
// ==================================================

function removeCamera(id){

  const item = cards.get(id);

  if(item){
    item.card.remove();
    cards.delete(id);
  }

  if(cards.size === 0){

    grid.innerHTML =
      '<div class="no-camera">Waiting for cameras...</div>';

  }
}


// ==================================================
// CLOSE PEER
// ==================================================

function destroyPeer(id){

  const pc = peers.get(id);

  if(pc){

    try{
      pc.close();
    }catch(e){}

  }

  peers.delete(id);
  pendingCandidates.delete(id);
}


// ==================================================
// CREATE PEER
// ==================================================

function createPeer(id){

  if(peers.has(id)){
    return peers.get(id);
  }

  console.log("Creating WebRTC peer:",id);

  const item = addCamera(id);

  const pc = new RTCPeerConnection({

    iceServers:[
      {
        urls:"stun:stun.l.google.com:19302"
      }
    ]

  });

  peers.set(id,pc);
  pendingCandidates.set(id,[]);


  // -----------------------------------------------
  // ICE
  // -----------------------------------------------

  pc.onicecandidate = event => {

    if(event.candidate){

      send({
        type:"candidate",
        cameraId:id,
        candidate:event.candidate
      });

    }

  };


  // -----------------------------------------------
  // VIDEO
  // -----------------------------------------------

  pc.ontrack = event => {

    console.log(
      "REMOTE TRACK:",
      id,
      event.track.kind
    );

    if(event.track.kind !== "video"){
      return;
    }

    let stream = item.video.srcObject;

    if(!(stream instanceof MediaStream)){

      stream = new MediaStream();

      item.video.srcObject = stream;

    }

    if(!stream.getTracks().includes(event.track)){
      stream.addTrack(event.track);
    }

    event.track.onunmute = () => {

      item.video.play()
        .then(() => {
          setStatus("🟢 Camera is LIVE");
        })
        .catch(err => {
          console.log("Play error:",err);
        });

    };

    item.video.play()
      .then(() => {
        setStatus("🟢 Camera is LIVE");
      })
      .catch(err => {
        console.log("Play error:",err);
      });

  };


  // -----------------------------------------------
  // CONNECTION
  // -----------------------------------------------

  pc.onconnectionstatechange = () => {

    console.log(
      "Connection:",
      id,
      pc.connectionState
    );

    if(pc.connectionState === "connected"){

      setStatus("🟢 Camera is LIVE");

    }

    if(pc.connectionState === "failed"){

      console.log("WebRTC failed:",id);

      reconnectPeer(id);

    }

  };


  pc.oniceconnectionstatechange = () => {

    console.log(
      "ICE:",
      id,
      pc.iceConnectionState
    );

    if(pc.iceConnectionState === "failed"){

      reconnectPeer(id);

    }

  };


  return pc;
}


// ==================================================
// RECONNECT PEER
// ==================================================

const reconnecting = new Set();

function reconnectPeer(id){

  if(reconnecting.has(id)){
    return;
  }

  reconnecting.add(id);

  destroyPeer(id);

  setTimeout(() => {

    reconnecting.delete(id);

    if(!cameras.has(id)){
      return;
    }

    createPeer(id);

    send({
      type:"viewer-ready",
      cameraId:id
    });

  },1500);
}


// ==================================================
// OFFER
// ==================================================

async function handleOffer(msg){

  const id = msg.cameraId;

  console.log("OFFER:",id);

  try{

    const pc = createPeer(id);

    await pc.setRemoteDescription(
      new RTCSessionDescription(msg.offer)
    );


    // Add waiting ICE candidates
    const waiting =
      pendingCandidates.get(id) || [];

    for(const candidate of waiting){

      try{

        await pc.addIceCandidate(
          new RTCIceCandidate(candidate)
        );

      }catch(e){

        console.log(
          "ICE error:",
          e
        );

      }

    }

    pendingCandidates.set(id,[]);


    const answer =
      await pc.createAnswer();

    await pc.setLocalDescription(answer);


    send({

      type:"answer",

      cameraId:id,

      answer:pc.localDescription

    });

    console.log("ANSWER SENT:",id);

  }
  catch(error){

    console.error(
      "Offer error:",
      error
    );

    reconnectPeer(id);

  }

}


// ==================================================
// ICE CANDIDATE
// ==================================================

async function handleCandidate(msg){

  const id = msg.cameraId;

  const pc = createPeer(id);

  if(
    !pc.remoteDescription ||
    !pc.remoteDescription.type
  ){

    const list =
      pendingCandidates.get(id) || [];

    list.push(msg.candidate);

    pendingCandidates.set(id,list);

    return;
  }

  try{

    await pc.addIceCandidate(
      new RTCIceCandidate(msg.candidate)
    );

  }
  catch(error){

    console.log(
      "ICE error:",
      error
    );

  }

}


// ==================================================
// REQUEST CAMERA
// ==================================================

function requestCamera(id){

  if(!id){
    return;
  }

  cameras.add(id);

  createPeer(id);

  send({
    type:"viewer-ready",
    cameraId:id
  });

}


// ==================================================
// REQUEST ALL
// ==================================================

function requestAll(){

  if(!ws || ws.readyState !== WebSocket.OPEN){
    return;
  }

  cameras.forEach(id => {

    createPeer(id);

    send({
      type:"viewer-ready",
      cameraId:id
    });

  });

}


// ==================================================
// MESSAGE
// ==================================================

async function handleMessage(event){

  let msg;

  try{
    msg = JSON.parse(event.data);
  }
  catch(e){
    console.log("Bad message:",event.data);
    return;
  }

  console.log("RECEIVED:",msg);


  // Existing cameras
  if(msg.type === "role"){

    const list =
      Array.isArray(msg.cameras)
      ? msg.cameras
      : [];

    list.forEach(id => {

      cameras.add(id);

      createPeer(id);

    });

    if(cameras.size){

      setStatus(
        "🟡 Connecting to camera..."
      );

      requestAll();

    }
    else{

      setStatus(
        "🟡 Waiting for cameras..."
      );

    }

    return;
  }


  // New camera
  if(
    msg.type === "camera-online" ||
    msg.type === "camera-live"
  ){

    requestCamera(msg.cameraId);

    setStatus(
      "🟡 Connecting to camera..."
    );

    return;
  }


  // Camera offline
  if(msg.type === "camera-offline"){

    cameras.delete(msg.cameraId);

    destroyPeer(msg.cameraId);

    removeCamera(msg.cameraId);

    if(cameras.size === 0){

      setStatus(
        "🟡 Waiting for cameras..."
      );

    }

    return;
  }


  // Offer
  if(msg.type === "offer"){

    await handleOffer(msg);

    return;
  }


  // ICE
  if(msg.type === "candidate"){

    await handleCandidate(msg);

    return;
  }

}


// ==================================================
// CONNECT WEBSOCKET
// ==================================================

function connectWS(){

  if(
    ws &&
    (
      ws.readyState === WebSocket.OPEN ||
      ws.readyState === WebSocket.CONNECTING
    )
  ){
    return;
  }


  const protocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

  const url =
    protocol +
    "//" +
    location.host +
    "/viewer";

  console.log(
    "Connecting:",
    url
  );

  setStatus("🟡 Connecting...");

  ws = new WebSocket(url);


  // -----------------------------------------------
  // OPEN
  // -----------------------------------------------

  ws.onopen = () => {

    console.log(
      "WEBSOCKET CONNECTED"
    );

    reconnectDelay = 1000;

    setStatus(
      "🟡 Waiting for cameras..."
    );

    /*
      IMPORTANT:
      Keep the existing protocol.
    */

    requestAll();

  };


  // -----------------------------------------------
  // MESSAGE
  // -----------------------------------------------

  ws.onmessage = handleMessage;


  // -----------------------------------------------
  // ERROR
  // -----------------------------------------------

  ws.onerror = error => {

    console.log(
      "WebSocket error:",
      error
    );

    setStatus(
      "🔴 Server connection error"
    );

  };


  // -----------------------------------------------
  // CLOSE
  // -----------------------------------------------

  ws.onclose = () => {

    console.log(
      "WEBSOCKET CLOSED"
    );

    ws = null;

    setStatus(
      "🟡 Reconnecting..."
    );

    if(reconnectTimer){
      return;
    }

    reconnectTimer = setTimeout(() => {

      reconnectTimer = null;

      connectWS();

    },reconnectDelay);

    reconnectDelay =
      Math.min(
        reconnectDelay * 2,
        10000
      );

  };

}


// ==================================================
// WHEN PAGE RETURNS
// ==================================================

document.addEventListener(
  "visibilitychange",
  () => {

    if(!document.hidden){

      console.log(
        "Page active again"
      );

      if(
        !ws ||
        ws.readyState !== WebSocket.OPEN
      ){

        connectWS();

      }
      else{

        requestAll();

      }

    }

  }
);


// ==================================================
// NETWORK RETURNS
// ==================================================

window.addEventListener(
  "online",
  () => {

    console.log("Network online");

    if(
      !ws ||
      ws.readyState !== WebSocket.OPEN
    ){

      connectWS();

    }
    else{

      requestAll();

    }

  }
);


// ==================================================
// START
// ==================================================

connectWS();

</script>

</body>
</html>
