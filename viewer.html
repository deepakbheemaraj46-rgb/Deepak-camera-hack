<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Camera Viewer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 14px;
  text-align: center;
  background: #181818;
}

h2 {
  margin: 0;
  font-size: 20px;
}

#status {
  margin-top: 6px;
  font-size: 14px;
  color: #aaa;
}

#cameras {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 12px;
  padding: 12px;
}

.camera {
  position: relative;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
  min-height: 220px;
}

video {
  width: 100%;
  height: 100%;
  min-height: 220px;
  display: block;
  background: #000;
  object-fit: cover;
}

.label {
  position: absolute;
  left: 10px;
  top: 10px;
  padding: 6px 9px;
  background: rgba(0,0,0,.7);
  border-radius: 6px;
  font-size: 13px;
  z-index: 2;
}

.state {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  color: #aaa;
  font-size: 15px;
  text-align: center;
  z-index: 1;
  pointer-events: none;
}

.fullscreen {
  position: absolute;
  right: 10px;
  bottom: 10px;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.75);
  color: white;
  font-size: 20px;
  cursor: pointer;
  z-index: 3;
}

video.live + .state {
  display: none;
}
</style>
</head>

<body>

<header>
  <h2>Live Camera Viewer</h2>
  <div id="status">Connecting...</div>
</header>

<div id="cameras"></div>

<script>
const cameras = new Map();
let ws = null;
let reconnectTimer = null;

const camerasContainer = document.getElementById("cameras");
const statusText = document.getElementById("status");

/*
  Change this only if your WebSocket server uses
  a different address.
*/
const WS_URL =
  (location.protocol === "https:" ? "wss://" : "ws://") +
  location.host;

const ICE_SERVERS = [
  {
    urls: "stun:stun.l.google.com:19302"
  },
  {
    urls: "stun:stun1.l.google.com:19302"
  }
];

function setStatus(text) {
  statusText.textContent = text;
}

function createCamera(cameraId) {

  if (cameras.has(cameraId)) {
    return cameras.get(cameraId);
  }

  const box = document.createElement("div");
  box.className = "camera";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "Camera " + cameraId;

  const state = document.createElement("div");
  state.className = "state";
  state.textContent = "Connecting camera...";

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;

  const fullscreen = document.createElement("button");
  fullscreen.className = "fullscreen";
  fullscreen.innerHTML = "⛶";
  fullscreen.title = "Full screen";

  fullscreen.onclick = () => {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  };

  video.ondblclick = () => {
    if (video.requestFullscreen) {
      video.requestFullscreen();
    }
  };

  box.appendChild(video);
  box.appendChild(label);
  box.appendChild(state);
  box.appendChild(fullscreen);

  camerasContainer.appendChild(box);

  const data = {
    id: cameraId,
    box,
    video,
    state,
    pc: null,
    pendingCandidates: []
  };

  cameras.set(cameraId, data);

  return data;
}

function send(data) {

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    return false;
  }

  ws.send(JSON.stringify(data));
  return true;
}

function closePeer(camera) {

  if (camera.pc) {
    try {
      camera.pc.ontrack = null;
      camera.pc.onicecandidate = null;
      camera.pc.onconnectionstatechange = null;
      camera.pc.close();
    } catch (e) {}
  }

  camera.pc = null;
  camera.video.srcObject = null;
  camera.video.classList.remove("live");
  camera.state.textContent = "Reconnecting...";
}

function createPeer(camera) {

  closePeer(camera);

  const pc = new RTCPeerConnection({
    iceServers: ICE_SERVERS
  });

  camera.pc = pc;

  pc.ontrack = event => {

    if (event.streams && event.streams[0]) {
      camera.video.srcObject = event.streams[0];

      camera.video.play().catch(() => {});

      camera.video.classList.add("live");
      camera.state.textContent = "Live";
    }
  };

  pc.onicecandidate = event => {

    if (!event.candidate) return;

    send({
      type: "candidate",
      cameraId: camera.id,
      candidate: event.candidate
    });
  };

  pc.onconnectionstatechange = () => {

    const state = pc.connectionState;

    if (state === "connected") {

      camera.state.textContent = "Live";
      camera.video.classList.add("live");

    } else if (state === "connecting") {

      camera.state.textContent = "Connecting...";

    } else if (
      state === "disconnected" ||
      state === "failed"
    ) {

      camera.state.textContent = "Reconnecting...";
      camera.video.classList.remove("live");

      /*
        Ask the camera for a fresh offer.
      */
      setTimeout(() => {

        if (camera.pc === pc) {
          send({
            type: "viewer-ready",
            cameraId: camera.id
          });
        }

      }, 1000);

    }
  };

  return pc;
}

async function handleOffer(message) {

  const cameraId = message.cameraId;

  const camera = createCamera(cameraId);

  const pc = createPeer(camera);

  try {

    await pc.setRemoteDescription(
      new RTCSessionDescription(message.offer)
    );

    for (const candidate of camera.pendingCandidates) {

      try {
        await pc.addIceCandidate(candidate);
      } catch (e) {}
    }

    camera.pendingCandidates = [];

    const answer = await pc.createAnswer();

    await pc.setLocalDescription(answer);

    send({
      type: "answer",
      cameraId: cameraId,
      answer: pc.localDescription
    });

  } catch (error) {

    console.error("Offer error:", error);

    camera.state.textContent =
      "Connection failed";

  }
}

async function handleCandidate(message) {

  const camera = createCamera(message.cameraId);

  const candidate =
    new RTCIceCandidate(message.candidate);

  if (!camera.pc ||
      !camera.pc.remoteDescription) {

    camera.pendingCandidates.push(candidate);
    return;
  }

  try {
    await camera.pc.addIceCandidate(candidate);
  } catch (error) {
    console.error("ICE error:", error);
  }
}

function connectWebSocket() {

  clearTimeout(reconnectTimer);

  setStatus("Connecting to server...");

  try {
    ws = new WebSocket(WS_URL);
  } catch (error) {
    scheduleReconnect();
    return;
  }

  ws.onopen = () => {

    setStatus("Connected");

    /*
      Tell the server this browser is a viewer.
    */
    send({
      type: "viewer"
    });

    /*
      Request available cameras.
    */
    send({
      type: "get-cameras"
    });
  };

  ws.onmessage = async event => {

    let message;

    try {
      message = JSON.parse(event.data);
    } catch (error) {
      return;
    }

    console.log("SERVER:", message);

    if (message.type === "offer") {
      await handleOffer(message);
      return;
    }

    if (message.type === "candidate") {
      await handleCandidate(message);
      return;
    }

    if (message.type === "camera-online") {

      const camera = createCamera(message.cameraId);

      camera.state.textContent =
        "Camera online";

      send({
        type: "viewer-ready",
        cameraId: message.cameraId
      });

      return;
    }

    if (message.type === "camera-offline") {

      const camera = cameras.get(message.cameraId);

      if (camera) {
        closePeer(camera);
        camera.state.textContent =
          "Camera offline";
      }

      return;
    }
  };

  ws.onclose = () => {

    setStatus("Server disconnected");

    for (const camera of cameras.values()) {
      closePeer(camera);
    }

    scheduleReconnect();
  };

  ws.onerror = () => {
    setStatus("Connection error");
  };
}

function scheduleReconnect() {

  clearTimeout(reconnectTimer);

  reconnectTimer = setTimeout(() => {

    connectWebSocket();

  }, 1500);
}

/*
  When the viewer tab becomes visible again,
  reconnect if necessary.
*/
document.addEventListener("visibilitychange", () => {

  if (!document.hidden) {

    if (!ws ||
        ws.readyState !== WebSocket.OPEN) {

      connectWebSocket();

    } else {

      for (const camera of cameras.values()) {

        send({
          type: "viewer-ready",
          cameraId: camera.id
        });

      }
    }
  }
});

/*
  Start immediately.
*/
connectWebSocket();

</script>

</body>
</html>
