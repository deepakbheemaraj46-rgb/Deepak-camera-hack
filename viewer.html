<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Live Camera Viewer</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    background: #000;
    color: #fff;

    overflow: hidden;

    font-family: Arial, sans-serif;
}

#app {
    position: relative;

    width: 100%;
    height: 100%;

    background: #000;
}

/* =========================
   VIDEO
========================= */

#remoteVideo {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    object-fit: contain;

    display: block;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    z-index: 10;

    padding: 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            rgba(0,0,0,0)
        );
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.status {
    padding: 7px 11px;

    border-radius: 20px;

    background: rgba(0,0,0,.65);

    font-size: 13px;
}

/* =========================
   LOADING
========================= */

#loading {
    position: absolute;

    inset: 0;

    z-index: 8;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    background: #000;

    text-align: center;
}

.spinner {
    width: 42px;
    height: 42px;

    border: 4px solid #333;
    border-top: 4px solid #fff;

    border-radius: 50%;

    animation: spin 1s linear infinite;

    margin-bottom: 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#loadingText {
    font-size: 16px;
}

/* =========================
   CONTROLS
========================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 10;

    padding: 20px 12px 25px;

    display: flex;

    justify-content: center;

    gap: 8px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.8),
            rgba(0,0,0,0)
        );
}

button {
    border: 0;

    padding: 12px 16px;

    border-radius: 10px;

    color: #fff;

    background: rgba(40,40,40,.9);

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

button:disabled {
    opacity: .4;
}

/* =========================
   ERROR
========================= */

#errorBox {
    position: absolute;

    left: 20px;
    right: 20px;

    bottom: 100px;

    z-index: 20;

    display: none;

    padding: 15px;

    border-radius: 12px;

    background: rgba(150,0,0,.9);

    text-align: center;

    font-size: 14px;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .controls {
        gap: 12px;
    }

    button {
        padding: 13px 20px;
        font-size: 15px;
    }

}

</style>
</head>

<body>

<div id="app">

    <video
        id="remoteVideo"
        autoplay
        playsinline
        muted>
    </video>

    <div class="topbar">

        <div class="title">
            Live Camera
        </div>

        <div
            id="status"
            class="status">
            Connecting...
        </div>

    </div>


    <div id="loading">

        <div class="spinner"></div>

        <div id="loadingText">
            Connecting to camera...
        </div>

    </div>


    <div id="errorBox"></div>


    <div class="controls">

        <button
            id="frontBtn"
            disabled>
            Front
        </button>

        <button
            id="backBtn"
            disabled>
            Back
        </button>

        <button
            id="reconnectBtn">
            Reconnect
        </button>

    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("remoteVideo");

const status =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const errorBox =
    document.getElementById("errorBox");

const frontBtn =
    document.getElementById("frontBtn");

const backBtn =
    document.getElementById("backBtn");

const reconnectBtn =
    document.getElementById("reconnectBtn");


/* =========================================================
   STATE
========================================================= */

let socket = null;
let peer = null;
let cameraId = null;

let pendingCandidates = [];


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

    status.textContent = text;

}

function showLoading(text) {

    loading.style.display = "flex";

    loadingText.textContent = text;

}

function hideLoading() {

    loading.style.display = "none";

}

function showError(text) {

    errorBox.textContent = text;

    errorBox.style.display = "block";

}

function hideError() {

    errorBox.style.display = "none";

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectSocket() {

    hideError();

    showLoading(
        "Connecting to camera server..."
    );

    setStatus("Connecting...");


    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";


    const url =
        protocol +
        "//" +
        location.host +
        "/viewer";


    socket = new WebSocket(url);


    socket.onopen = () => {

        console.log(
            "WebSocket connected"
        );

        setStatus("Connected");

        showLoading(
            "Waiting for camera..."
        );

    };


    socket.onmessage = async event => {

        let msg;

        try {

            msg = JSON.parse(
                event.data
            );

        } catch {

            return;

        }

        await handleMessage(msg);

    };


    socket.onerror = error => {

        console.error(
            "WebSocket error:",
            error
        );

        setStatus("Connection error");

        showError(
            "Unable to connect to camera server."
        );

    };


    socket.onclose = () => {

        console.log(
            "WebSocket closed"
        );

        setStatus("Disconnected");

        showLoading(
            "Connection closed"
        );

    };

}


/* =========================================================
   SERVER MESSAGE
========================================================= */

async function handleMessage(msg) {

    console.log(
        "Received:",
        msg
    );


    if (msg.type === "camera-online") {

        cameraId =
            msg.cameraId;

        frontBtn.disabled = false;
        backBtn.disabled = false;

        setStatus(
            "Camera available"
        );

        requestCamera();

        return;

    }


    if (msg.type === "camera-live") {

        cameraId =
            msg.cameraId;

        frontBtn.disabled = false;
        backBtn.disabled = false;

        setStatus(
            "Camera is live"
        );

        requestCamera();

        return;

    }


    if (msg.type === "camera-offline") {

        setStatus(
            "Camera offline"
        );

        showLoading(
            "Camera is offline"
        );

        closePeer();

        return;

    }


    if (msg.type === "offer") {

        await receiveOffer(msg);

        return;

    }


    if (msg.type === "candidate") {

        await receiveCandidate(msg);

        return;

    }

}


/* =========================================================
   REQUEST CAMERA
========================================================= */

function requestCamera() {

    if (!socket ||
        socket.readyState !== WebSocket.OPEN ||
        !cameraId) {

        return;

    }


    socket.send(
        JSON.stringify({
            type: "viewer-ready",
            cameraId: cameraId
        })
    );

}


/* =========================================================
   CREATE PEER
========================================================= */

function createPeer() {

    closePeer();


    peer =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                        "stun:stun.l.google.com:19302"
                }

            ]

        });


    peer.ontrack = event => {

        console.log(
            "Remote track received"
        );


        if (
            event.streams &&
            event.streams[0]
        ) {

            video.srcObject =
                event.streams[0];

            video.play()
                .catch(() => {});

            hideLoading();

            hideError();

            setStatus(
                "🟢 LIVE"
            );

        }

    };


    peer.onicecandidate = event => {

        if (
            event.candidate &&
            socket &&
            socket.readyState ===
            WebSocket.OPEN
        ) {

            socket.send(
                JSON.stringify({

                    type: "candidate",

                    cameraId:
                        cameraId,

                    candidate:
                        event.candidate

                })
            );

        }

    };


    peer.onconnectionstatechange =
        () => {

            console.log(
                "Connection state:",
                peer.connectionState
            );


            if (
                peer.connectionState ===
                "connected"
            ) {

                hideLoading();

                setStatus(
                    "🟢 LIVE"
                );

            }


            if (
                peer.connectionState ===
                "connecting"
            ) {

                showLoading(
                    "Connecting video..."
                );

                setStatus(
                    "Connecting..."
                );

            }


            if (
                peer.connectionState ===
                "failed"
            ) {

                showError(
                    "WebRTC connection failed. Trying again..."
                );

                setStatus(
                    "Connection failed"
                );

            }

        };


    return peer;

}


/* =========================================================
   RECEIVE OFFER
========================================================= */

async function receiveOffer(msg) {

    try {

        createPeer();


        await peer.setRemoteDescription(
            new RTCSessionDescription(
                msg.offer
            )
        );


        /*
         * Add ICE candidates that
         * arrived before the offer.
         */

        for (
            const candidate
            of pendingCandidates
        ) {

            try {

                await peer.addIceCandidate(
                    candidate
                );

            } catch (error) {

                console.error(
                    "ICE error:",
                    error
                );

            }

        }

        pendingCandidates = [];


        const answer =
            await peer.createAnswer();


        await peer.setLocalDescription(
            answer
        );


        socket.send(
            JSON.stringify({

                type: "answer",

                cameraId:
                    cameraId,

                answer:
                    peer.localDescription

            })
        );


    } catch (error) {

        console.error(
            "Offer error:",
            error
        );

        showError(
            "Could not establish video connection."
        );

    }

}


/* =========================================================
   RECEIVE ICE
========================================================= */

async function receiveCandidate(msg) {

    if (!msg.candidate) {
        return;
    }


    const candidate =
        new RTCIceCandidate(
            msg.candidate
        );


    if (
        peer &&
        peer.remoteDescription
    ) {

        try {

            await peer.addIceCandidate(
                candidate
            );

        } catch (error) {

            console.error(
                "ICE candidate error:",
                error
            );

        }

    } else {

        pendingCandidates.push(
            candidate
        );

    }

}


/* =========================================================
   CAMERA SWITCH REQUEST
========================================================= */

function switchCamera(mode) {

    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN ||
        !cameraId
    ) {

        return;

    }


    socket.send(
        JSON.stringify({

            type: "camera-switch",

            cameraId:
                cameraId,

            mode:
                mode

        })
    );


    showLoading(
        mode === "user"
            ? "Requesting front camera..."
            : "Requesting back camera..."
    );

}


/* =========================================================
   CLOSE PEER
========================================================= */

function closePeer() {

    if (peer) {

        try {
            peer.close();
        } catch {}

        peer = null;

    }

    pendingCandidates = [];

    video.srcObject = null;

}


/* =========================================================
   BUTTONS
========================================================= */

frontBtn.onclick = () => {

    switchCamera("user");

};


backBtn.onclick = () => {

    switchCamera("environment");

};


reconnectBtn.onclick = () => {

    closePeer();

    if (socket) {

        try {
            socket.close();
        } catch {}

    }

    setTimeout(
        connectSocket,
        500
    );

};


/* =========================================================
   START
========================================================= */

connectSocket();

</script>

</body>
</html>
