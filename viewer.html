<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Camera Viewer</title>

<style>
body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial;
  text-align:center;
}

h1{
  font-size:25px;
  margin:20px 0 10px;
}

#status{
  font-size:17px;
  margin:15px;
}

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:12px;
  padding:12px;
}

.card{
  background:#222;
  border-radius:10px;
  padding:8px;
  position:relative;
}

.label{
  font-size:14px;
  padding:6px;
  color:#ddd;
}

/* Video area */
.video-container{
  position:relative;
  width:100%;
  background:#000;
  border-radius:8px;
  overflow:hidden;
}

.video-container video{
  display:block;
  width:100%;
  background:#000;
  min-height:180px;
  object-fit:contain;
}

/* Full screen button */
.fullscreen-btn{
  position:absolute;
  right:10px;
  bottom:10px;

  width:45px;
  height:45px;

  border:none;
  border-radius:8px;

  background:rgba(0,0,0,0.75);
  color:white;

  font-size:24px;
  cursor:pointer;

  z-index:10;
}

.fullscreen-btn:hover{
  background:rgba(40,40,40,0.95);
}

/* Full-screen video container */
.video-container:fullscreen{
  width:100vw;
  height:100vh;
  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;
}

.video-container:fullscreen video{
  width:100vw;
  height:100vh;
  object-fit:contain;
  min-height:0;
  border-radius:0;
}

/* Keep button visible in fullscreen */
.video-container:fullscreen .fullscreen-btn{
  right:20px;
  bottom:20px;
  width:55px;
  height:55px;
  font-size:28px;
}
</style>
</head>

<body>

<h1>👁️ Live Camera Viewer</h1>

<div id="status">Connecting...</div>

<div id="grid"></div>


<script>

const status = document.getElementById("status");
const grid = document.getElementById("grid");

const ws = new WebSocket(
  (location.protocol === "https:" ? "wss:" : "ws:") +
  "//" + location.host + "/viewer"
);

const peers = new Map();
const pendingCandidates = new Map();
const cards = new Map();


/* ==========================================
   ADD CAMERA
========================================== */

function addCamera(cameraId){

  if(cards.has(cameraId)) return;


  /* Camera card */

  const card = document.createElement("div");
  card.className = "card";
  card.id = "card-" + cameraId;


  /* Camera name */

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "📹 Camera " + cameraId;


  /* Video container */

  const videoContainer = document.createElement("div");
  videoContainer.className = "video-container";


  /* Video */

  const video = document.createElement("video");

  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;


  /* ==========================================
     FULL SCREEN BUTTON
  ========================================== */

  const fullscreenBtn = document.createElement("button");

  fullscreenBtn.className = "fullscreen-btn";

  fullscreenBtn.innerHTML = "⛶";

  fullscreenBtn.title = "Full Screen";


  fullscreenBtn.onclick = async function(){

    try{

      if(!document.fullscreenElement){

        await videoContainer.requestFullscreen();

        fullscreenBtn.innerHTML = "✕";
        fullscreenBtn.title = "Exit Full Screen";

      }
      else{

        await document.exitFullscreen();

      }

    }
    catch(error){

      console.log(
        "Fullscreen error:",
        error
      );
