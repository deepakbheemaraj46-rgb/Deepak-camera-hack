<!doctype html>
<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

h1{
  font-size:25px;
}

#status{
  font-size:17px;
  margin:15px;
}

#grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(280px,1fr)
    );

  gap:12px;

  padding:12px;
}

.card{

  background:#222;

  border-radius:10px;

  padding:8px;

}

.label{

  font-size:14px;

  padding:6px;

  color:#ddd;

}

.videoBox{

  position:relative;

  background:#000;

  border-radius:8px;

  overflow:hidden;

}

.videoBox video{

  display:block;

  width:100%;

  min-height:180px;

  background:#000;

  object-fit:contain;

}


/* =========================
   FULL SCREEN BUTTON
========================= */

.fullscreenBtn{

  position:absolute;

  right:10px;

  bottom:10px;

  width:48px;

  height:48px;

  border:0;

  border-radius:8px;

  background:
    rgba(0,0,0,0.75);

  color:white;

  font-size:26px;

  cursor:pointer;

  z-index:10;

}

.fullscreenBtn:hover{

  background:
    rgba(50,50,50,0.95);

}


/* FULLSCREEN */

.videoBox:fullscreen{

  width:100vw;

  height:100vh;

  background:#000;

  display:flex;

  align-items:center;

  justify-content:center;

}

.videoBox:fullscreen video{

  width:100vw;

  height:100vh;

  min-height:0;

  object-fit:contain;

}

</style>

</head>


<body>

<h1>
  👁️ Live Camera Viewer
</h1>

<div id="status">
  Connecting...
</div>

<div id="grid"></div>


<script>

const status =
  document.getElementById(
    "status"
  );

const grid =
  document.getElementById(
    "grid"
  );


/* =========================
   WEBSOCKET
========================= */

const ws =
  new WebSocket(

    (location.protocol === "https:"
      ? "wss://"
      : "ws://"
    ) +

    location.host +

    "/viewer"

  );


const peers =
  new Map();


const pendingCandidates =
  new Map();


const cards =
  new Map();


/* =========================
   WEBSOCKET EVENTS
========================= */

ws.onopen = function(){

  status.textContent =
    "🟢 Viewer connected - Waiting for cameras...";

};


ws.onerror = function(){

  status.textContent =
    "🔴 WebSocket connection error";

};


ws.onclose = function(){

  status.textContent =
    "🔴 Viewer connection closed";

};


/* =========================
   ADD CAMERA
========================= */

function addCamera(cameraId){

  if(
    cards.has(cameraId)
  ){

    return;

  }


  const card =
    document.createElement(
      "div"
    );

  card.className =
    "card";


  const label =
    document.createElement(
      "div"
    );

  label.className =
    "label";

  label.textContent =
    "📹 Camera " +
    cameraId;


  const videoBox =
    document.createElement(
      "div"
    );

  videoBox.className =
    "videoBox";


  const video =
    document.createElement(
      "video"
    );

  video.autoplay =
    true;

  video.playsInline =
    true;

  video.muted =
    true;


  /* =========================
     FULL SCREEN BUTTON
  ========================= */

  const fullscreenBtn =
    document.createElement(
      "button"
    );

  fullscreenBtn.className =
    "fullscreenBtn";

  fullscreenBtn.innerHTML =
    "⛶";

  fullscreenBtn.title =
    "Full Screen";


  fullscreenBtn.onclick =
    async function(){

    try{

      if(
        !document.fullscreenElement
      ){

        await videoBox.requestFullscreen();

      }
      else{

        await document.exitFullscreen();

      }

    }
    catch(error){

      console.log(
        "Fullscreen error:",
        error
      );

    }

  };


  /* Double-click */

  video.ondblclick =
    async function(){

    try{

      if(
        !document.fullscreenElement
      ){

        await videoBox.requestFullscreen();

      }
      else{

        await document.exitFullscreen();

      }

    }
    catch(error){

      console.log(error);

    }

  };


  /* Fullscreen button icon */

  videoBox.addEventListener(
    "fullscreenchange",
    function(){

      if(
        document.fullscreenElement
          === videoBox
      ){

        fullscreenBtn.innerHTML =
          "✕";

      }
      else{

        fullscreenBtn.innerHTML =
          "⛶";

      }

    }
  );


  videoBox.appendChild(
    video
  );

  videoBox.appendChild(
    fullscreenBtn
  );


  card.appendChild(
    label
  );

  card.appendChild(
    videoBox
  );


  grid.appendChild(
    card
  );


  cards.set(
    cameraId,
    {
      card,
      video,
      videoBox
    }
  );

}


/* =========================
   REMOVE CAMERA
========================= */

function removeCamera(cameraId){

  const pc =
    peers.get(cameraId);


  if(pc){

    pc.close();

  }


  peers.delete(
    cameraId
  );


  pendingCandidates.delete(
    cameraId
  );


  const item =
    cards.get(cameraId);


  if(item){

    item.card.remove();

  }


  cards.delete(
    cameraId
  );

}


/* =========================
   START PEER
========================= */

function startPeer(cameraId){

  if(
    peers.has(cameraId)
  ){

    return;

  }


  addCamera(
    cameraId
  );


  const pc =
    new RTCPeerConnection({

      iceServers:[

        {
          urls:
            "stun:stun.l.google.com:19302"
        }

      ]

    });


  peers.set(
    cameraId,
    pc
  );


  pendingCandidates.set(
    cameraId,
    []
  );


  /* ICE */

  pc.onicecandidate =
    function(e){

    if(e.candidate){

      ws.send(
        JSON.stringify({

          type:
            "candidate",

          candidate:
            e.candidate,

          cameraId

        })
      );

    }

  };


  /* LIVE VIDEO */

  pc.ontrack =
    function(e){

    const item =
      cards.get(
        cameraId
      );


    if(item){

      if(
        e.streams &&
        e.streams[0]
      ){

        item.video.srcObject =
          e.streams[0];

      }
      else{

        if(
          !item.video.srcObject
        ){

          item.video.srcObject =
            new MediaStream();

        }

        item.video.srcObject.addTrack(
          e.track
        );

      }


      item.video.play()
        .catch(
          function(){}
        );

    }

  };


  /* Tell camera */

  ws.send(
    JSON.stringify({

      type:
        "viewer-ready",

      cameraId

    })
  );

}


/* =========================
   WEBSOCKET MESSAGE
========================= */

ws.onmessage =
  async function(e){

  const m =
    JSON.parse(e.data);


  /* ROLE */

  if(
    m.type === "role"
  ){

    status.textContent =
      "🟡 Waiting for cameras...";


    if(
      Array.isArray(
        m.cameras
      )
    ){

      m.cameras.forEach(
        startPeer
      );

    }

  }


  /* CAMERA ONLINE */

  if(
    m.type ===
      "camera-online"
  ){

    startPeer(
      m.cameraId
    );

    status.textContent =
      "🟢 Camera connected";

  }


  /* CAMERA LIVE */

  if(
    m.type ===
      "camera-live"
  ){

    startPeer(
      m.cameraId
    );

    status.textContent =
      "🟢 Camera is LIVE";

  }


  /* CAMERA OFFLINE */

  if(
    m.type ===
      "camera-offline"
  ){

    removeCamera(
      m.cameraId
    );


    if(
      peers.size === 0
    ){

      status.textContent =
        "🔴 No cameras connected";

    }

  }


  /* =========================
     OFFER FROM CAMERA
  ========================= */

  if(
    m.type === "offer"
  ){

    const cameraId =
      m.cameraId;


    if(
      !peers.has(cameraId)
    ){

      startPeer(
        cameraId
      );

    }


    const pc =
      peers.get(
        cameraId
      );


    await pc.setRemoteDescription(
      m.offer
    );


    /* Add queued candidates */

    const queued =
      pendingCandidates.get(
        cameraId
      ) || [];


    for(
      const candidate
      of queued
    ){

      await pc.addIceCandidate(
        candidate
      ).catch(
        function(){}
      );

    }


    pendingCandidates.set(
      cameraId,
      []
    );


    /* Create answer */

    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    ws.send(
      JSON.stringify({

        type:
          "answer",

        answer:
          pc.localDescription,

        cameraId

      })
    );

  }


  /* =========================
     ICE CANDIDATE
  ========================= */

  if(
    m.type === "candidate"
  ){

    const cameraId =
      m.cameraId;


    const pc =
      peers.get(
        cameraId
      );


    if(!pc){

      return;

    }


    if(
      pc.remoteDescription
    ){

      await pc.addIceCandidate(
        m.candidate
      ).catch(
        function(){}
      );

    }
    else{

      if(
        !pendingCandidates.has(
          cameraId
        )
      ){

        pendingCandidates.set(
          cameraId,
          []
        );

      }


      pendingCandidates
        .get(cameraId)
        .push(
          m.candidate
        );

    }

  }

};

</script>

</body>

</html>
