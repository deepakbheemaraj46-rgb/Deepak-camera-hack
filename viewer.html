<!doctype html>

<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin:25px 0 8px;
    font-size:28px;
}

#status{
    text-align:center;
    color:#aaa;
    font-size:17px;
    margin-bottom:18px;
}

#grid{
    width:100%;
    padding:10px;
}

.camera-card{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    background:#000;
    border-radius:14px;
    overflow:hidden;
}

video{
    width:100%;
    display:block;
    aspect-ratio:16/9;
    background:#000;
    object-fit:cover;
}

.controls{
    display:flex;
    gap:8px;
    padding:10px;
    background:#181818;
}

button{
    flex:1;
    border:0;
    border-radius:9px;
    padding:12px 8px;
    background:#333;
    color:#fff;
    font-size:15px;
}

button:active{
    transform:scale(.97);
}

#message{
    text-align:center;
    color:#aaa;
    margin:30px 15px;
}

</style>

</head>

<body>

<h1>
    Multi Camera Viewer
</h1>

<div id="status">
    Connecting...
</div>

<div id="grid">

    <div class="camera-card">

        <video
            id="remoteVideo"
            autoplay
            playsinline
            muted>
        </video>

        <div class="controls">

            <button
                onclick="switchCamera('user')">
                📷 FRONT
            </button>

            <button
                onclick="switchCamera('environment')">
                🔄 BACK
            </button>

            <button
                onclick="fullscreen()">
                ⛶
            </button>

        </div>

    </div>

</div>

<div id="message">
    Waiting for Camera A...
</div>


<script>

/*
========================================
ELEMENTS
========================================
*/

const status =
    document.getElementById(
        "status"
    );

const video =
    document.getElementById(
        "remoteVideo"
    );

const message =
    document.getElementById(
        "message"
    );


/*
========================================
VIEWER ID
========================================
*/

const viewerId =
    "viewer-" +
    Math.random()
    .toString(36)
    .substring(2,10);


/*
========================================
WEBSOCKET
========================================
*/

const protocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

const ws =
    new WebSocket(
        protocol +
        "//" +
        location.host
    );


/*
========================================
CAMERA
========================================
*/

let cameraId = null;

let pc = null;

let iceQueue = [];


/*
========================================
CONNECT
========================================
*/

ws.onopen = () => {

    status.textContent =
        "Connected";

    ws.send(JSON.stringify({

        type:"viewer-register",

        viewerId:viewerId

    }));

};


/*
========================================
SERVER MESSAGE
========================================
*/

ws.onmessage = async event => {

    let msg;

    try{
        msg =
            JSON.parse(
                event.data
            );
    }
    catch{
        return;
    }


    /*
    CAMERA ONLINE
    */

    if(msg.type === "camera-online"){

        cameraId =
            msg.cameraId;

        message.textContent =
            "Camera A online";

        startView();

        return;
    }


    /*
    CAMERA OFFLINE
    */

    if(msg.type === "camera-offline"){

        video.srcObject = null;

        message.textContent =
            "Camera A offline";

        status.textContent =
            "Camera offline";

        return;
    }


    /*
    OFFER
    */

    if(msg.type === "offer"){

        await handleOffer(
            msg
        );

        return;
    }


    /*
    ICE
    */

    if(msg.type === "ice"){

        await handleIce(
            msg
        );

    }

};


/*
========================================
START VIEW
========================================
*/

function startView(){

    if(!cameraId)
        return;


    ws.send(JSON.stringify({

        type:"start-view",

        cameraId:cameraId,

        viewerId:viewerId

    }));


    status.textContent =
        "Connecting to camera...";
}


/*
========================================
OFFER
========================================
*/

async function handleOffer(msg){

    if(!cameraId)
        cameraId = msg.cameraId;


    /*
    Close old connection
    */

    if(pc){

        try{
            pc.close();
        }
        catch{}

    }


    iceQueue = [];


    pc =
        new RTCPeerConnection({

            iceServers:[

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }

            ]

        });


    /*
    ====================================
    VIDEO RECEIVED
    ====================================
    */

    pc.ontrack = event => {

        console.log(
            "Remote video received"
        );


        if(event.streams[0]){

            video.srcObject =
                event.streams[0];

            video.play()
            .catch(
                () => {}
            );


            status.textContent =
                "LIVE";

            message.textContent =
                "Camera A is live";

        }

    };


    /*
    ====================================
    ICE
    ====================================
    */

    pc.onicecandidate = event => {

        if(!event.candidate)
            return;


        ws.send(JSON.stringify({

            type:"ice",

            cameraId:cameraId,

            viewerId:viewerId,

            candidate:event.candidate

        }));

    };


    /*
    ====================================
    STATE
    ====================================
    */

    pc.onconnectionstatechange = () => {

        console.log(
            "WebRTC:",
            pc.connectionState
        );


        if(
            pc.connectionState ===
            "connected"
        ){

            status.textContent =
                "LIVE";

            message.textContent =
                "Camera A is live";

        }


        if(
            pc.connectionState ===
            "failed"
        ){

            status.textContent =
                "Connection failed";

        }

    };


    try{

        await pc.setRemoteDescription(
            msg.offer
        );


        /*
        Add queued ICE
        */

        for(
            const candidate
            of iceQueue
        ){

            try{

                await pc.addIceCandidate(
                    candidate
                );

            }
            catch{}

        }

        iceQueue = [];


        /*
        Answer
        */

        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        ws.send(JSON.stringify({

            type:"answer",

            cameraId:cameraId,

            viewerId:viewerId,

            answer:answer

        }));


    }
    catch(error){

        console.error(
            "Offer handling:",
            error
        );

        status.textContent =
            "WebRTC error";

    }
}


/*
========================================
ICE
========================================
*/

async function handleIce(msg){

    if(!pc)
        return;


    if(
        !pc.remoteDescription
    ){

        iceQueue.push(
            msg.candidate
        );

        return;
    }


    try{

        await pc.addIceCandidate(
            msg.candidate
        );

    }
    catch(error){

        console.error(
            "ICE:",
            error
        );

    }
}


/*
========================================
SWITCH CAMERA
========================================
*/

function switchCamera(facing){

    if(!cameraId)
        return;


    status.textContent =
        facing === "user"
        ? "Switching to FRONT..."
        : "Switching to BACK...";


    ws.send(JSON.stringify({

        type:"switch-camera",

        cameraId:cameraId,

        viewerId:viewerId,

        facing:facing

    }));

}


/*
========================================
FULLSCREEN
========================================
*/

function fullscreen(){

    if(
        video.requestFullscreen
    ){

        video.requestFullscreen();

    }

    else if(
        video.webkitEnterFullscreen
    ){

        video.webkitEnterFullscreen();

    }

}


/*
========================================
WEBSOCKET
========================================
*/

ws.onclose = () => {

    status.textContent =
        "Disconnected";

};


ws.onerror = () => {

    status.textContent =
        "Connection error";

};

</script>

</body>

</html>
