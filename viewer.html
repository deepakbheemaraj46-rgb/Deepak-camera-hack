<!doctype html>
<html>
<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1">

<title>Live Camera Viewer</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#080b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  text-align:center;
}

/* =========================================================
   HEADER
========================================================= */

h1{
  font-size:24px;
  margin:20px 0 8px;
}

#status{
  font-size:15px;
  color:#aaa;
  margin:8px 12px 15px;
}

/* =========================================================
   LIVE COUNT
========================================================= */

.live-count{
  display:inline-block;
  margin-left:5px;
  padding:5px 9px;
  border-radius:20px;
  background:#123b25;
  color:#35e879;
  font-size:12px;
  font-weight:bold;
}

/* =========================================================
   GRID
========================================================= */

#grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:14px;

  padding:12px;

  width:100%;
}

/* =========================================================
   CAMERA CARD
========================================================= */

.card{
  background:#10151b;
  border:1px solid #29313a;
  border-radius:14px;
  padding:9px;
  min-width:0;
  overflow:hidden;
  text-align:left;
}

/* =========================================================
   CAMERA HEADER
========================================================= */

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  padding:3px 3px 9px;
}

.label{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:16px;
  font-weight:bold;
  color:#fff;
  min-width:0;
}

/* GREEN LIVE DOT */

.live-dot{
  width:9px;
  height:9px;
  flex-shrink:0;
  border-radius:50%;
  background:#35e879;

  box-shadow:
    0 0 7px #35e879;
}

/* LIVE BADGE */

.live-badge{
  background:#123b25;
  color:#35e879;
  padding:5px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:bold;
  flex-shrink:0;
}

/* =========================================================
   VIDEO
========================================================= */

.video-wrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#000;
  border-radius:9px;
}

.card video{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
  border-radius:9px;
}

/* =========================================================
   FULLSCREEN BUTTON
========================================================= */

.fullscreen-btn{
  width:100%;
  margin-top:8px;
  padding:9px;
  border:1px solid #343c45;
  border-radius:7px;
  background:#181e25;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

.fullscreen-btn:active{
  background:#303943;
}

/* =========================================================
   STATE
========================================================= */

.state{
  font-size:12px;
  padding:7px 3px;
  color:#9da6af;
}

/* =========================================================
   CAMERA ID
========================================================= */

.camera-id{
  font-size:10px;
  color:#666;
  margin-top:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================================================
   FULLSCREEN VIDEO
========================================================= */

video:fullscreen{
  width:100vw;
  height:100vh;
  object-fit:contain;
  background:#000;
}

video:-webkit-full-screen{
  width:100vw;
  height:100vh;
  object-fit:contain;
  background:#000;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  padding:20px 10px;
  color:#666;
  font-size:12px;
}

.footer .secure{
  color:#35e879;
  margin-bottom:6px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  h1{
    font-size:21px;
    margin:15px 0 6px;
  }

  #status{
    font-size:13px;
    margin-bottom:8px;
  }

  #grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:7px;
    padding:7px;
  }

  .card{
    padding:6px;
    border-radius:10px;
  }

  .card-header{
    padding:2px 2px 6px;
  }

  .label{
    font-size:12px;
    gap:4px;
  }

  .live-dot{
    width:7px;
    height:7px;
  }

  .live-badge{
    padding:3px 5px;
    font-size:8px;
  }

  .state{
    font-size:9px;
    padding:5px 2px;
  }

  .camera-id{
    font-size:8px;
  }

  .fullscreen-btn{
    margin-top:5px;
    padding:7px 3px;
    font-size:10px;
  }

}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:360px){

  #grid{
    gap:5px;
    padding:5px;
  }

  .card{
    padding:4px;
  }

  .label{
    font-size:10px;
  }

  .live-badge{
    font-size:7px;
    padding:3px 4px;
  }

  .fullscreen-btn{
    font-size:9px;
    padding:6px 2px;
  }

}

</style>

</head>

<body>

<h1>📹 Live Camera Viewer</h1>

<div id="status">
  Connecting...
</div>

<div id="grid"></div>

<div class="footer">

  <div class="secure">
    🛡 Secure WebRTC Connection
  </div>

  Live Camera Viewer

</div>


<script>

/*
