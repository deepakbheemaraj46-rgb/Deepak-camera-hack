<!doctype html>

<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Multi Camera Viewer</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    margin:28px 10px 8px;
    font-size:28px;
}

#status{
    text-align:center;
    color:#aaa;
    font-size:17px;
    margin-bottom:20px;
}

#message{
    text-align:center;
    color:#aaa;
    font-size:17px;
    margin:25px 10px;
}

#grid{
    width:100%;
    padding:10px;
}

.camera-card{
    width:100%;
    max-width:1000px;
    margin:0 auto;
    background:#000;
    border-radius:16px;
    overflow:hidden;
}

video{
    width:100%;
    aspect-ratio:16/9;
    display:block;
    background:#000;
    object-fit:contain;
}

.controls{
    display:grid;
    grid-template-columns:
        1fr 1fr 1fr;

    gap:10px;

    padding:10px;

    background:#191919;
}

button{
    min-height:60px;

    border:0;

    border-radius:12px;

    background:#333;

    color:#fff;

    font-size:16px;

    font-weight:500;
}

button:active{
    transform:scale(.97);
}

button:disabled{
    opacity:.5;
}

@media(max-width:500px){

    h1{
        font-size:27px;
    }

    video{
        aspect-ratio:16/9;
    }

    button{
        font-size:15px;
        min-height:58px;
    }

}

</style>

</head>

<body>

<h1>
    Multi Camera Viewer
</h1>

<div id="status">
    Connecting...
</div>


<div id="grid">

    <div class="camera-card">

        <video
            id="remoteVideo"
            autoplay
            playsinline
            controls>
        </video>


        <div class="controls">

            <button
                id="frontButton"
                onclick="switchCamera('user')">
                📷 FRONT
            </button>


            <button
                id="backButton"
                onclick="switchCamera('environment')">
                🔄 BACK
            </button>


            <button
                onclick="makeFullscreen()">
                ⛶ FULLSCREEN
            </button>

        </div>

    </div>

</div>


<div id="message">
    Waiting for Camera A...
</div>


<script>

/*
==================================================
ELEMENTS
==================================================
*/

const status =
    document.getElementById(
        "status"
    );

const message =
    document.getElementById(
        "message"
    );

const video =
    document.getElementById(
        "remoteVideo"
    );


/*
==================================================
VIEWER ID
==================================================
*/

const viewerId =
    "viewer-" +
    Math.random()
    .toString(36)
    .substring(2,10);


/*
==================================================
WEBSOCKET
==================================================
*/

const wsProtocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

let ws = null;


/*
==================================================
CAMERA
==================================================
*/

let cameraId = null;


/*
==================================================
PEER
==================================================
*/

let pc = null;

let remoteIceQueue = [];

let remoteDescriptionSet =
    false;


/*
==================================================
CONNECT
==================================================
*/

function connect(){

    ws =
        new WebSocket(
            wsProtocol +
            "//" +
            location.host
        );


    ws.onopen = () => {

        console.log(
            "Viewer WebSocket connected"
        );


        status.textContent =
            "Connected";


        sendToServer({

            type:
                "viewer-register",

            viewerId:
                viewerId

        });

    };


    ws.onmessage =
        async (event) => {

            let msg;

            try {

                msg =
                    JSON.parse(
                        event.data
                    );

            }

            catch {

                return;

            }


            /*
            ----------------------------------
            CAMERA ONLINE
            ----------------------------------
            */

            if (
                msg.type ===
                "camera-online"
            ) {

                if (!cameraId) {

                    cameraId =
                        msg.cameraId;

                    message.textContent =
                        "Camera A online";

                    startView();

                }

                return;
            }


            /*
            ----------------------------------
            CAMERA OFFLINE
            ----------------------------------
            */

            if (
                msg.type ===
                "camera-offline"
            ) {

                if (
                    msg.cameraId ===
                    cameraId
                ) {

                    video.srcObject =
                        null;

                    status.textContent =
                        "Camera offline";

                    message.textContent =
                        "Camera A is offline";

                }

                return;
            }


            /*
            ----------------------------------
            OFFER
            ----------------------------------
            */

            if (
                msg.type ===
                "offer"
            ) {

                await handleOffer(
                    msg
                );

                return;
            }


            /*
            ----------------------------------
            ICE
            ----------------------------------
            */

            if (
                msg.type ===
                "ice"
            ) {

                await handleIce(
                    msg
                );

                return;
            }

        };


    ws.onclose = () => {

        console.log(
            "Viewer WebSocket closed"
        );

        status.textContent =
            "Disconnected. Reconnecting...";

        setTimeout(
            connect,
            3000
        );

    };


    ws.onerror = () => {

        console.log(
            "Viewer WebSocket error"
        );

    };

}


/*
==================================================
START VIEW
==================================================
*/

function startView(){

    if (!cameraId) {
        return;
    }


    status.textContent =
        "Connecting to Camera A...";


    sendToServer({

        type:
            "start-view",

        cameraId:
            cameraId,

        viewerId:
            viewerId

    });

}


/*
==================================================
CREATE PEER
==================================================
*/

function createPeer(){

    if (pc) {

        try {
            pc.close();
        }

        catch {}

    }


    remoteIceQueue = [];

    remoteDescriptionSet =
        false;


    pc =
        new RTCPeerConnection({

            iceServers: [

                {
                    urls:
                    "stun:stun.l.google.com:19302"
                }

            ]

        });


    /*
    ==========================================
    REMOTE VIDEO
    ==========================================
    */

    pc.ontrack =
        async (event) => {

            console.log(
                "VIDEO TRACK RECEIVED"
            );


            if (
                event.streams &&
                event.streams[0]
            ) {

                video.srcObject =
                    event.streams[0];


                try {

                    await video.play();

                }

                catch (error) {

                    console.log(
                        "Video play:",
                        error
                    );

                }


                status.textContent =
                    "LIVE";

                message.textContent =
                    "Camera A is live";

            }

        };


    /*
    ==========================================
    ICE
    ==========================================
    */

    pc.onicecandidate =
        (event) => {

            if (
                !event.candidate
            ) {
                return;
            }


            sendToServer({

                type:
                    "ice",

                cameraId:
                    cameraId,

                viewerId:
                    viewerId,

                candidate:
                    event.candidate

            });

        };


    /*
    ==========================================
    CONNECTION STATE
    ==========================================
    */

    pc.onconnectionstatechange =
        () => {

            console.log(
                "WebRTC connection:",
                pc.connectionState
            );


            if (
                pc.connectionState ===
                "connected"
            ) {

                status.textContent =
                    "LIVE";

                message.textContent =
                    "Camera A is live";

            }


            if (
                pc.connectionState ===
                "connecting"
            ) {

                status.textContent =
                    "Connecting video...";

            }


            if (
                pc.connectionState ===
                "disconnected"
            ) {

                status.textContent =
                    "Video disconnected";

            }


            if (
                pc.connectionState ===
                "failed"
            ) {

                status.textContent =
                    "Video connection failed";

                message.textContent =
                    "WebRTC connection failed";

            }

        };


    /*
    ==========================================
    ICE STATE
    ==========================================
    */

    pc.oniceconnectionstatechange =
        () => {

            console.log(
                "ICE state:",
                pc.iceConnectionState
            );

        };

}


/*
==================================================
HANDLE OFFER
==================================================
*/

async function handleOffer(
    msg
){

    cameraId =
        msg.cameraId;


    /*
    If we don't have peer,
    create it.
    */

    if (!pc) {
        createPeer();
    }


    try {

        /*
        Set remote offer
        */

        await pc
        .setRemoteDescription(
            new RTCSessionDescription(
                msg.offer
            )
        );


        remoteDescriptionSet =
            true;


        /*
        Add queued ICE
        */

        for (
            const candidate
            of remoteIceQueue
        ) {

            try {

                await pc
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

            }

            catch (error) {

                console.error(
                    "Queued ICE:",
                    error
                );

            }

        }


        remoteIceQueue = [];


        /*
        Create answer
        */

        const answer =
            await pc.createAnswer();


        await pc
        .setLocalDescription(
            answer
        );


        /*
        Send answer
        */

        sendToServer({

            type:
                "answer",

            cameraId:
                cameraId,

            viewerId:
                viewerId,

            answer:
                pc.localDescription

        });


        status.textContent =
            "Connecting video...";

    }

    catch (error) {

        console.error(
            "Offer error:",
            error
        );

        status.textContent =
            "WebRTC error";

    }

}


/*
==================================================
HANDLE ICE
==================================================
*/

async function handleIce(
    msg
){

    if (!pc) {

        createPeer();

    }


    /*
    ICE arrived before
    remote description.
    */

    if (
        !remoteDescriptionSet
    ) {

        remoteIceQueue.push(
            msg.candidate
        );

        return;

    }


    try {

        await pc
        .addIceCandidate(
            new RTCIceCandidate(
                msg.candidate
            )
        );

    }

    catch (error) {

        console.error(
            "ICE error:",
            error
        );

    }

}


/*
==================================================
FRONT / BACK
==================================================
*/

function switchCamera(
    facing
){

    if (!cameraId) {

        message.textContent =
            "Camera A is not online";

        return;

    }


    status.textContent =
        facing === "user"
        ? "Switching to FRONT..."
        : "Switching to BACK...";


    sendToServer({

        type:
            "switch-camera",

        cameraId:
            cameraId,

        viewerId:
            viewerId,

        facing:
            facing

    });

}


/*
==================================================
FULLSCREEN
==================================================
*/

function makeFullscreen(){

    if (
        video.requestFullscreen
    ) {

        video.requestFullscreen();

        return;

    }


    if (
        video.webkitRequestFullscreen
    ) {

        video.webkitRequestFullscreen();

        return;

    }


    if (
        video.webkitEnterFullscreen
    ) {

        video.webkitEnterFullscreen();

    }

}


/*
==================================================
SEND
==================================================
*/

function sendToServer(
    data
){

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.send(
            JSON.stringify(data)
        );

    }

}


/*
==================================================
START
==================================================
*/

connect();

</script>

</body>

</html>
